],"evidence_ids":["ENG-EVID-0036"],"current_quantity":"UNKNOWN","current_serviceability":"UNKNOWN","current_unit_distribution":"UNKNOWN","current_value_status":"CURRENT_2026_STATUS_UNRESOLVED","confidence":"HIGH_FOR_PROCUREMENT_RECORD_LOW_FOR_CURRENT_FLEET_STATUS"},{"id":"ENG-DOC-0027","type":"ENG-DOC","country":"NATO","title_cs":"AJP-3.18 — revizní a validační časová osa","title_en":"AJP-3.18 — revision and validation timeline","edition_status":"METADATA_AMBIGUITY_CURRENT_EDITION_NOT_RESOLVED","source_ids":["ENG-SRC-0316","ENG-SRC-0317","ENG-SRC-0320"],"evidence_ids":["ENG-EVID-0035","ENG-EVID-0038"],"confidence":"HIGH_FOR_REVISION_ACTIVITY_MEDIUM_FOR_CURRENT_EDITION_STATUS"},{"id":"ENG-DOC-0027","type":"ENG-DOC","country":"NATO","title_cs":"AJP-3.18 — veřejně potvrzená Edition B Version 1 a pokračující revizní aktivita","source_ids":["ENG-SRC-0323","ENG-SRC-0324","ENG-SRC-0320","ENG-SRC-0316"],"evidence_ids":["ENG-EVID-0035","ENG-EVID-0038","ENG-EVID-0040"],"official_title":"Allied Joint Doctrine for Explosive Ordnance Disposal Support to Operations"},{"id":"ENG-TECH-0033","type":"ENG-TECH","country":"CZE","title_cs":"PM-55 — přepravník mostu","current_value_status":"CURRENT_2026_INVENTORY_UNRESOLVED","source_ids":["ENG-SRC-0327","ENG-SRC-0333"],"evidence_ids":["ENG-EVID-0042"],"confidence":"HIGH_FOR_TRANSFER_LOW_MEDIUM_FOR_EXACT_CHASSIS_LABEL","update_type":"HISTORICAL_DISPOSAL_TRANSFER_ENRICHMENT"},{"id":"ENG-TECH-0029","type":"ENG-TECH","country":"CZE","title_cs":"MT-55A — mostní tank","current_value_status":"CURRENT_2026_INVENTORY_UNRESOLVED","source_ids":["ENG-SRC-0327"],"evidence_ids":["ENG-EVID-0042"],"confidence":"HIGH_FOR_TRANSFER_LOW_FOR_CURRENT_FLEET_STATUS","update_type":"HISTORICAL_DISPOSAL_TRANSFER_ENRICHMENT"},{"id":"ENG-TTP-0001","type":"ENG-TTP","country":"CZE","title_cs":"Veřejné rozhraní EOR → EOD v AČR","mine_action_context":"ERW_CLEARANCE","classification":"FACT_ABOUT_OFFICIAL_PUBLIC_DESCRIPTION","source_ids":["ENG-SRC-0328"],"evidence_ids":["ENG-EVID-0043"],"confidence":"HIGH_FOR_PUBLIC_ROLE_DESCRIPTION","update_type":"CLEARANCE_CONTEXT_ENRICHMENT"},{"id":"ENG-SIG-0009","type":"TECHNOLOGY_SIGNAL","country":"UKR","title_cs":"Institucionalizované veřejné pojetí ženijních pozemních robotických systémů","classification":"ANALYST_SYNTHESIS_FROM_PRIMARY_PUBLIC_DESCRIPTIONS","stage":"MULTIPLE_UNIT_EXAMPLES_PUBLICLY_CONFIRMED_STANDARDIZATION_NOT_PROVEN","source_ids":["ENG-SRC-0293","ENG-SRC-0329"],"evidence_ids":["ENG-EVID-0021","ENG-EVID-0044"],"confidence":"MEDIUM_HIGH","update_type":"MULTIPLE_UNIT_EXAMPLE_ENRICHMENT"},{"id":"ENG-TECH-0033","type":"ENG-TECH","country":"CZE","update_type":"MULTI_CHASSIS_PUBLIC_EVIDENCE_ENRICHMENT","title_cs":"PM-55 — přepravník mostu","title_en":"PM-55 — bridge transporter","summary_cs":"Veřejné zdroje AČR potvrzují, že označení PM-55 se v českých vojenských materiálech objevuje ve spojení s Tatra T-813 i se speciálním T-815. Oficiální Flickr AČR z 28. 3. 2011 explicitně označuje T 813 PM-55; technická stránka AČR zároveň uvádí PM-55 mezi speciálními T-815. To oslabuje jednoduchý výklad, že rozpor u převodu do Králík je pouze překlep. Přesná konfigurace konkrétního předaného kusu z 10. 2. 2026 však bez přílohy smlouvy zůstává nevyřešena. Současný počet a serviceability PM-55 v AČR jsou UNKNOWN.","current_value_status":"CURRENT_2026_INVENTORY_UNRESOLVED","source_ids":["ENG-SRC-0327","ENG-SRC-0333","ENG-SRC-0336","ENG-SRC-0337"],"evidence_ids":["ENG-EVID-0042","ENG-EVID-0048"],"confidence":"HIGH_FOR_PM55_MULTI_CHASSIS_PUBLIC_ASSOCIATION_LOW_MEDIUM_FOR_2026_TRANSFER_EXACT_CONFIGURATION"},{"id":"ENG-SIG-0009","type":"TECHNOLOGY_SIGNAL","country":"UKR","update_type":"PRIMARY_ORGANIZATIONAL_CORROBORATION_AND_SURVIVABILITY_ENRICHMENT","title_cs":"Institucionalizované veřejné pojetí ženijních pozemních robotických systémů","title_en":"Institutional public framing of engineering ground robotic systems","stage":"MULTIPLE_UNIT_EXAMPLES_PUBLICLY_CONFIRMED_STANDARDIZATION_NOT_PROVEN","summary_cs":"B42 přidává dvě další primární vrstvy k 91. brigádě podpory: oficiální recruiting profil ji popisuje jako významný útvar ženijního zabezpečení a ArmyInform dokumentuje současnou jednotkovou adaptaci ženijních pracovních skupin na trvalou UAS hrozbu. ArmyInform nadále explicitně používá označení prapor bezosádkových systémů pro prvek plnící ženijní úkoly. Důkaz organizační difuze je silnější, avšak veřejný formální ORBAT/order stále chybí a MilitaryLand používá obecnější označení UAS unit „Kat“.","source_ids":["ENG-SRC-0293","ENG-SRC-0329","ENG-SRC-0335","ENG-SRC-0338"],"evidence_ids":["ENG-EVID-0021","ENG-EVID-0044","ENG-EVID-0049"],"confidence":"MEDIUM_HIGH"},{"id":"ENG-SRC-0334"},{"id":"ENG-TECH-0024","type":"ENG-TECH","country":"CZE","update_type":"PROCUREMENT_AND_MAINTENANCE_TRAIL_ENRICHMENT","title_cs":"EOD robotické a specializované vybavení 15. ženijního pluku — veřejná časová řada","summary_cs":"B43 přidává Telemax defektaci 8. 7. 2025 a zrušený NEN procurement na průzkumný pyrotechnický robot 7. 4. 2026. Current 2026 quantity/serviceability/unit distribution zůstávají UNKNOWN.","current_quantity":"UNKNOWN","current_serviceability":"UNKNOWN","current_unit_distribution":"UNKNOWN","current_value_status":"CURRENT_UNKNOWN","source_ids":["ENG-SRC-0339","ENG-SRC-0340"],"evidence_ids":["ENG-EVID-0050","ENG-EVID-0051"]},{"id":"ENG-UNIT-0032","type":"ENG-UNIT","country":"CZE","update_type":"BCMD_CAPABILITY_PROFILE_ENRICHMENT","title_cs":"152. ženijní prapor","title_en":"152nd Engineer Battalion","summary_cs":"Oficiální stránka úkolů 152. žpr veřejně uvádí Tým BCMD s prioritní rolí při detekci a identifikaci chemické/biologické munice a podle situace při její neutralizaci/likvidaci, s důrazem na jednotné velení a řízení a dodržování CWC. Veřejná struktura v B44 neumožňuje bezpečně určit přesnou interní parentage BCMD týmu, úplné TO&E, personální stav, certifikaci ani readiness.","summary_en":"The official 152nd Engineer Battalion tasks page publicly identifies a BCMD Team with a priority role in detecting and identifying chemical/biological munitions and, depending on the situation, their neutralisation/disposal, with emphasis on unified command and control and CWC compliance. B44 public structure does not safely establish the team's exact internal parentage, complete TO&E, manning, certification or readiness.","temporal_observations":[{"observed_at":"2026-08-18","observation_type":"PUBLIC_BCMD_CAPABILITY_PROFILE","temporal_status":"CURRENT_PUBLIC_PROFILE","source_ids":["ENG-SRC-0346"],"evidence_ids":["ENG-EVID-0056"]}],"source_ids":["ENG-SRC-0346"],"evidence_ids":["ENG-EVID-0056"],"translation_status":"ANALYST_TRANSLATION","confidence":"HIGH_FOR_PUBLIC_CAPABILITY_DESCRIPTION_LOW_FOR_EXACT_INTERNAL_STRUCTURE"},{"id":"ENG-SIG-0009","type":"ENG-SIG","country":"UKR","update_type":"DIFFUSION_EVIDENCE_ENRICHMENT","title_cs":"Ukrajina — bezosádkové prostředky v ženijních úlohách a organizační adaptaci","title_en":"Ukraine — unmanned systems in engineer tasks and organisational adaptation","summary_cs":"B44 přidává další dvě primární veřejné indicie šíření unmanned-engineering rolí: 808. brigádu podpory s dálkovým minováním vedeným/reportovaným v DELTA a náborovou roli operátora-sapéra bezpilotních systémů rozminování u 154. mechanizované brigády. Důkaz difuze je silnější, ale stále neprokazuje jednotné force-wide TO&E, počet platforem, readiness nebo jednotnou organizační šablonu.","summary_en":"B44 adds two further primary public indicators of diffusion of unmanned-engineering roles: the 808th Support Brigade's remote mining reported/tracked in DELTA and a recruiting role for an unmanned demining-system sapper/operator in the 154th Mechanized Brigade. Evidence of diffusion is stronger, but it still does not establish a uniform force-wide TO&E, platform quantity, readiness or a single organisational template.","status":"MULTIPLE_PRIMARY_UNIT_AND_RECRUITING_EXAMPLES_STANDARDIZATION_NOT_PROVEN","source_ids":["ENG-SRC-0343","ENG-SRC-0348"],"evidence_ids":["ENG-EVID-0054","ENG-EVID-0058"],"translation_status":"ANALYST_TRANSLATION"},{"id":"ENG-UNIT-0030","type":"ENG-UNIT","country":"CZE","update_type":"CURRENT_COMMAND_PROFILE_ENRICHMENT","title_cs":"15. ženijní pluk","title_en":"15th Engineer Regiment","summary_cs":"Aktuální veřejná stránka velení 15. ženijního pluku, ověřená 18. 8. 2026, uvádí jako velitele plk. gšt. Ing. Jiřího Machoně; jeho služební profil uvádí nástup do této funkce v roce 2026. Stejná stránka uvádí od roku 2026 také plk. gšt. Ing. Martina Štencla jako zástupce velitele, pplk. Ing. Michala Cieslara jako náčelníka štábu a pplk. Ing. Martina Žeravu jako zástupce náčelníka štábu. Jde o current public command profile, nikoli úplné personální obsazení pluku.","summary_en":"The current public 15th Engineer Regiment command page, verified on 18 Aug 2026, lists Col. Jiří Machoň as commander; his service profile states that he took the position in 2026. The same page lists Col. Martin Štencl as deputy commander, Lt Col. Michal Cieslar as chief of staff, and Lt Col. Martin Žerava as deputy chief of staff from 2026. This is a current public command profile, not complete manning data.","command_profile":{"as_of":"2026-08-18","commander":"plk. gšt. Ing. Jiří Machoň","deputy_commander":"plk. gšt. Ing. Martin Štencl","chief_of_staff":"pplk. Ing. Michal Cieslar","deputy_chief_of_staff":"pplk. Ing. Martin Žerava","status":"CURRENT_PUBLIC_PROFILE"},"source_ids":["ENG-SRC-0350"],"evidence_ids":["ENG-EVID-0059"],"translation_status":"ANALYST_TRANSLATION","confidence":"HIGH_FOR_PUBLIC_COMMAND_PROFILE"},{"id":"ENG-DOC-0028","type":"ENG-DOC","country":"NATO","update_type":"2026_DELIVERY_SCHEDULE_ENRICHMENT","title_cs":"MEG-EO-32127 — NATO CBRN EOD Incident Management Staff Officer Training","title_en":"MEG-EO-32127 — NATO CBRN EOD Incident Management Staff Officer Training","summary_cs":"B45 doplňuje k již materializovaným e-ITEP metadatům veřejný harmonogram EOD COE pro rok 2026: NATO CBRN EO function relationTargets(id){
  const ids=new Set();
  App.relations.forEach(r=>{if(r.from===id)ids.add(r.to);if(r.to===id)ids.add(r.from)});
  const e=App.entities.get(id); (e?.related||[]).forEach(x=>ids.add(x));
  return [...ids].filter(x=>App.entities.has(x));
}
function chips(id){const xs=relationTargets(id); return xs.length?`<div class="linkchips">${xs.map(x=>`<button class="chip" data-open="${esc(x)}">${esc(x)}</button>`).join("")}</div>`:""}
function filteredRecords(){
  const f=App.filters;
  return App.data.records.records.filter(r=>{
    if(f.country && r.country!==f.country)return false;
    if(f.capability && r.capability!==f.capability)return false;
    if(f.type && r.type!==f.type)return false;
    if(f.classification && r.classification!==f.classification)return false;
    if(f.search && !JSON.stringify(r).toLowerCase().includes(f.search))return false;
    return true;
  })
}
function recordCard(r){
  return `<article class="entity-card" data-open="${esc(r.id)}">
    <div class="entity-head"><div><div class="entity-id mono">${esc(r.id)}</div><h3>${esc(r.title)}</h3></div><div>${tag(r.classification)} ${tag(r.origin)}</div></div>
    <div class="meta"><span>${esc(r.country)}</span><span>${esc(r.capability)}</span><span>${esc(r.date)}</span><span>Confidence ${esc(r.confidence)}</span><span>Tier ${esc(r.source_tier)}</span></div>
    <div class="evidence">
      <div class="ebox fact"><b>FACT / CLAIM</b>${esc(r.fact)}</div>
      <div class="ebox analysis"><b>ANALYTICAL INTERPRETATION</b>${esc(r.analysis)}</div>
      <div class="ebox limit"><b>WHAT IT DOES NOT PROVE</b>${esc(r.limit)}</div>
    </div>
    <div class="meta">Mine action: <strong>${esc(r.mine_action_context)}</strong> · Run: ${esc(r.run_id||"—")}</div>
    ${chips(r.id)}
  </article>`
}
function recordsView(rs){return `<div class="records">${rs.length?rs.map(recordCard).join(""):`<div class="card empty">Žádné záznamy neodpovídají filtrům.</div>`}</div>`}

function bindOpeners(){document.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click",ev=>{const b=ev.target.closest("[data-open]"); if(b)openDetail(b.dataset.open)}))}
function openDetail(id){
 const e=App.entities.get(id); if(!e)return;
 const related=relationTargets(id);
 const sourceLinks=(e.source_ids||[]).map(s=>App.entities.get(s)).filter(Boolean);
 let html=`<div class="entity-id mono">${esc(id)}</div><h2 class="detail-title">${esc(e.title||e.name||e.topic||id)}</h2>`;
 if(e.classification)html+=`${tag(e.classification)} `;
 if(e.type)html+=tag(e.type);
 html+=`<div class="detail-section provenance"><b>Entity type:</b> ${esc(e.type||"registry entity")}<br><b>Country:</b> ${esc(e.country||"—")}<br><b>Run:</b> ${esc(e.run_id||"—")}</div>`;
 [["FACT / EVIDENCE",e.fact||e.evidence],["ANALYTICAL INTERPRETATION",e.analysis||e.interpretation],["WHAT IT DOES NOT PROVE / LIMIT",e.limit||e.does_not_prove]].forEach(([h,t])=>{if(t)html+=`<div class="detail-section"><h4>${h}</h4><p>${esc(t)}</p></div>`});
 if(e.note)html+=`<div class="detail-section"><h4>NOTE</h4><p>${esc(e.note)}</p></div>`;
 if(e.next_action)html+=`<div class="detail-section"><h4>NEXT ACTION</h4><p>${esc(e.next_action)}</p></div>`;
 if(e.id_collision_variants?.length)html+=`<div class="detail-section"><h4>ID COLLISION VARIANTS</h4>${e.id_collision_variants.map(v=>`<div class="item"><strong>${esc(v.title||e.id)}</strong><div class="muted">Run: ${esc(v.run_id||"—")}</div></div>`).join("")}</div>`;
 if(related.length)html+=`<div class="detail-section"><h4>RELATED ENTITIES</h4><div class="linkchips">${related.map(x=>`<button class="chip" data-open="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>`;
 if(sourceLinks.length)html+=`<div class="detail-section"><h4>SOURCES</h4>${sourceLinks.map(s=>item(s.id,s.name)).join("")}</div>`;
 $("#detailContent").innerHTML=html; bindOpeners(); $("#detailDialog").showModal();
}

 window.addEventListener("hashchange",render);render();
}
init().catch(err=>$("#view").innerHTML=`<div class="card empty"><b>Chyba načtení dat:</b><br>${esc(err.message)}<br><br>Spusť dashboard přes HTTP server, ne file://.</div>`);

  put('ENG-EVT-0021',{title_cs:'240m plovoucí most přes Eufrat v Dajr az-Zauru',summary_cs:'Türkiye MSB 9. července 2026 uvedlo dokončení 240m plovoucího mostu ženijní brigádou 2. armády.',intelligence_gaps_cs:['Přesný typ/model mostního systému','Počet modulů a zatěžovací klasifikace','Doba výstavby a počet nasazených ženistů','Zda šlo o taktické dočasné přemostění, nebo o přechod určený k delšímu operačnímu použití','Navazující doklad o provozu/otevření po kontrolních přejezdech']});
  translateClaims('ENG-EVT-0021',['Turecké ministerstvo národní obrany uvedlo, že ženijní brigáda 2. armády dokončila v Dajr az-Zauru 240m plovoucí most přes Eufrat.','Ministerstvo uvedlo, že most bude 10. července po kontrolních přejezdech otevřen.','Přesný model mostního systému a jeho zatěžovací klasifikace nejsou v citovaném sdělení zveřejněny.']);
  put('LEAD-001',{title_cs:'EOC standardizace — identita annexu / study draftu',summary_cs:'Veřejné materiály NATO EOD WG potvrzují standardizační práci na EOC, ale přesné označení annexu/study draftu zůstává nezjištěné.',note_cs:'Veřejný záznam 68. NATO EOD WG uvádí, že minimální standardy odborné způsobilosti EOC budou znovu definovány s podporou komunity MILENG; EOD COE zároveň prezentovalo analýzu úkolů EOC v operacích NATO. Přesné označení pozdějšího annexu / study draftu zůstává v kontrolovaných veřejných materiálech nevyřešené.'});
  translateClaims('LEAD-001',['Veřejný záznam 68. NATO EOD WG uvádí, že minimální standardy odborné způsobilosti EOC budou znovu definovány s podporou komunity MILENG.','Tentýž veřejný záznam uvádí, že EOD COE prezentovalo analýzu týkající se úkolů EOC v operacích NATO.','Přesné označení pozdějšího EOC annexu / study draftu není ve veřejném záznamu 68. EOD WG zveřejněno.']);

  put('ENG-UNIT-0012',{title_cs:'Izraelský Combat Engineering Corps / Yahalom',summary_cs:'IDF veřejně popisuje Combat Engineering Corps jako sbor odpovědný mimo jiné za odstraňování minových polí, budování mostů a opevnění. Yahalom je zvláštní jednotka sboru pro specializované ženijní úkoly, nebezpečnou munici, komplexní minová pole a podzemní prostředí; IDF výslovně uvádí také používání robotů a dálkově ovládaných zařízení.',intelligence_gaps_cs:['Aktuální vztahy velení praporů/brigád Combat Engineering Corps a úplné TO&E k roku 2026','Současné rozdělení techniky podle praporů a rot','Přesný one-to-one převod izraelských odpovědností za nebezpečnou munici a minová pole do terminologie NATO EOD/EOC/EOR','Aktuální personální počty a údaje o připravenosti']});
  translateClaims('ENG-UNIT-0012',['IDF uvádí mezi odpovědnostmi Combat Engineering Corps odstraňování minových polí, výstavbu mostů a budování opevnění.','IDF popisuje Yahalom jako zvláštní bojovou jednotku Combat Engineering Corps se specializovanými ženijními úkoly, úkoly souvisejícími s nebezpečnou municí, komplexními minovými poli a podzemním prostředím.','IDF uvádí, že Yahalom v některých případech používá roboty a dálkově ovládaná zařízení ke snížení rizika pro personál.','Tyto izraelské veřejné popisy nelze automaticky považovat za přesné ekvivalenty kategorií NATO EOD/EOC/EOR.']);
  put('ENG-UNIT-0013',{title_cs:'Ženijní brigáda 2. armády Türkiye',summary_cs:'2nd Army Engineer Brigade je veřejně doložena jako turecká ženijní brigáda schopná realizovat rozsáhlejší úkoly překonávání vodních překážek mimo území Türkiye. Veřejný záznam z července 2026 ji přímo spojuje s dokončením 240m plovoucího mostu přes Eufrat v Dajr az-Zauru.',intelligence_gaps_cs:['Mírová podřízenost a detailní struktura brigády','Složení praporů a rot','Organické mostní systémy a jejich počty','Další současná operační nasazení a údaje o připravenosti']});

  put('ENG-TECH-0011',{title_cs:'SDZ — Système de dépollution de zone',summary_cs:'Francouzský SDZ je teleoperovaný systém pro čištění rozsáhlejších prostorů od nebezpečné munice a min, vyvinutý společností CEFA jako náhrada staršího MADEM. Veřejný armádní zdroj jej popisuje jako dvourobotový systém s důrazem na omezení expozice obsluhy.',intelligence_gaps_cs:['Přesný aktuální stav flotily po zveřejnění údajů 21. dubna 2026','Úplná veřejná technická specifikace obou robotů a výměnných pracovních nástrojů','Přesné doktrinální přiřazení francouzské terminologie dépollution k NATO kategoriím EOC a route/area clearance']});

  put('ENG-TECH-0012',{title_cs:'SYFRALL — modulární systém pro překonávání vodních překážek',summary_cs:'SYFRALL je francouzský modulární systém pro překonávání vodních překážek určený k obnově schopností wet-gap crossing. DGA objednala osm systémů, které mají dohromady představovat přibližně 300 metrů lineárního přemostění.',intelligence_gaps_cs:['Harmonogram dodávek a přidělení jednotlivým jednotkám','Aktuální stav kvalifikace nad rámec veřejně oznámených programových milníků','Přesné vojenské zatěžovací třídy a výkonnost jednotlivých konfigurací v autoritativních veřejně dostupných podkladech']});

  put('ENG-TECH-0013',{title_cs:'Namer Engineering',summary_cs:'Namer je silně chráněná izraelská pásová rodina obrněných transportérů spadající pod Merkava and Armored Vehicles Directorate. Pro ženijní kartu je veřejně doložitelná vazba rodiny Namer na izraelské chráněné manévrové platformy; dříve zachycené detailní konfigurace Namer Engineering je však nutné znovu ověřit na aktuálně dostupném oficiálním podkladu.',intelligence_gaps_cs:['Znovu ověřit historický veřejný zdroj pro tři konkrétní konfigurace Namer Engineering pro velení, breaching a bridging','Aktuální rozsah zavedení specializovaných ženijních variant Namer','Rozdělení ženijních konfigurací mezi jednotlivé jednotky','Samostatný operační důkaz výslovně identifikující ženijní variantu, nikoli obecnou rodinu Namer APC']});

  put('ENG-TECH-0014',{title_cs:'BLT Arjun — mostní tank',summary_cs:'BLT Arjun je těžký mostní tank na podvozku MBT Arjun. DRDO jej popisuje jako útočný mostní systém se způsobem pokládání slide-launch, mostní nástavbou MLC-70 a dvoučlennou osádkou.',intelligence_gaps_cs:['Aktuální počet zavedených kusů','Rozdělení mezi jednotky','Operační dostupnost a použití při cvičeních po posledním veřejném baseline','Současná omezení přepravy a vyprošťování']});
  translateClaims('ENG-TECH-0014',['BLT Arjun používá podvozek Arjun a mostní nástavbu MLC-70.','DRDO uvádí variantu 24m ocelového a 26m mostu z hliníkové slitiny a dvoučlennou osádku.','DRDO uvádí dobu položení nebo stažení mostu 10 minut.']);
  put('ENG-TECH-0015',{title_cs:'Short Span Bridge 10 m',summary_cs:'Short Span Bridge 10 m je indický mechanicky pokládaný mostní systém MLC-70 určený pro menší mezery a kanály do 10 metrů. DRDO zdůrazňuje mobilní pokládací prostředek a konstrukci navrženou pro rychlou obsluhu s minimálním počtem personálu.',intelligence_gaps_cs:['Aktuální počet kusů ve výzbroji','Přesný podvozek a konfigurace pokládacího prostředku u současných zavedených sérií','Rozdělení mezi jednotky a doklady z cvičení','Doba rozvinutí v polních podmínkách podle nezávislých nebo armádních zdrojů']});
  translateClaims('ENG-TECH-0015',['Systém je mechanicky pokládaný, má klasifikaci MLC-70 a je určen pro mezery a kanály do 10 metrů.','DRDO uvádí vysoce mobilní pokládací platformu, dvojitou podpěru typu A a koncepci s minimálním počtem obsluhy.']);

  put('ENG-SIG-0007',{title_cs:'Indie — autonomie a robotika pro bojové ženijní zabezpečení',summary_cs:'DRDO veřejně eviduje široké portfolio vývojových úkolů v autonomii a robotice relevantních pro combat engineering, včetně computer-vision perception, autonomní navigace UGV, human–robot teaming a robotických manipulátorů pro podporu bojového ženijního zabezpečení.',intelligence_gaps_cs:['Které vývojové úkoly již přešly do fáze prototypů','Které úkoly mají formální podporu uživatele z Indian Army','Stav akvizice nebo zkoušek autonomních systémů specificky určených pro combat engineering','Vztah mezi obecnými vývojovými úkoly UGV a zavedenými ženijními jednotkami']});

  put('ENG-SIG-0006',{
    title_cs:'USA — experimentální doprava ženijního prostředku pro breaching pomocí UAS',

    testing_evidence_cs:'Dne 22. června 2026 provedla Bravo Company, 741st Brigade Engineer Battalion, 41st Infantry Brigade Combat Team na Orchard Combat Training Center inertní a ostré proof-of-concept iterace. Armádní článek uvádí, že při ostré iteraci byl Bangalore dopraven k překážce z koncertiny a odpálen, čímž vytvořil průchod.',
    operational_evidence_cs:'Pouze MILITARY TESTING. Zdroj popisuje proof-of-concept během výročního výcviku a plánovaný battalion white paper pro ženijní komunitu; nedokládá operační nasazení, status programu zavedeného do výzbroje ani plošné přijetí TTP v U.S. Army.',

    training_relevance_cs:'Vhodné jako Lessons Learned případ pro postupné experimentální ověřování, integraci UAS do ženijních úkolů a práci s failure modes; nejde o náhradu schválených postupů pro výbušniny ani UAS.',
