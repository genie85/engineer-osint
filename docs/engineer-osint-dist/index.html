ks including field adaptations and advanced technology. Target audience explicitly spans EOD, C-IED, CBRN, DAT and MILENG SMEs.","analysis":"Supports continued cross-domain adaptation and technology exchange in the NATO EOD community.","limit":"Workshop themes are agenda signals, not proof that specific technologies or concepts are fielded.","confidence":"high","source_tier":"","mine_action_context":"NOT_APPLICABLE","origin":"BASELINE_ENRICHMENT","related":["ENG-TREND-0003"],"run_id":"engineer-osint-20260815-B02","source_ids":["ENG-SRC-0042"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":["NATO","EOD","MILENG","C-IED","technology","adaptation"],"_last_source_file":"engineer_osint_delta_engineer-osint-20260815-B02.json"},{"id":"ENG-EVT-0016","title":"Sea Breeze 26-2 links British Army engineer divers, Royal Navy EOD&S and Ukrainian Navy EOD","type":"ENG-EVT","classification":"NEW_BASELINE","country":"United Kingdom/Ukraine/USA/NATO partners","capability":"EOD / mine countermeasures / diving","date":"2026-07-13/24","fact":"Sea Breeze 26-2 in Portland focused on mine countermeasures, EOD, diving/salvage, unmanned underwater/surface systems and multinational C2. Official imagery and reporting identify British Army 22 Engineer Regiment dive team, British Royal Navy 33 EOD&S Regiment dive team and Ukrainian Navy EOD personnel training together. The reporting also describes ROV integration in the EOD/mine-countermeasure training environment.","analysis":"High-value interoperability case across land engineers, naval EOD and a partner force, with unmanned systems entering the joint EOD training workflow.","limit":"","confidence":"high","source_tier":"","mine_action_context":"EOC","origin":"BASELINE ENRICHMENT","related":["ENG-VIS-0002"],"run_id":"engineer-osint-20260815-B03","source_ids":["ENG-SRC-0050","ENG-SRC-0051"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":[],"_last_source_file":"engineer_osint_delta_engineer-osint-20260815-B03.json"},{"id":"ENG-EVT-0017","title":"Poland SAFE engineer/countermobility acquisition package — Mine action context updated under master 2.6","type":"ENG-EVT","classification":"UPDATE","country":"Poland","capability":"acquisition / countermobility / engineer systems","date":"2026-05-29","fact":"Polish MoD announced a package exceeding PLN 2 billion for engineering/countermobility systems under SAFE. The official statement says contracted systems will be integrated into engineer-troop structures and are intended to strengthen rapid/automated creation of anti-vehicle obstacles and battlefield management.","analysis":"Significant eastern-flank signal: Poland is industrializing and automating countermobility as a dedicated engineer capability line.","limit":"","confidence":"high","source_tier":"","mine_action_context":"NOT_APPLICABLE","origin":"BASELINE ENRICHMENT","related":[],"run_id":"engineer-osint-20260815-B04","source_ids":["ENG-SRC-0058"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":[],"_last_source_file":"engineer_osint_delta_engineer-osint-20260815-B04.json"},{"id":"ENG-EVT-0018","title":"Poland acquires M1150 Assault Breacher Vehicles for heavy-force engineering","type":"ENG-EVT","classification":"NEW_BASELINE","country":"Poland","capability":"mobility / combat breaching / armoured engineer vehicle","date":"2025-07-31","fact":"Polish MoD announced M1150 ABV acquisition and stated the intended recipient is the 18th Mechanized Division. The official Polish statement describes a two-person crew and a role in clearing routes through battlefield obstacles for land forces.","analysis":"Adds a heavy protected breach capability to Poland’s eastern-flank force-development baseline.","limit":"","confidence":"high for Polish acquisition statement","source_tier":"","mine_action_context":"COMBAT_BREACHING","origin":"BASELINE ENRICHMENT","related":[],"run_id":"engineer-osint-20260815-B03","source_ids":["ENG-SRC-0059"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":[],"_last_source_file":"engineer_osint_delta_engineer-osint-20260815-B03.json"},{"id":"ENG-EVT-0020","title":"NATO CAP publicly lists EOD/demining and counter-drone equipment support to Ukraine","type":"ENG-EVT","classification":"NEW_BASELINE","country":"NATO/Ukraine","capability":"","date":"current public support baseline verified 2026-08-15","fact":"NATO's current CAP page lists explosive ordnance disposal and demining equipment among non-lethal military assistance categories for Ukraine. The same page also lists counter-drone equipment among assistance categories.","analysis":"This confirms that EOD/demining and counter-UAS equipment remain explicit NATO assistance lines, but the public page does not provide sufficient mission-level detail to classify all demining support as military clearance, EOC or humanitarian demining.","limit":"The page is an umbrella assistance summary and does not establish quantities, recipients, delivery dates, readiness or operational employment.","confidence":"high for assistance category; low on sub-program detail","source_tier":"","mine_action_context":"UNKNOWN_NEEDS_REVIEW","origin":"BASELINE ENRICHMENT","related":[],"run_id":"engineer-osint-20260815-B04","source_ids":["ENG-SRC-0076"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":["Ukraine","NATO CAP","EOD","demining","counter-UAS","support"],"_last_source_file":"engineer_osint_delta_engineer-osint-20260815-B04.json"},{"id":"ENG-EVT-0021","title":"2nd Army Engineer Brigade 240 m Euphrates floating bridge","type":"ENG-EVT","classification":"UPDATE","country":"Türkiye","capability":"","date":"2026-07-09","fact":"","analysis":"","limit":"","confidence":"","source_tier":"","mine_action_context":"NOT_APPLICABLE","origin":"RECOVERED_BASELINE_B07","related":[],"run_id":"engineer-osint-20260815-B10","source_ids":[],"source_urls":[],"stage":null,"manufacturer":null,"status_detail" ate crossing point; Feldjäger guided movement and 5th Company, Pionierbrückenbataillon 130, provided ferry operation. The scenario also included security disruption at the crossing, bringing engineer, military-police and civil-water/police coordination into the crossing problem.","analysis":"The event is a useful crossing-C2 case: a wet-gap crossing is treated not only as an engineer asset problem, but as an integrated route, traffic-control, security and civil-military coordination problem.","limit":"This is an exercise-specific arrangement and cannot be treated as proof that all Bundeswehr or NATO wet-gap crossings use the identical C2 architecture.","confidence":"HIGH for the exercise facts; MEDIUM for broader doctrinal inference","source_tier":"","mine_action_context":"NOT_APPLICABLE","origin":"","related":[],"run_id":"engineer-osint-20260816-B07","source_ids":["ENG-SRC-0170","ENG-SRC-0171"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":[],"_last_source_file":"engineer_osint_delta_engineer-osint-20260816-B07.json"},{"id":"ENG-EVT-0025","title":"130th Engineer Brigade signature-management and concealment training","type":"ENG-EVT","classification":"NEW_BASELINE","country":"United States","capability":"","date":"2026-04-28/2026-04-29","fact":"A U.S. Army Europe and Africa innovation page describes Soldiers from the 130th Engineer Brigade and 25th Infantry Division conducting signature-management and concealment training at Schofield Barracks, Hawaii, on 28–29 April 2026. The official caption states that Soldiers built field-expedient concealment positions using natural materials and employed specialized thermal-reduction equipment to reduce visual and thermal detection from UAS and infrared surveillance platforms.","analysis":"This training provides an operational-training datapoint consistent with the professional recommendation to treat signature management as part of engineer survivability support.","limit":"A staff exercise/training event does not establish standardized equipment, unit-wide fielding, or formal doctrinal adoption.","confidence":"HIGH for event/caption; MEDIUM for broader institutionalization","source_tier":"","mine_action_context":"NOT_APPLICABLE","origin":"BASELINE ENRICHMENT","related":[],"run_id":"engineer-osint-20260816-B09","source_ids":["ENG-SRC-0180"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":[],"_last_source_file":"engineer_osint_delta_engineer-osint-20260816-B09.json"},{"id":"ENG-EVT-0026","title":"2nd Army Engineer Brigade — 240 m Euphrates floating bridge","type":"ENG-EVT","classification":"NEW_BASELINE","country":"Türkiye / Syria","capability":"","date":"2026-07","fact":"A Turkish Ministry of National Defence weekly briefing states that 2nd Army Engineer Brigade completed a 240 m floating bridge over the Euphrates in Deir ez-Zor. The briefing states that after controls the bridge was planned to enter service on 10 July 2026.","analysis":"The item is a useful current operational-support/wet-gap datapoint for Turkish engineer bridging capacity.","limit":"Because B10 has only one official source for this specific event, it should not be used alone to infer sustained throughput, exact system type or broader deployed bridging inventory.","confidence":"MEDIUM-HIGH; single official source","source_tier":"","mine_action_context":"NOT_APPLICABLE","origin":"BASELINE ENRICHMENT","related":["ENG-TECH-0022"],"run_id":"engineer-osint-20260816-B10","source_ids":["ENG-SRC-0191"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":[],"_last_source_file":"engineer_osint_delta_engineer-osint-20260816-B10.json"},{"id":"ENG-EVT-079","type":"ENG-EVT","country":"UKR","conflict":"Russia–Ukraine War","title_cs":"Koalice schopností pro odminování Ukrajiny — budování bojových a humanitárních schopností 2024–2026","title_en":"Ukraine Demining Capability Coalition — build-up of combat and humanitarian demining capabilities, 2024–2026","summary_cs":"Oficiální zdroje MO Ukrajiny dokládají vznik Koalice schopností pro odminování v únoru 2024, následnou cestovní mapu podpory, rozsáhlé dodávky techniky pro ženijní jednotky a výcvik. Koalice výslovně zahrnuje humanitární i bojové odminování. Agregované počty dodávek jsou historické součty, nikoli současný inventář nebo provozuschopnost. Veřejné materiály používají horizonty 2025–2034, 2024–2034 a označení roadmapy „do 2035“; tento rozdíl je ponechán jako metadata ambiguity, nikoli uměle sjednocen.","summary_en":"Official Ukrainian MoD sources document the February 2024 creation of the Demining Capability Coalition, a subsequent support roadmap, substantial equipment deliveries to engineer units and training. The coalition explicitly covers both humanitarian and combat demining. Aggregate delivery figures are historical totals, not current inventory or readiness. Public materials use 2025–2034, 2024–2034 and a roadmap labelled 'to 2035'; the discrepancy is retained as metadata ambiguity rather than artificially reconciled.","record_nature":"HISTORICAL_BACKFILL_PROGRAM_MILESTONE_SERIES","event_date_from":"2024-02-17","event_date_to":"2026-12-31","temporal_status":"HISTORICAL_WITH_ONGOING_PROGRAM_RELEVANCE","mine_action_context":"COMBAT_BREACHING","secondary_contexts":["MILITARY_ROUTE_AREA_CLEARANCE","HUMANITARIAN_DEMINING","MINE_ACTION_GOVERNANCE"],"source_ids":["ENG-SRC-0282","ENG-SRC-0283","ENG-SRC-0284","ENG-SRC-0285","ENG-SRC-0286"],"evidence_ids":["ENG-EVID-0012","ENG-EVID-0013","ENG-EVID-0014"],"confidence":"HIGH_FOR_OFFICIAL_PROGRAM_MILESTONES","translation_status":"ANALYST_TRANSLATION","run_id":"engineer-osint-20260818-B33","last_update_run":"engineer-osint-20260818-B34"},{"id":"ENG-EVT-080","type":"ENG-EVT","country":"CZE","title_cs":"Bison Readiness 2025 — integrace EODCC, vojenského pátrání a C-IED","title_en":"Bison Readiness 2025 — EODCC, military-search and C-IED integration","summary_cs":"Oficiální report 15. ženijního pluku popisuje ng ground robotic complexes were being formed within the 808th Separate Support Brigade. This provides a historical precursor to the June 2026 public DELTA performance report on the brigade. The source does not state team numbers, platforms, TO&E or an operational-capability date.","event_date_from":"2025-09-08","event_date_to":"2025-09-08","publication_date":"2025-09-08","temporal_status":"HISTORICAL","mine_action_context":"COUNTERMOBILITY_MINE_EMPLACEMENT","source_ids":["ENG-SRC-0351"],"evidence_ids":["ENG-EVID-0060"],"classification":"FACT_ABOUT_OFFICIAL_PUBLIC_REPORT","confidence":"HIGH_FOR_FORMATION_REPORT_LOW_FOR_SCALE_AND_MATURITY","translation_status":"ANALYST_TRANSLATION","related_ids":["ENG-EVT-090"],"run_id":"engineer-osint-20260818-B45","last_update_run":"engineer-osint-20260818-B45"},{"id":"ENG-EVT-092","type":"ENG-EVT","country":"RUS","conflict":"Russia–Ukraine War","title_cs":"12. samostatná gardová ženijní brigáda — reportované odminování u Halycynivky","title_en":"12th Separate Guards Engineer Brigade — reported clearance near Halytsynivka","summary_cs":"Ruské MO 6. 12. 2025 veřejně reportovalo, že příslušníci 12. samostatné gardové ženijní brigády skupiny „Centr“ provádějí odminování u Halycynivky a vyhledávají miny a nevybuchlé prvky munice. B45 kanonikalizuje pouze skutečnost, že ruské MO takový úkol a jednotkové přiřazení veřejně uvedlo. Telegram a Rutube jsou zrcadla stejného původního tvrzení, nikoli dva nezávislé zdroje.","summary_en":"On 6 Dec 2025 the Russian MoD publicly reported that personnel of the 12th Separate Guards Engineer Brigade, Centre grouping, were conducting clearance near Halytsynivka and finding mines and unexploded munition elements. B45 canonicalises only that the Russian MoD publicly made this unit-level claim. Telegram and Rutube are mirrors of the same originating claim, not two independent sources.","event_date_from":"2025-12-06","event_date_to":"2025-12-06","publication_date":"2025-12-06","temporal_status":"HISTORICA orem, readiness nebo jednotnou organizační šablonu.","evidence_ids":["ENG-EVID-0054","ENG-EVID-0058"],"last_update_run":"engineer-osint-20260818-B44","update_type":"DIFFUSION_EVIDENCE_ENRICHMENT","summary_en":"B44 adds two further primary public indicators of diffusion of unmanned-engineering roles: the 808th Support Brigade's remote mining reported/tracked in DELTA and a recruiting role for an unmanned demining-system sapper/operator in the 154th Mechanized Brigade. Evidence of diffusion is stronger, but it still does not establish a uniform force-wide TO&E, platform quantity, readiness or a single organisational template.","status":"MULTIPLE_PRIMARY_UNIT_AND_RECRUITING_EXAMPLES_STANDARDIZATION_NOT_PROVEN","translation_status":"ANALYST_TRANSLATION"},{"id":"ENG-SIG-0010","title":"U.S. Army Engineer Autonomous Breaching Capability (EABC)","type":"ENG-SIG","classification":"FACT_ABOUT_OFFICIAL_PROGRAM_DESCRIPTION","country":"NATO","capability":"","date":"","fact":"U.S. Army announced on 8 July 2026 selection of Caterpillar, Forterra, IDV USA and Overland AI for EABC. Program objective is autonomous/beyond-line-of-sight robotic breaching of complex obstacles and minefields while reducing personnel exposure. Army said formal contract awards were expected in following weeks, with demonstrations/assessments and a Transformation in Contact unit assessment planned for early 2027.","analysis":"","limit":"Selection is not the same as awarded contract. No evidence of operational fielding, IOC/FOC, or production decision in the cited announcement.","confidence":"","source_tier":"","mine_action_context":"COMBAT_BREACHING","origin":"BASELINE ENRICHMENT","related":[],"run_id":"engineer-osint-20260816-B05","source_ids":["ENG-SRC-0294"],"source_urls":["https://www.army.mil/article-amp/293791/u_s_army_selects_four_contractors_for_engineer_autonomous_breaching_capability_to_automate_battlefield_breaching_operations"],"stage":"DEVELOPMENT","manufacturer":null,"status_detail":null,"tags fication":"NEW","country":"Russia","capability":"AEV / survivability / counter-UAS","date":"2026-01-21","fact":"Rostec states a new IMR-3M batch was delivered and fitted with an EW complex and additional anti-drone protection. Rostec says IMR-3M is actively used in the war.","analysis":"Strong indicator that UAS threat is driving survivability retrofits directly onto engineer vehicles.","limit":"","confidence":"medium","source_tier":"","mine_action_context":"NOT_APPLICABLE","origin":"","related":[],"run_id":"engineer-osint-20260815-B01","source_ids":["ENG-SRC-0022"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":[],"_last_source_file":"engineer_osint_delta_engineer-osint-20260815-B01.json"},{"id":"ENG-TECH-0005","title":"UK–Germany Wide Wet Gap Crossing program based on latest M3 generation","type":"ENG-TECH","classification":"NEW","country":"United Kingdom/Germany","capability":"bridging / wet-gap / interoperability","date":"2025-10-30","fact":"Joint procurement contract exceeds €450m via OCCAR. Program foundation is latest M3 generation based on Swedish M3S with improved HMI, reliability, safety and support. GDELS states M3 can travel up to 80 km/h and a 100 m bridge can be deployed in under 10 min.","analysis":"A major European investment in rapid, interoperable wet-gap crossing for heavy forces; highly relevant to NATO reinforcement and manoeuvre.","limit":"","confidence":"high","source_tier":"","mine_action_context":"NOT_APPLICABLE","origin":"","related":[],"run_id":"engineer-osint-20260815-B01","source_ids":["ENG-SRC-0024","ENG-SRC-0025"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":[],"_last_source_file":"engineer_osint_delta_engineer-osint-20260815-B01.json"},{"id":"ENG-TECH-0006","title":"JGSDF 07 Type Mobile Support Bridge (07MSB)","type":"ENG-TECH","classification":"NEW","country":"Japan","capability":"bridging / Asia / mobility","date":"current official inventory baseline","fact":"JGSDF lists 07MSB as successor to 81-type self-propelled bridge. Official specs include approx. 11.0 m length, 3.0 m width, 3.7 m height, 25 t loaded weight, 3 crew, 85 km/h maximum speed.","analysis":"Provides non-NATO baseline for high-mobility tactical bridging and is useful for future comparative equipment cards.","limit":"","confidence":"high","source_tier":"","mine_action_context":"NOT_APPLICABLE","origin":"","related":[],"run_id":"engineer-osint-20260815-B01","source_ids":["ENG-SRC-0026"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":[],"_last_source_file":"engineer_osint_delta_engineer-osint-20260815-B01.json"},{"id":"ENG-TECH-0007","title":"PLAA integrated minesweeping vehicle — native terminology strengthened; formal designation still unresolved","type":"ENG-TECH","classification":"UPDATE","country":"China","capability":"","date":"publicly observed 2025-04 and 2026-07","fact":"Official PLA terminology includes 综合扫雷车 and 履带式综合扫雷车. Targeted official-source search did not establish a reliable GSL/Type designation.","analysis":"Repeated public use in two group armies suggests the capability is not a one-off demonstrator, but B04 does not establish fleet-wide scale or exact variant identity.","limit":"The English descriptor may cover more than one vehicle/variant; visual and technical identification remains open.","confidence":"high that such vehicles are fielded/trained; low-medium on exact variant identity","source_tier":"","mine_action_context":"NOT_APPLICABLE","origin":"BASELINE ENRICHMENT","related":["ENG-VIS-0003"],"run_id":"engineer-osint-20260815-B05","source_ids":["ENG-SRC-0062","ENG-SRC-0063","ENG-SRC-0082"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":["PLA","minesweeping","breaching","engineer vehicle","designation unresolved"],"_last_source_file":"engineer_osint_delta_engineer-osint-20260815-B05.json"},{"id":"ENG-TECH-0008","title":"PLAA Rapidly Emplaced Bridge System (official English descript  pluku, z toho 6 HAZMAT; Talon a Dragon Runner 10/20 jsou výslovně uvedeny.","summary_en":"Public snapshot: 22 EOD robots at the 15th Engineer Regiment, six HAZMAT; Talon and Dragon Runner 10/20 explicitly named.","source_ids":["ENG-SRC-0267"],"confidence":"HIGH","temporal_status":"HISTORICAL"},{"event_date":"2022-05-05","observation_type":"EOD_ROBOT_FLEET_SNAPSHOT","text_cs":"Oficiální stav k 5. 5. 2022: 31 robotů; 2 velké, 18 středních, 11 malých. V daném týdnu převzato 7 nových robotů.","text_en":"Official snapshot as of 5 May 2022: 31 robots; 2 large, 18 medium and 11 small. Seven new robots were received that week.","source_ids":["ENG-SRC-0289"],"evidence_ids":["ENG-EVID-0017"],"temporal_status":"HISTORICAL"}],"confidence":"HIGH_FOR_2021_SNAPSHOT; UNKNOWN_FOR_2026_CURRENT_FLEET","last_evidence_date":"2021-04-15","last_verified_date":"2026-08-17","update_type":"PROCUREMENT_AND_MAINTENANCE_TRAIL_ENRICHMENT","evidence_ids":["ENG-EVID-0050","ENG-EVID-0051"],"temporal_status":"HISTORICAL_WITH_CURRENT_CONFIRMATION_GAP","current_value_status":"CURRENT_UNKNOWN","current_quantity":"UNKNOWN","visual_gap":"CURRENT_DIRECTLY_INSPECTED_VISUALS_UNRESOLVED","observed_minimum":31,"last_publicly_confirmed_value":31,"value_as_of":"2022-05-05","current_serviceability":"UNKNOWN","current_unit_distribution":"UNKNOWN"},{"id":"ENG-TECH-0025","classification":"NEW","record_nature":"BASELINE_ENRICHMENT_SOCIAL_DISCOVERY","title_en":"Katyusha ground robotic platform — sapper/clearance configuration","title_cs":"Pozemní robotická platforma „Katjuša“ — ženijní/odminovací konfigurace","country":"RUS","domain":["UGV","EOD","clearance","logistics"],"record_type":"TECHNICAL_CARD","maturity":"EXHIBITION_CONFIRMED_FIELD_USE_MANUFACTURER_CLAIM_TESTING_PENDING","telegram_derived":true,"telegram_source_label_cs":"Zdroj discovery: Telegram","telegram_source_label_en":"Discovery source: Telegram","summary_cs":"Veřejný Telegram kanál @VIUKSIDV uvedl, že na salonu «Флот-2026» byla představena ženijní varianta NRTK «Катюша» pro odminování a dopravu nákladu a že systémy již směřují k některým jednotkám v bojové zóně. Samotné vystavení platformy a základní parametry nezávisleji potvrzuje Kommersant s odkazem na TASS. Tvrzení o skutečném rozsahu nasazení zůstává pouze CLAIM; veřejný unit-level důkaz v tomto běhu nalezen nebyl.","summary_en":"The public @VIUKSIDV Telegram channel reported that a sapper configuration of the Katyusha ground robotic complex was shown at Flot-2026 for clearance and cargo transport and that systems were already being sent to some units in the combat zone. The platform's exhibition and basic specifications are more independently corroborated by Kommersant reporting based on TASS. Actual fielding scale remains a CLAIM; no public unit-level evidence was found in this run.","claims":[{"text_cs":"NRTK «Катюша» byl veřejně vystaven na «Флот-2026» v Kronštadtu.","text_en":"The Katyusha ground robotic complex was publicly exhibited at Flot-2026 in Kronstadt.","classification":"FACT_CORROBORATED","source_ids":["ENG-SRC-0238","ENG-SRC-0239"]},{"text_cs":"Telegram @VIUKSIDV uvádí ženijní využití pro odminování a dopravu nákladu.","text_en":"Telegram channel @VIUKSIDV states a sapper role for clearance and cargo transport.","classification":"TELEGRAM_DERIVED_CLAIM_PARTIALLY_CORROBORATED","source_ids":["ENG-SRC-0237","ENG-SRC-0238"]},{"text_cs":"Tvrzení, že komplexy již jsou dodávány některým jednotkám v bojové zóně, pochází z vyjádření zástupce výrobce a není v tomto běhu doloženo unit-level primárním důkazem.","text_en":"The claim that systems are already being delivered to some units in the combat zone originates from a manufacturer representative and is not established by unit-level primary evidence in this run.","classification":"MANUFACTURER_CLAIM_UNVERIFIED_FIELDING_SCALE","source_ids":["ENG-SRC-0237","ENG-SRC-0238"]},{"text_cs":"Kommersant uvádí hmotnost 177 kg, nosnost do 200 kg, dosah do 20 km a plán dokončit zkoušky MO do konce léta 2026.","text_en":"Kommersant reports 177 kg mass, up to 200 kg payload, up to 20 km range, and a plan to complete Ministry of Defence testing by the end of summer 2026.","classification":"SECONDARY_REPORTED_SPECIFICATION","source_ids":["ENG-SRC-0238"]}],"provenance_granularity":"CLAIM_LEVEL","why_it_matters_cs":"Jde o relevantní příklad rozšiřování malých UGV do ženijních úkolů a přesunu rizika od sapéra k dálkově ovládané platformě. Evidence však zatím nestačí k tvrzení o plošném zavedení.","why_it_matters_en":"It is a relevant example of small UGV expansion into engineer tasks and transfer of risk away from sappers to remotely operated platforms. Evidence is not sufficient to claim broad fielding.","staff_relevance_cs":"Sledovat zejména rozdíl mezi výstavním/prototypovým stavem, zkouškami MO a skutečným jednotkovým zavedením.","staff_relevance_en":"Track the distinction between exhibition/prototype status, MoD testing, and actual unit fielding.","intelligence_gaps_cs":["Přesné jednotky a počty dodaných systémů","Výsledek zkoušek MO RF v létě 2026","Konkrétní ženijní konfigurace a provozní omezení","Nezávislý důkaz operačního použití"],"intelligence_gaps_en":["Exact recipient units and quantities","Outcome of Russian MoD testing in summer 2026","Specific sapper configuration and operational limitations","Independent evidence of operational use"],"source_ids":["ENG-SRC-0237","ENG-SRC-0238","ENG-SRC-0239"],"visual_ids":["ENG-VIS-0054"],"hero_visual_id":"ENG-VIS-0054","translation_status":"ANALYST_TRANSLATION","type":"ENG-TECH","run_id":"engineer-osint-20260817-B21","last_update_run":"engineer-osint-20260817-B21"},{"id":"ENG-TECH-0026","classification":"NEW","record_nature":"BASELINE_ENRICHMENT_CZECH_BRIDGING","title_en":"MS-21 temporary bridge set — Czech Army training baseline","title_cs":"Mostová souprava MS-21 — výcvikový baseline AČR","country":"CZE","domain":["bridging","mobility","general_engineering_support"],"record_type":"TECHNICAL_CARD","maturity":"TRAINING_EVIDENCE_CURRENT_2026_SYSTEM_LEGACY_ORIGIN","mine_action_context":"NOT_APPLICABLE","summary_cs":"Velitelství pozemních sil AČR 6. 2. 2026 doložilo výcvik roty všeobecné ženijní podpory 152. ženijního praporu se soupravou MS-21. Zdroj popisuje modulární ocelový provizorní most s díly po 3 m, přemostěním přibližně do 21 m a mostovkou okolo 4 m; současně uvádí ověření použití teleskopického manipulátoru JLG 4017 jako alternativy k automobilnímu jeřábu. Starší článek AČR z roku 2021 uváděl pro konkrétní 21m sestavu zatížení až 60 t. Veřejné zdroje v tomto běhu nedokládají počet souprav MS-21 v AČR, vlastnický vztah AČR vs. SSHR ani současnou skladovou/distribuční strukturu.","summary_en":"On 6 Feb 2026, Czech Land Forces documented training by the 152nd Engineer Battalion general-engineering-support company with the MS-21 bridge set. The source describes a modular steel temporary bridge assembled from 3 m sections, spanning approximately up to 21 m with a roadway about 4 m wide, and records trial use of a JLG 4017 telehandler as an alternative to a truck crane. An older 2021 Czech Army article reported up to 60 t load for a specific 21 m assembly. Public sources reviewed in this run do not establish current fleet quantity, ownership allocation between the Army and State Material Reserves, or current distribution.","claims":[{"text_cs":"Dne 6. 2. 2026 rota všeobecné ženijní podpory 152. žpr cvičila stavbu mostních provizorií se soupravou MS-21.","text_en":"On 6 Feb 2026, the 152nd Engineer Battalion general-engineering-support company trained temporary bridge construction with the MS-21 set.","classification":"FACT_TRAINING_EVIDENCE","source_ids":["ENG-SRC-0240"]},{"text_cs":"Aktuální článek Pozemních sil popisuje MS-21 jako normovaný modulární ocelový most s díly po 3 m, přemostěním přibližně do 21 m a mostovkou okolo 4 m.","text_en":"The current Land Forces article describes MS-21 as a standardized modular steel bridge using 3 m sections, spanning approximately up to 21 m with a roadway about 4 m wide.","classification":"FACT_SOURCE_REPORTED_SPECIFICATION","source_ids":["ENG-SRC-0240"]},{"text_cs":"Při výcviku bylo ověřeno použití teleskopického manipulátoru JLG 4017 pro manipulaci s mostními díly jako alternativa k automobilnímu jeřábu.","text_en":"The training tested use of a JLG 4017 telehandler to handle bridge components as an alternative to a truck crane.","classification":"FACT_TRAINING_ADAPTATION","source_ids":["ENG-SRC-0240"]},{"text_cs":"Článek AČR z roku 2021 uváděl pro 21m sestavu MS-21 zatížení až 60 tun; tento historický údaj není automaticky zobecněn na všechny projekty sestavy.","text_en":"A 2021 Czech Army article reported up to 60 tonnes load for a 21 m MS-21 assembly; this historical figure is not automatically generalized to every bridge configuration.","classification":"FACT_HISTORICAL_WITH_CONFIGURATION_LIMIT","source_ids":["ENG-SRC-0241"]}],"provenance_granularity":"CLAIM_LEVEL","why_it_matters_cs":"Doplňuje českou bridging baseline o veřejně doložený současný výcvik a konkrétní pracovní adaptaci při montáži. Neprokazuje počet souprav ani bojovou dostupnost.","why_it_matters_en":"Adds a current public Czech bridging-training baseline and a concrete assembly adaptation. It does not establish fleet quantity or wartime availability.","staff_relevance_cs":"Vhodné pro mapování schopnosti obnovy mobility a vztahu 152. žpr k mostním provizoriím; pro plánování kapacit je nutné doplnit počty, skladování a logistiku.","staff_relevance_en":"Useful for mapping mobility-restoration capability and the 152nd Engineer Battalion bridging role; capacity planning still requires quantity, storage and logistics data.","training_relevance_cs":"Aktuální výcvik potvrzuje praktickou práci se soupravou a ověřování alternativního manipulačního prostředku JLG 4017.","training_relevance_en":"Current training confirms practical employment of the set and testing of the JLG 4017 as an alternative handling asset.","intelligence_gaps_cs":["Aktuální počet souprav MS-21 dostupných AČR","Vlastnické a skladové rozdělení AČR vs. SSHR","Aktuální projekty/nosnosti podle konfigurace","Distribuce a pohotovost jednotek pro nasazení"],"intelligence_gaps_en":["Current number of MS-21 sets available to the Czech Army","Ownership/storage split between the Army and State Material Reserves","Current configuration-specific load projects","Unit distribution and readiness for deployment"],"source_ids":["ENG-SRC-0240","ENG-SRC-0241","ENG-SRC-0242"],"visual_ids":["ENG-VIS-0055"],"hero_visual_id":"ENG-VIS-0055","translation_status":"ANALYST_TRANSLATION","type":"ENG-TECH","run_id":"engineer-osint-20260817-B22","last_update_run":"engineer-osint-20260817-B22"},{"id":"ENG-TECH-0027","classification":"NEW","record_nature":"BASELINE_ENRICHMENT_CZECH_PONTOON_BRIDGING","title_en":"PMS pontoon bridge set — Czech Armed Forces","title_cs":"PMS pontonová mostová souprava — AČR","country":"CZE","domain":["bridging","wet-gap-crossing","mobility"],"record_type":"TECHNICAL_CARD","maturity":"CURRENT_2026_TRAINING_EVIDENCE_LEGACY_SYSTEM","mine_action_context":"NOT_APPLICABLE","summary_cs":"PMS je veřejně doložena v používání 152. žpr; current complete-set quantity/serviceability zůstává UNKNOWN.","summary_en":"On 29 May 2026 the Czech Army documented intensive training by the 152nd Engineer Battalion pontoon company and its Active Reserve counterpart on the Elbe using the PMS pontoon bridge set, motor boats, the Veronika MO-2000 boat, multilift vehicles and Tatra T810 trucks. The official Czech Army equipment page states that PMS is used for floating bridges and ferry crossings, can be divided into halves and quarters, and lists 20, 40, 60 or 80 t capacities depending on configuration. A 2020 article reported 12 trailers and three roadway vehicles in the pontoon company, but this historical figure is not carried forward as a 2026 fleet count.","claims":[{"text_cs":"Ve dnech 18.–29. 5. 2026 cvičila pontonová rota 152. žpr společně s pontonovou rotou Aktivní zálohy výstavbu pontonových přívozů a mostů na Labi.","text_en":"From 18–29 May 2026 the 152nd Engineer Battalion pontoon company trained pontoon ferries and bridges on the Elbe together with its Active Reserve pontoon company.","classification":"FACT_TRAINING_EVIDENCE","source_ids":["ENG-SRC-0243"]},{"text_cs":"AČR při tomto výcviku výslovně uvádí použití souprav PMS, motorových člunů, člunu Veronika MO-2000, multiliftů a vozidel Tatra T810.","text_en":"The Czech Army explicitly lists PMS sets, motor boats, the Veronika MO-2000 boat, multilifts and Tatra T810 vehicles in this training.","classification":"FACT_CURRENT_EQUIPMENT_ASSOCIATION","source_ids":["ENG-SRC-0243"]},{"text_cs":"Oficiální technická stránka AČR uvádí pro PMS konfigurace s dovolenou zatížitelností 20, 40, 60 nebo 80 t; maximální délku z jedné soupravy 382 m pro 20t konfiguraci nebo 227 m pro 60t konfiguraci.","text_en":"The official Czech Army equipment page lists PMS allowable capacities of 20, 40, 60 or 80 t and maximum bridge lengths from one set of 382 m in a 20 t configuration or 227 m in a 60 t configuration.","classification":"FACT_SOURCE_REPORTED_SPECIFICATION","source_ids":["ENG-SRC-0244"]},{"text_cs":"Článek AČR z roku 2020 uváděl u pontonové roty 12 podvozků a tři vozovkové automobily; údaj je historický a není považován za stav roku 2026.","text_en":"A 2020 Czech Army article reported 12 trailers and three roadway vehicles in the pontoon company; the figure is historical and is not treated as the 2026 inventory.","classification":"FACT_HISTORICAL_NOT_CURRENT_INVENTORY","source_ids":["ENG-SRC-0245"]}],"provenance_granularity":"CLAIM_LEVEL","why_it_matters_cs":"PMS je veřejně doložená současně cvičená schopnost AČR pro překonávání vodních překážek. Pro plánování však stále chybí současný počet kompletních souprav, skutečná provozuschopnost a podrobnější distribuční data.","why_it_matters_en":"PMS is publicly documented as a currently trained Czech wet-gap-crossing capability. Current complete-set quantity, serviceability and detailed distribution remain unresolved.","staff_relevance_cs":"Relevantní pro plánování mobility a wet-gap crossing, zejména kapacit pontonové roty 152. žpr a jejího doplnění Aktivní zálohou.","staff_relevance_en":"Relevant to mobility and wet-gap-crossing planning, especially the 152nd Engineer Battalion pontoon company and its Active Reserve augmentation.","training_relevance_cs":"Výcvik 2026 potvrzuje společné sladění profesionální pontonové roty, Aktivní zálohy a podpůrných prvků na reálném vodním toku.","training_relevance_en":"The 2026 exercise confirms integrated training of the professional pontoon company, Active Reserve and supporting elements on a real river.","intelligence_gaps_cs":["Aktuální počet kompletních souprav PMS","Počet provozuschopných pontonových dílů a nosných vozidel","Rozdělení techniky mezi profesionální a záložní prvky","Aktuální interoperabilita s novějšími aliančními pontonovými systémy"],"intelligence_gaps_en":["Current number of complete PMS sets","Number of serviceable pontoon bays and carrier vehicles","Distribution between professional and reserve elements","Current interoperability with newer allied pontoon systems"],"source_ids":["ENG-SRC-0243","ENG-SRC-0244","ENG-SRC-0245","ENG-SRC-0291","ENG-SRC-0295"],"visual_ids":["ENG-VIS-0056"],"hero_visual_id":"ENG-VIS-0056","translation_status":"ANALYST_TRANSLATION","type":"ENG-TECH","run_id":"engineer-osint-20260817-B23","last_update_run":"engineer-osint-20260818-B37","update_type":"CURRENT_CONFIRMATION_PLUS_HISTORICAL_BACKFILL","current_value_status":"CURRENT_UNKNOWN","current_quantity":"UNKNOWN","current_serviceability":"UNKNOWN","evidence_ids":["ENG-EVID-0019","ENG-EVID-0023"]},{"id":"ENG-TECH-0028","classification":"NEW","record_nature":"BASELINE_ENRICHMENT","type":"ENG-TECH","country":"CZE","title_cs":"AM-50 — servisní a opravárenská stopa","title_en":"AM-50 — maintenance and repair support trail","mine_action_context":"NOT_APPLICABL ember of the 48th Support Brigade training on GCS-200. The figure of 62 is a historical nationwide public snapshot across operators and must not be interpreted as military inventory or current August 2026 status.","manufacturer":"Global Clearance Solutions","maturity":"OPERATIONAL_USE_PUBLICLY_REPORTED","mine_action_context":"UNKNOWN_NEEDS_REVIEW","current_quantity":"UNKNOWN","current_serviceability":"UNKNOWN","current_unit_distribution":"UNKNOWN","current_value_status":"CURRENT_2026_QUANTITY_UNKNOWN","historical_observations":[{"event_date":"2025-03-03","observation_type":"NATIONWIDE_OPERATING_FLEET_SNAPSHOT_ALL_OPERATORS","value":62,"scope":"various regions of Ukraine; operator mix not limited to military","source_ids":["ENG-SRC-0344"],"evidence_ids":["ENG-EVID-0055"]},{"event_date":"2025","observation_type":"PLANNED_ADDITIONAL_SYSTEMS","value":26,"status":"EXPECTED_NOT_CONFIRMED_DELIVERED_BY_B44","source_ids":["ENG-SRC-0344"],"evidence_ids":["ENG-EVID-0055"]},{"event_date":"2026-04-16","observation_type":"MILITARY_TRAINING_USE","text_cs":"ArmyInform popsal příslušníka 48. brigády podpory při osvojování GCS-200.","source_ids":["ENG-SRC-0345"],"evidence_ids":["ENG-EVID-0055"]}],"source_ids":["ENG-SRC-0344","ENG-SRC-0345","ENG-SRC-0349"],"evidence_ids":["ENG-EVID-0055"],"translation_status":"ANALYST_TRANSLATION","confidence":"HIGH_FOR_DATED_PUBLIC_SNAPSHOT_AND_MILITARY_TRAINING_LOW_FOR_CURRENT_QUANTITY","run_id":"engineer-osint-20260818-B44","last_update_run":"engineer-osint-20260818-B44"},{"id":"ENG-TTP-0001","title":"Survivability trench capability re-emphasis","type":"ENG-TTP","classification":"FACT_ABOUT_OFFICIAL_PUBLIC_DESCRIPTION","country":"CZE","capability":"","date":"","fact":"","analysis":"","limit":"","confidence":"HIGH_FOR_PUBLIC_ROLE_DESCRIPTION","source_tier":"","mine_action_context":"ERW_CLEARANCE","origin":"RECOVERED_BASELINE_B09","related":[],"run_id":"engineer-osint-20260815-B10","source_ids":["ENG-SRC-0297","ENG-SRC-0328"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":[],"_last_source_file":"engineer_osint_delta_engineer-osint-20260815-B10.json","record_nature":"TRANSLATION_CANONICALIZATION","title_cs":"Veřejné rozhraní EOR → EOD v AČR","last_update_run":"engineer-osint-20260818-B41","title_en":"Public ACR EOR → EOD interface framing","summary_cs":"Oficiální článek PozS 5. 7. 2026 veřejně rozlišuje EOR a následné odborné řešení EOD; nejde o úplnou doktrínu/SOP.","publication_date":"2026-07-05","temporal_status":"RECENT_PUBLIC_DESCRIPTION","evidence_ids":["ENG-EVID-0043"],"update_type":"CLEARANCE_CONTEXT_ENRICHMENT"},{"id":"ENG-TTP-0002","title":"JGSDF division-level countermobility integration — 4th Engineer Battalion","type":"ENG-TTP","classification":"ANALYTICAL_TTP_OBSERVATION_FROM_PRIMARY_OFFICIAL_REPORT","country":"UKR","capability":"","date":"2022-06-02/2022-06-16","fact":"During a 4th Division exercise, the official JGSDF account states the 4th Engineer Battalion supported the division and constructed obstacles, including use of helicopter-dispersed mines, coordinated with a covering force's delaying battle, while also constructing division command-post protective works.","analysis":"","limit":"Does not establish unchanged 2026 TTP, current munition inventory, or force-wide JGSDF practice.","confidence":"MEDIUM_HIGH_FOR_UNIT_LEVEL_PRACTICE_LOW_FOR_FORCE_WIDE_GENERALIZATION","source_tier":"","mine_action_context":"NOT_APPLICABLE","origin":"HISTORICAL_BASELINE_ENRICHMENT","related":[],"run_id":"engineer-osint-20260816-B01","source_ids":["ENG-SRC-0335"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":[],"_last_source_file":"engineer_osint_delta_engineer-osint-20260816-B01.json","conflict":"Russia–Ukraine War","title_cs":"Ochrana ženijních pracovních skupin proti UAS při budování a údržbě obranných opatření","title_en":"Counter-UAS protection of engineer work parties during construction and maintenance of defensive measures","summary_cs":"Oficiální report ArmyInform z 15. 6. 2026 o 91. brigádě podpory popisuje ženijní práce v prostředí trvalé hrozby dronů. Bezpečnost pracovních skupin zajišťují krycí prvky s detekčními a rušicími prostředky a palebnou ochranou; brigáda zároveň instaluje a opravuje protidronové sítě podél dopravních tras. B42 to vede jako jednotkově reportovanou adaptaci survivability, nikoliv jako univerzální ukrajinské SOP nebo force-wide standard.","summary_en":"An official ArmyInform report of 15 Jun 2026 on the 91st Support Brigade describes engineer work under persistent drone threat. Work parties are protected by covering elements with detection and electronic-warfare means plus fire protection, while the brigade also installs and repairs anti-drone nets along transport routes. B42 treats this as a unit-reported survivability adaptation, not a universal Ukrainian SOP or force-wide standard.","publication_date":"2026-06-15","temporal_status":"HISTORICAL_RECENT","evidence_ids":["ENG-EVID-0047"],"translation_status":"ANALYST_TRANSLATION","last_update_run":"engineer-osint-20260818-B42"},{"id":"ENG-TTP-0003","title":"Engineer-company reorganization toward UAS-enabled remote mining","type":"ENG-TTP","classification":"FACT_ABOUT_OFFICIAL_PUBLIC_DESCRIPTION","country":"CZE","capability":"","date":"2026-07-02","fact":"ArmyInform reports an attributed account that after the Kursk operation the described engineer company was reorganized into a remote-mining company, replacing sapper groups with UAS crews and training pilots/ground teams; UGVs were also present in the unit.","analysis":"","limit":"The account is unit-specific and is not evidence of a force-wide template.","confidence":"HIGH_FOR_PUBLIC_DESCRIPTION","source_tier":"","mine_action_context":null,"origin":"","related":[],"run_id":"engineer-osint-20260816-B03","source_ids":["ENG-SRC-0141","ENG-SRC-0142","ENG-SRC-0341"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":[],"_last_source_file":"engineer_osint_delta_engineer-osint-20260816-B03.json","title_cs":"Veřejné pojetí ženijního průzkumu AČR — mobility information requirements a „suchý/mokrý“ průzkum","title_en":"Public ACR engineer-reconnaissance framing — mobility information requirements and 'dry/wet' reconnaissance","summary_cs":"Oficiální profil Pozemních sil z 15. 6. 2026 popisuje ženijní průzkum jako získávání informací o terénu, komunikacích, mostech, překážkách, vodních překážkách, minových polích a dalších hrozbách pro podporu rozhodování velitele o trasách, tempu, rizicích a potřebě ženijní podpory. Veřejný text rozlišuje „suchý“ a „mokrý“ průzkum. Jde o oficiální veřejný profesní/capability popis, nikoli o publikaci úplné doktríny, SOP nebo TO&E.","publication_date":"2026-06-15","event_date_from":null,"event_date_to":null,"temporal_status":"RECENT_PUBLIC_DESCRIPTION","evidence_ids":["ENG-EVID-0052"],"media_ids":[],"last_update_run":"engineer-osint-20260818-B43"},{"id":"ENG-TTP-0004","title":"Remote/digital hydrographic reconnaissance for wet-gap preparation","type":"ENG-TTP","classification":"NEW_BASELINE","country":"Germany/United Kingdom/United States","capability":"","date":"","fact":"Bundeswehr's Sonobot 5 use case explicitly aims to survey water obstacles digitally, rapidly and under cover, with results available to responsible commanders in real time. UK Map the Gap Phase 2 funded autonomous/semi-autonomous air, ground and amphibious survey solutions to reduce risk to Royal Engineer reconnaissance troops and survey multiple crossing sites faster. U.S. Army Reserve wet-gap training at Yakima Strike used an engineer dive detachment for hydrographic survey and water safety before crossing operations, illustrating the enduring information requirement even where collection remains manned.","analysis":"Across three national contexts, the invariant requirement is hydrographic/bank reconnaissance before crossing; the emerging change is moving collection from exposed teams toward remote multi-sensor platforms and faster digital dissemination.","limit":"UK Map the Gap is an R&D program and Sonobot 5 is one fielded national example; evidence is insufficient to claim a standardized NATO autonomous reconnaissance TTP.","confidence":"MEDIUM-HIGH for trend direction; LOW-MEDIUM for degree of standardization","source_tier":"","mine_action_context":"NOT_APPLICABLE","origin":"BASELINE ENRICHMENT","related":[],"run_id":"engineer-osint-20260816-B08","source_ids":["ENG-SRC-0174","ENG-SRC-0176","ENG-SRC-0177"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":[],"_last_source_file":"engineer_osint_delta_engineer-osint-20260816-B08.json"},{"id":"ENG-TTP-0005","title":"Threat-conditioned survivability under persistent UAV observation","type":"ENG-TTP","classification":"NEW_BASELINE","country":"United States","capability":"","date":"2026-04-22","fact":"The 2026 U.S. Army Engineer Professional Bulletin article 'Rethinking Survivability' argues that widespread reconnaissance and attack UAVs alter the survivability problem for vehicles, artillery and positions. The article recommends adding anti-UAV overhead protection and deliberately weighing concealment against physical cover based on the prevalent threat.","analysis":"For engineer staffs, survivability planning increasingly requires signature management and aerial-observation analysis alongside traditional earthwork quantity/blade-time calculations.","limit":"This is a professional recommendation, not proof of a formally promulgated Army-wide doctrinal change; artillery/direct-fire threats can still make traditional digging and hardening essential.","confidence":"HIGH for publication/recommendation; MEDIUM for force-wide trend","source_tier":"","mine_action_context":"NOT_APPLICABLE","origin":"BASELINE ENRICHMENT","related":[],"run_id":"engineer-osint-20260816-B09","source_ids":["ENG-SRC-0178","ENG-SRC-0179"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":[],"_last_source_file":"engineer_osint_delta_engineer-osint-20260816-B09.json"},{"id":"ENG-UNIT-0001","title":"Armed Forces of Ukraine Support Forces structure","type":"ENG-UNIT","classification":"NEW","country":"Ukraine","capability":"organization / MILENG / C2","date":"current structure verified 2026-08-15","fact":"Support Forces are a separate branch uniting engineering forces, RCB defense, geospatial, hydrometeorological and canine services. Official description assigns engineer troops passage creation, fortifications and camouflage.","analysis":"Useful baseline for tracking organizational changes and cross-functional support integration.","limit":"","confidence":"high","source_tier":"","mine_action_context":"NOT_APPLICABLE","origin":"","related":[],"run_id":"engineer-osint-20260815-B01","source_ids":["ENG-SRC-0008"],"source_urls":[],"stage":null,"manufacturer":null,"status_detail":null,"tags":[],"_last_source_file":"engineer_osint_delta_engineer-osint-20260815-B01.json"},{"id":"ENG-UNIT-0002","title":"24th Chinese Peacekeeping Multi-role Engineering Company / Chinese UNIFIL demining-EOD capability","type":"ENG-UNIT","classification":"NEW","country":"China / UNIFIL Lebanon","capability":"","date":"2026 baseline","fact":"Chinese MND states 69 members passed UNMAS mine-clearance/EOD qualification assessment on 5 Jan 2026. UNMAS states Chinese and Cambodian UNIFIL demining/EOD teams are subject to training support, validation, QA/QC and monitoring. UNIFIL independently identifies a Chinese Multirole Engineering Unit conducting humanitarian demining.","analysis":"Strong public evidence for a formal Chinese peacekeeping engineer–mine-action/EOD capability with external UN validation.","limit":"UN peacekeeping qualification and QA should not be treated as direct evidence of PLA combat-breaching proficiency in high-intensity warfare.","confidence":"high","source_tier":"","mine_action_context":"HUMANITARIAN_DEMINING","origin":"BASELINE_ENRICHMENT","related":["ENG-EVT-0013"],"run_id":"engi ","record_priority":"RECORD-P1","status":"OPEN_PUBLIC_PDF_PATH_CONFIRMED_TOOL_FETCH_BLOCKED_FULL_TEXT_REVIEW_PENDING","source_ids":["ENG-SRC-0334"],"topic":"Public Ukrainian engineer paper on combat engineering support, NLLP / MoD Ukraine","id":"LEAD-041","title":"Public Ukrainian engineer paper on combat engineering support, NLLP / MoD Ukraine","last_update":"engineer-osint-20260818-B43","classification":"PUBLIC_DOCTRINE_LESSONS_SOURCE_LEAD","direct_public_pdf_url":"https://nllp.jallc.nato.int/IKS/Sharing Public/2024_UNCLASS_Ukrainian Engineer Paper_Combat Engineering Support for Forces.pdf"},{"lead_id":"LEAD-043","status":"OPEN_RECHECKED_B45_NO_LINKED_RELAUNCH_FOUND","topic":"Follow-on outcome after cancelled Czech EOD reconnaissance robot procurement N006/26/V00000714","source_ids":["ENG-SRC-0339"],"id":"LEAD-043","title":"Follow-on outcome after cancelled Czech EOD reconnaissance robot procurement N006/26/V00000714","last_update":"2026-08-18T11:15:34+02:00","record_priority":"RECORD-P1","reason":"B45 re-searched NEN/MoD procurement variants; no safely linked replacement/relaunch/award, model or quantity was identified.","next_action":"Continue search across NEN/VVZ/contract registry using subject variants and procurement identifiers; do not infer that the requirement was abandoned."}]},"trends":{"trends":[{"id":"ENG-TREND-0001","title":"Autonomous and remotely operated systems are moving from specialist demining into mainstream combat engineering","confidence":"high","evidence":"US EABC moved to four-contractor prototyping with unit assessment planned. Rheinmetall/DOK-ING unveiled modular MV-8 UBS and formed a heavy-autonomous-vehicle competence centre. Ukraine reports field conversions and UAS/UGV-driven organizational adaptation. Russia presents/fields remote/robotic engineer concepts, though evidence quality is lower.","interpretation":"Trend confidence HIGH: independent state, industry and battlefield-adaptation signals converge on reducing human exposure and modularizing engineer effects on unmanned platforms.","run_id":"engineer-osint-20260815-B01"},{"id":"ENG-TREND-0002","title":"Engineer survivability is expanding to explicit physical counter-UAS protection","confidence":"high-medium","evidence":"Ukraine reported hundreds of kilometres of physical anti-drone route protection. Russia claims IMR-3M batches now include EW and extra anti-drone protection. US engineer lessons from Ukraine emphasize constant UAS observation of breaching/bridging assets.","interpretation":"Engineer survivability increasingly includes overhead/route-level UAS protection, signature management and dispersion—not only ballistic/mine protection.","run_id":"engineer-osint-20260815-B01"},{"id":"ENG-TREND-0003","title":"EOD, EOC, C-IED and MILENG doctrine/training are in an active convergence/standardization cycle","confidence":"high","evidence":"EOD WG is revising terminology, minimum proficiency and standards. AJP-3.18 custodian activity continued in 2026. NATO ACT explicitly describes EOD/C-IED cooperation and close links to MILENG COE. MILENG WG integrates doctrine, standards, terminology and capability domains.","interpretation":"NATO engineer/EOD doctrine should be monitored as a linked ecosystem rather than separate document lists.","run_id":"engineer-osint-20260815-B02"},{"id":"ENG-TREND-0004","title":"Wet-gap crossing modernization is emphasizing speed, interoperability and heavy-force support","confidence":"high-medium","evidence":"UK/Germany launched major M3 modernization/procurement. NATO exercises continue multinational bridge integration; Australian heavy engineer bridging capability is also expanding.","interpretation":"Bridging is re-emerging as a high-priority manoeuvre enabler for heavy formations and reinforcement corridors.","run_id":"engineer-osint-20260815-B01"}]},"sources":{"sources":[{"id":"ENG-SRC-0001","name":"Military Engineering Working Group","tier":1,"publication_date":"2026","url":"https://milengcoe.org/events/work dpory pro NATO a plní mimo jiné mostní, odminovací, UXO a EOD/IEDD úkoly.","text_en":"The 152nd Engineer Battalion is publicly described as a general engineer support unit for NATO and performs, among other tasks, bridging, mine-removal, UXO and EOD/IEDD functions.","source_ids":["ENG-SRC-0246","ENG-SRC-0248"]},{"classification":"FACT","text_cs":"Při Bison Readiness 2025 byl EODCC podporující EOD skupinu 153. žpr sestaven z příslušníků roty EOD 152. žpr.","text_en":"During Bison Readiness 2025, the EODCC supporting the 153rd Battalion EOD group was formed from members of the 152nd Battalion EOD company.","source_ids":["ENG-SRC-0247"]}],"operational_evidence":{"training_evidence":"Bison Readiness 2025 — multinational C-IED/EOD training","operational_evidence":"PUBLIC_DATA_NOT_FOUND","combat_evidence":"PUBLIC_DATA_NOT_FOUND"},"intelligence_gaps_cs":["úplné veřejné TO&E roty EOD","certifikační model a personální tabulky","aktuální equipment matrix a počty EOD prostředků","aktuální přímé vizuály roty EOD"],"intelligence_gaps_en":["full public EOD-company TO&E","certification model and personnel tables","current equipment matrix and EOD-system quantities","current directly inspected EOD-company visuals"],"source_ids":["ENG-SRC-0246","ENG-SRC-0247","ENG-SRC-0248"],"provenance_granularity":"CLAIM_LEVEL","confidence":"HIGH","translation_status":"ANALYST_TRANSLATION","last_verified_date":"2026-08-17","last_update_run":"engineer-osint-20260817-B24"},{"id":"ENG-TECH-0016","classification":"UPDATE","record_nature":"TRANSLATION_CANONICALIZATION","title_cs":"07式機動支援橋 / 07MSB — mobilní podpůrný most"},{"id":"ENG-TECH-0017","classification":"UPDATE","record_nature":"TRANSLATION_CANONICALIZATION","title_cs":"92式地雷原処理車 — Type 92 vozidlo pro vytváření průchodů v minových polích"},{"id":"ENG-TECH-0018","classification":"UPDATE","record_nature":"TRANSLATION_CANONICALIZATION","title_cs":"施設作業車 — obrněné ženijní pracovní vozidlo"},{"id":"ENG-TECH-0019","classification":"UPDATE","record_na t structure and EOD company","summary_cs":"Oficiální stránka 152. ženijního praporu veřejně popisuje pontonovou rotu a pontonovou rotu AZ, 1. a 2. rotu všeobecné ženijní podpory, rotu EOD a rotu logistiky. Rota EOD je určena k pyrotechnickému průzkumu, odstraňování a likvidaci nevybuchlé munice v bojových i nebojových operacích, pyrotechnické podpoře při odminování a pyrotechnické asanaci. Veřejné náborové stránky navíc potvrzují služební místa operátora roty EOD a staršího řidiče roty EOD, přičemž druhé je spojeno s týmem pokročilého pátrání.","summary_en":"The official 152nd Engineer Battalion page publicly describes a pontoon company and reserve pontoon company, 1st and 2nd general engineer support companies, an EOD company and a logistics company. The EOD company is tasked with explosive-ordnance reconnaissance, removal and disposal of unexploded ordnance in combat and non-combat operations, pyrotechnic support to demining and clearance of objects/areas. Public recruiting pages additionally confirm EOD-company operator and senior-driver billets, with the latter linked to an advanced-search team.","mission_cs":"Všeobecná ženijní podpora podle standardů NATO; součástí je samostatně popsaná rota EOD.","mission_en":"General engineer support under NATO standards, including a separately described EOD company.","subordination":"15. ženijní pluk, Velitelství pozemních sil AČR","organization_public":["pontonová rota (ponr)","pontonová rota AZ (ponr AZ)","1. rota všeobecné ženijní podpory (1. rvžp)","2. rota všeobecné ženijní podpory (2. rvžp)","rota EOD (rEOD)","rota logistiky (rLog)"],"eod_public_roles":["operátor roty EOD","starší řidič roty EOD"],"advanced_search_linkage":"Public recruiting text for the senior driver places the billet in an advanced-search team; exact internal team structure is not publicly established by the retrieved sources.","operational_evidence_classification":"TRAINING_EVIDENCE_PLUS_PUBLIC_ORGANIZATION","mine_action_context":"EOC","secondary_contexts":["MILITARY_ROUTE_AREA_CLEARANCE","UNKNOWN_NEEDS_REVIEW"],"claims":[{"text_cs":"Oficiální stránka útvaru uvádí ve struktuře 152. žpr rotu EOD spolu s pontonovou rotou, pontonovou rotou AZ, dvěma rotami všeobecné ženijní podpory a rotou logistiky.","text_en":"The unit's official page lists an EOD company alongside a pontoon company, reserve pontoon company, two general engineer support companies and a logistics company.","classification":"FACT","source_ids":["ENG-SRC-0256"]},{"text_cs":"Rota EOD je podle útvaru určena k pyrotechnickému průzkumu, odstraňování a likvidaci nevybuchlé munice v bojových i nebojových operacích, pyrotechnické podpoře při odminování a pyrotechnické asanaci.","text_en":"According to the unit, the EOD company is tasked with explosive-ordnance reconnaissance, UXO removal/disposal in combat and non-combat operations, pyrotechnic support to demining and clearance activities.","classification":"FACT","source_ids":["ENG-SRC-0256"]},{"text_cs":"Veřejné náborové stránky potvrzují služební místa operátora roty EOD a staršího řidiče roty EOD 152. žpr.","text_en":"Public recruiting pages confirm EOD-company operator and senior-driver billets in the 152nd Engineer Battalion.","classification":"FACT","source_ids":["ENG-SRC-0257","ENG-SRC-0258"]},{"text_cs":"Náborový text spojuje místo staršího řidiče roty EOD s týmem pokročilého pátrání; z tohoto zdroje nelze bezpečně odvodit úplnou organizační strukturu takového týmu.","text_en":"The recruiting text links the EOD-company senior-driver billet to an advanced-search team; the source does not safely establish the team's full organization.","classification":"FACT_WITH_ANALYTIC_LIMIT","source_ids":["ENG-SRC-0258"]}],"intelligence_gaps_cs":["úplná tabulka organizace a počtů roty EOD","počet a složení EOD týmů","přesná struktura týmu pokročilého pátrání","certifikace a kvalifikační systém","současná equipment matrix","aktuální přímé vizuály techniky roty EOD"],"intelligence_gaps_en":["full EOD-company TO&E and personnel strength","number and composition of EOD teams","exact advanced-search-team structure","certification and qualification system","current equipment matrix","current direct imagery of EOD-company equipment"],"visual_status":"OFFICIAL_PAGE_IMAGE_PRESENT_NOT_PIXEL_INSPECTED","source_ids":["ENG-SRC-0256","ENG-SRC-0257","ENG-SRC-0258","ENG-SRC-0259"],"provenance_granularity":"CLAIM_LEVEL","confidence":"HIGH_FOR_PUBLIC_ORGANIZATION_MEDIUM_FOR_ADVANCED_SEARCH_INTERNAL_MAPPING","translation_status":"ANALYST_TRANSLATION","last_verified_date":"2026-08-17","last_update_run":"engineer-osint-20260817-B27"},{"id":"ENG-UNIT-0032","classification":"UPDATE","record_nature":"BASELINE_ENRICHMENT_CZECH_BRIDGING_AND_TRAINING","type":"ENG-UNIT","country":"CZE","title_cs":"152. ženijní prapor — doplnění pontonové AZ a EOD výcvikové evidence","title_en":"152nd Engineer Battalion — reserve pontoon and EOD training enrichment","summary_cs":"Oficiální stránka 152. žpr zpřesňuje úkoly pontonové roty AZ: zřizování mostových a přívozových přepravišť s PMS, průzkum vodní překážky a rekognoskaci prostoru přepraviště, záchranné práce na vodě, maskování a pomocné zemní práce. Samostatná oficiální stránka a MINIGATOR 2025 doplňují výcvikovou evidenci roty EOD. Jde o veřejný baseline schopností a výcviku, nikoli o důkaz aktuálního personálního naplnění, readiness nebo úplné equipment matrix.","summary_en":"The official 152nd Engineer Battalion reserve page refines the reserve pontoon company's public mission: bridge and ferry crossing sites using PMS, water-obstacle reconnaissance and crossing-site reconnaissance, water rescue, camouflage and supporting earthworks. A separate official EOD-company page and MINIGATOR 2025 add training evidence for the EOD company. This is a public capability/training baseline, not proof of current personnel fill, readiness or a complete equipment matrix.","mine_action_context":"NOT_APPLICABLE","claims":[{"classification":"FACT","text_cs":"Pontonová rota AZ 152. žpr je veřejně určena k překonávání vodních překážek zřizováním mostových a přívozových přepravišť s PMS a k souvisejícímu průzkumu vodní překážky, rekognoskaci přepraviště, záchranným pracím a maskování.","text_en":"The 152nd Engineer Battalion reserve pontoon company is publicly tasked with wet-gap crossing by establishing bridge and ferry sites using PMS, together with water-obstacle reconnaissance, crossing-site reconnaissance, water rescue and camouflage.","source_ids":["ENG-SRC-0264"]},{"classification":"FACT","text_cs":"Oficiální materiály dokládají pokračující výcvikovou aktivitu roty EOD 152. žpr; MINIGATOR 2025 byl organizován s účastí specialistů roty EOD 152. žpr.","text_en":"Official material documents continued training activity of the 152nd Engineer Battalion EOD company; MINIGATOR 2025 was organized with participation of specialists from the 152nd Battalion EOD company.","source_ids":["ENG-SRC-0265","ENG-SRC-0266"]}],"intelligence_gaps_cs":["aktuální 2026 počet a provozuschopnost PMS a souvisejících člunů/vozidel","aktuální personální naplnění a readiness pontonové roty AZ","úplné TO&E roty EOD, certifikační model a equipment matrix","aktuální přímo inspektované vizuály EOD a bridging techniky"],"intelligence_gaps_en":["current 2026 quantity and serviceability of PMS and associated boats/vehicles","current personnel fill and readiness of the reserve pontoon company","full EOD-company TO&E, certification model and equipment matrix","current directly inspected EOD and bridging visuals"],"source_ids":["ENG-SRC-0264","ENG-SRC-0265","ENG-SRC-0266"],"provenance_granularity":"CLAIM_LEVEL","confidence":"HIGH_FOR_PUBLIC_MISSION_AND_TRAINING; UNKNOWN_FOR_CURRENT_READINESS","translation_status":"ANALYST_TRANSLATION","last_verified_date":"2026-08-17","last_update_run":"engineer-osint-20260817-B28"},{"id":"ENG-TECH-0024","classification":"UPDATE","record_nature":"HISTORICAL_BACKFILL_CZECH_EOD_ROBOT_FLEET","type":"ENG-TECH","record_type":"TECHNOLOGY","country":"CZE","title_cs":"Robotické prostředky EOD AČR — historická evidence 2021","title_en":"Czech Armed Forces EOD robots — 2021 historical evidence","summary_cs":"Oficiální AČR dne 15. 4. 2021 uváděla, že 15. ženijní pluk disponoval 22 roboty, z toho 6 v HAZMAT konfiguraci; zmiňovány jsou typy Talon a Dragon Runner 10/20. Dodávky EOD vybavení z amerických programů probíhaly od roku 2012, přičemž největší etapa byla podle článku v roce 2020. Tento údaj je historický baseline a bez současného zdroje nesmí být používán jako stav roku 2026.","summary_en":"On 15 April 2021, an official Czech Armed Forces article stated that the 15th Engineer Regiment held 22 robots, six in HAZMAT configuration, and named Talon and Dragon Runner 10/20. U.S.-supported EOD equipment deliveries had run since 2012, with the largest stage reported in 2020. This is a historical baseline and must not be treated as the 2026 fleet status without current confirmation.","claims":[{"classification":"FACT","text_cs":"AČR dne 15. 4. 2021 veřejně uvedla stav 22 robotů u 15. ženijního pluku, z nich 6 v HAZMAT verzi.","text_en":"On 15 April 2021 the Czech Armed Forces publicly stated that the 15th Engineer Regiment had 22 robots, six in HAZMAT configuration.","source_ids":["ENG-SRC-0267"]},{"classification":"FACT","text_cs":"Článek uvádí roboty Talon a Dragon Runner 10/20 a popisuje pokračující dodávky EOD vybavení z amerických programů od roku 2012; největší etapa měla proběhnout v roce 2020.","text_en":"The article names Talon and Dragon Runner 10/20 and describes U.S.-supported EOD equipment deliveries since 2012, with the largest stage reported in 2020.","source_ids":["ENG-SRC-0267"]}],"temporal_observations":[{"event_date":"2021-04-15","observation_type":"FLEET_SNAPSHOT","summary_cs":"Veřejný snapshot: 22 EOD robotů u 15. ženijního pluku, z toho 6 HAZMAT; Talon a Dragon Runner 10/20 jsou výslovně uvedeny.","summary_en":"Public snapshot: 22 EOD robots at the 15th Engineer Regiment, six HAZMAT; Talon and Dragon Runner 10/20 explicitly named.","source_ids":["ENG-SRC-0267"],"confidence":"HIGH","temporal_status":"HISTORICAL"}],"source_ids":["ENG-SRC-0267"],"provenance_granularity":"CLAIM_LEVEL","confidence":"HIGH_FOR_2021_SNAPSHOT; UNKNOWN_FOR_2026_CURRENT_FLEET","last_evidence_date":"2021-04-15","last_verified_date":"2026-08-17","last_update_run":"engineer-osint-20260817-B29","intelligence_gaps_cs":["aktuální 2026 počet robotů","provozuschopnost","rozdělení mezi útvary/týmy","aktuální typová a konfigurační skladba","aktuální přímo inspektované vizuály"],"intelligence_gaps_en":["current 2026 robot quantity","serviceability","distribution across units/teams","current type/configuration mix","current directly inspected visuals"],"translation_status":"ANALYST_TRANSLATION"},{"id":"ENG-UNIT-0032","classification":"UPDATE","record_nature":"HISTORICAL_BACKFILL_CZECH_EOD_LINEAGE","type":"ENG-UNIT","record_type":"UNIT","country":"CZE","title_cs":"152. ženijní prapor / EOD — historická linie schopnosti","title_en":"152nd Engineer Battalion / EOD — historical capability lineage","summary_cs":"Oficiální AČR v prosinci 2023 při 20. výročí EOD uváděla, že první větší rota EOD vznikla 1. 12. 2003. Při odborné soutěži v roce 2023 byly zastoupeny čtyři pyrotechnické skupiny po čtyřech lidech: po jedné z každého praporu 15. ženijního pluku a zástupci CTIP. Jde o historickou organizační a výcvikovou evidenci; není to důkaz současné tabulkové struktury, počtu týmů ani personální naplněnosti v roce 2026.","summary_en":"In December 2023, marking 20 years of EOD, the Czech Armed Forces stated that the first larger EOD company was established on 1 December 2003. A 2023 professional competition included four four-person pyrotechnic groups: one from each battalion of the 15th Engineer Regiment plus representatives of CTIP. This is historical organization/training evidence, not proof of the 2026 authorized structure, team count or personnel fill.","claims":[{"classification":"FACT","text_cs":"AČR uvádí datum 1. 12. 2003 jako vznik první větší roty EOD.","text_en":"The Czech Armed Forces identify 1 December 2003 as the establishment date of the first larger EOD company.","source_ids":["ENG-SRC-0268"]},{"classification":"FACT","text_cs":"V prosinci 2023 se odborné soutěže účastnily čtyři čtyřčlenné pyrotechnické skupiny: po jedné z každého praporu 15. ženijního pluku a zástupci CTIP.","text_en":"In December 2023 a professional competition involved four four-person pyrotechnic groups: one from each battalion of the 15th Engineer Regiment and representatives of CTIP.","source_ids":["ENG-SRC-0268"]}],"temporal_observations":[{"event_date":"2003-12-01","observation_type":"EOD_ORGANIZATION_LINEAGE","summary_cs":"Vznik první větší roty EOD podle retrospektivního oficiálního článku AČR z roku 2023.","summary_en":"Establishment of the first larger EOD company according to a 2023 official Czech Armed Forces retrospective.","source_ids":["ENG-SRC-0268"],"confidence":"HIGH","temporal_status":"HISTORICAL"},{"event_date":"2023-12-01","observation_type":"EOD_TRAINING_ORGANIZATION_SNAPSHOT","summary_cs":"Odborná soutěž doložila čtyři čtyřčlenné pyrotechnické skupiny zastupující oba prapory 15. žp a CTIP; nepřenášet automaticky na aktuální TO&E.","summary_en":"Professional competition evidenced four four-person pyrotechnic groups representing both battalions of the 15th Engineer Regiment and CTIP; do not automatically map this to current TO&E.","source_ids":["ENG-SRC-0268"],"confidence":"HIGH_FOR_EVENT_PARTICIPATION","temporal_status":"HISTORICAL"}],"source_ids":["ENG-SRC-0268"],"provenance_granularity":"CLAIM_LEVEL","confidence":"HIGH_FOR_HISTORICAL_LINEAGE_AND_2023_EVENT; UNKNOWN_FOR_2026_TOE","last_evidence_date":"2023-12-01","last_verified_date":"2026-08-17","last_update_run":"engineer-osint-20260817-B29","translation_status":"ANALYST_TRANSLATION"},{"id":"ENG-UNIT-0030","classification":"UPDATE","record_nature":"ENTITY_ENRICHMENT_CURRENT_ORBAT_CAPABILITY","type":"ENG-UNIT","record_type":"UNIT","country":"CZE","title_cs":"15. ženijní pluk — aktuální veřejný ORBAT a schopnosti","title_en":"15th Engineer Regiment — current public ORBAT and capabilities","summary_cs":"Aktuálně dostupný veřejný profil MO uvádí, že 15. ženijní pluk tvoří 151., 152. a 153. ženijní prapor. Veřejný profil Pozemních sil současně potvrzuje podporu pohybu, překonávání překážek, zřizování průchodů, ochranu v terénu a pyrotechnické úkoly. Jde o veřejný force-design/capability baseline, nikoli úplné TO&E nebo readiness hodnocení.","summary_en":"The currently accessible MoD public profile states that the 15th Engineer Regiment comprises the 151st, 152nd and 153rd Engineer Battalions. The Land Forces public profile also confirms mobility support, obstacle crossing, passage creation, protection and EOD tasks. This is a public force-design/capability baseline, not complete TO&E or a readiness assessment.","source_ids":["ENG-SRC-0269","ENG-SRC-0270","ENG-SRC-0271"],"related_ids":["ENG-UNIT-0031","ENG-UNIT-0032","ENG-UNIT-0033"],"relation_ids":["ENG-REL-0001","ENG-REL-0002","ENG-REL-0003"],"evidence_ids":["ENG-EVID-0001","ENG-EVID-0002","ENG-EVID-0003"],"temporal_status":"CURRENT_PUBLIC_PROFILE","last_verified_date":"2026-08-17","confidence":"HIGH_FOR_PUBLIC_PROFILE; UNKNOWN_FOR_NONPUBLIC_TOE_READINESS","translation_status":"ANALYST_TRANSLATION"},{"id":"ENG-UNIT-0032","classification":"UPDATE","record_nature":"HISTORICAL_BACKFILL_ORGANIZATIONAL_LINEAGE","type":"ENG-UNIT","record_type":"UNIT","country":"CZE","title_cs":"152. ženijní prapor — organizační lineage 2020","title_en":"152nd Engineer Battalion — 2020 organizational lineage","summary_cs":"Oficiální profil MO uvádí, že 152. ženijní prapor byl vytvořen k 1. 1. 2020 ze 151. a 153. ženijního praporu. Záznam je historická organizační observation; bez detailnějšího dokumentu nelze určit přesné převody rot, personálu ani materiálu.","summary_en":"The official MoD profile states that the 152nd Engineer Battalion was formed on 1 January 2020 from the 151st and 153rd Engineer Battalions. This is a historical organizational observation; the exact transfer of companies, personnel or equipment cannot be determined from the public profile alone.","source_ids":["ENG-SRC-0272"],"relation_ids":["ENG-REL-0004","ENG-REL-0005"],"evidence_ids":["ENG-EVID-0004"],"temporal_observations":[{"event_date":"2020-01-01","observation_type":"ORGANIZATIONAL_FORMATION","summary_cs":"Vznik 152. žpr ze 151. a 153. žpr podle veřejného oficiálního profilu.","summary_en":"Formation of the 152nd from the 151st and 153rd according to the official public profile.","source_ids":["ENG-SRC-0272"],"confidence":"HIGH_FOR_SOURCE_WORDING","temporal_status":"HISTORICAL"}],"last_verified_date":"2026-08-17","confidence":"HIGH_FOR_FORMATION_DATE_AND_SOURCE_WORDING","translation_status":"ANALYST_TRANSLATION"},{"id":"ENG-UNIT-0031","type":"ENG-UNIT","update_type":"ENTITY_ENRICHMENT_AND_TEMPORAL_CORRECTION","summary_cs":"Aktuální veřejný profil uvádí velení a štáb, velitelskou rotu, 1. a 2. rotu bojové ženijní podpory, ženijní speciální rotu, rotu logistiky a obvaziště. Samostatná věta stejné stránky o záchranné rotě AZ od 1. 1. 2020 je časově v rozporu s oficiálním článkem z 2. 11. 2022, podle něhož se od roku 2023 AZ u 151. žpr mění na rotu bojové ženijní podpory; proto se starší formulace nepoužívá jako současný ORBAT.","summary_en":"The current public profile lists command/staff, command company, 1st and 2nd combat engineer support companies, engineer special company, logistics company and aid station. A separate sentence on the same page saying a reserve rescue company has been included since 1 Jan 2020 is temporally contradicted by an official 2 Nov 2022 article stating the 151st reserve company changes to combat engineer support from 2023; the older wording is therefore not used as current ORBAT.","source_ids":["ENG-SRC-0276","ENG-SRC-0280"],"evidence_ids":["ENG-EVID-0005","ENG-EVID-0011"],"temporal_observations":[{"event_date":"2014-06-03","observation_type":"RCP_CIED_TRAINING","temporal_status":"HISTORICAL","source_ids":["ENG-SRC-0279"],"evidence_ids":["ENG-EVID-0010"]},{"event_date":"2023-01-01","observation_type":"RESERVE_FORCE_DESIGN_TRANSITION","temporal_status":"HISTORICAL_CHANGE_WITH_CURRENT_IMPLICATION","source_ids":["ENG-SRC-0280"],"evidence_ids":["ENG-EVID-0011"]}]},{"id":"ENG-UNIT-0032","type":"ENG-UNIT","update_type":"ENTITY_ENRICHMENT","summary_cs":"Veřejné stránky potvrzují všeobecnou ženijní podporu, pontonovou a pontonovou AZ rotu s PMS, dvě roty všeobecné ženijní podpory, rotu EOD a rotu logistiky. Počet PMS, EOD týmů, personální naplněnost ani readiness nejsou z těchto zdrojů odvozovány.","summary_en":"Public pages confirm general engineer support, active and reserve pontoon companies using PMS, two general engineer support companies, an EOD company and a logistics company. PMS quantity, EOD team count, manning and readiness are not inferred from these sources.","source_ids":["ENG-SRC-0272","ENG-SRC-0277"],"relation_ids":["ENG-REL-0006","ENG-REL-0007"],"evidence_ids":["ENG-EVID-0006","ENG-EVID-0007"]},{"id":"ENG-UNIT-0033","type":"ENG-UNIT","update_type":"HISTORICAL_BACKFILL","summary_cs":"Oficiální veřejný profil uvádí, že 153. žpr byl založen v roce 2008 na místě zrušeného 156. záchranného praporu. Tato formulace se neeviduje jako DERIVED_FROM, protože sama o sobě neprokazuje organizační nástupnictví ani převod osob či materiálu.","summary_en":"The official public profile states that the 153rd Engineer Battalion was established in 2008 at the site of the abolished 156th Rescue Battalion. This is not modeled as DERIVED_FROM because the wording alone does not establish organizational succession or transfer of personnel/equipment.","source_ids":["ENG-SRC-0278"],"evidence_ids":["ENG-EVID-0008"],"temporal_observations":[{"event_date":"2008","observation_type":"UNIT_ESTABLISHMENT_CONTEXT","temporal_status":"HISTORICAL","source_ids":["ENG-SRC-0278"],"evidence_id  companies, an EOD company and a logistics company. PMS quantity, EOD team count, manning and readiness are not inferred from these sources.","source_ids":["ENG-SRC-0272","ENG-SRC-0277"],"relation_ids":["ENG-REL-0006","ENG-REL-0007"],"evidence_ids":["ENG-EVID-0006","ENG-EVID-0007"]},{"id":"ENG-UNIT-0033","type":"ENG-UNIT","update_type":"HISTORICAL_BACKFILL","summary_cs":"Oficiální veřejný profil uvádí, že 153. žpr byl založen v roce 2008 na místě zrušeného 156. záchranného praporu. Tato formulace se neeviduje jako DERIVED_FROM, protože sama o sobě neprokazuje organizační nástupnictví ani převod osob či materiálu.","summary_en":"The official public profile states that the 153rd Engineer Battalion was established in 2008 at the site of the abolished 156th Rescue Battalion. This is not modeled as DERIVED_FROM because the wording alone does not establish organizational succession or transfer of personnel/equipment.","source_ids":["ENG-SRC-0278"],"evidence_ids":["ENG-EVID-0008"],"temporal_observations":[{"event_date":"2008","observation_type":"UNIT_ESTABLISHMENT_CONTEXT","temporal_status":"HISTORICAL","source_ids":["ENG-SRC-0278"],"evidence_ids":["ENG-EVID-0008"]}]},{"id":"ENG-TECH-0024","type":"ENG-TECH","country":"CZE","update_type":"HISTORICAL_BACKFILL_AND_ENTITY_ENRICHMENT","title_cs":"EOD robotika 15. ženijního pluku — historická akviziční a vybavovací řada","title_en":"15th Engineer Regiment EOD robotics — historical acquisition and equipment timeline","summary_cs":"Oficiální AČR zdroje dokládají víceletý rozvoj EOD vybavení 15. ženijního pluku: v roce 2017 dvě americké materiálové pomoci přibližně za 30 mil. Kč zahrnovaly modernizace robotů TALON, detektory kovů, bomb suits a výcvikové pomůcky; v dubnu 2021 AČR uváděla 22 robotů, z toho šest v HAZMAT konfiguraci, v rámci programů o celkové hodnotě přibližně 250 mil. Kč. Jde o historické snapshoty, nikoli současný inventář roku 2026.","summary_en":"Official Czech Armed Forces sources document a multi-year EOD equipment build-up at the 15th Engineer Regiment: in 2017 two U.S. assistance projects worth about CZK 30 million included TALON robot upgrades, metal detectors, bomb suits and training aids; in April 2021 the Czech Armed Forces reported 22 robots, six in HAZMAT configuration, within programs worth about CZK 250 million in total. These are historical snapshots, not a 2026 current inventory.","source_ids":["ENG-SRC-0288","ENG-SRC-0267"],"evidence_ids":["ENG-EVID-0016"],"temporal_status":"HISTORICAL_WITH_CURRENT_CONFIRMATION_GAP","current_value_status":"CURRENT_UNKNOWN","current_quantity":"UNKNOWN","visual_gap":"CURRENT_DIRECTLY_INSPECTED_VISUALS_UNRESOLVED","translation_status":"ANALYST_TRANSLATION"},{"id":"ENG-TECH-0024","type":"ENG-TECH","country":"CZE","title_cs":"EOD robotické a specializované vybavení 15. ženijního pluku — akviziční časová osa","title_en":"15th Engineer Regiment EOD robotic and specialist equipment — acquisition timeline","summary_cs":"Časová řada byla doplněna o oficiální snapshot k 5. 5. 2022: 15. ženijní pluk tehdy uváděl 31 robotů (2 velké, 18 středních, 11 malých), po převzetí 7 nových kusů. Je to novější historický veřejný počet než snapshot 22 robotů z 15. 4. 2021, ale současný počet a provozuschopnost v roce 2026 zůstávají UNKNOWN.","summary_en":"The timeline now includes an official 5 May 2022 snapshot: the 15th Engineer Regiment reported 31 robots (2 large, 18 medium and 11 small) after receiving seven new systems. This is a newer historical public count than the 22-robot snapshot from 15 Apr 2021, but current 2026 quantity and serviceability remain UNKNOWN.","source_ids":["ENG-SRC-0289"],"evidence_ids":["ENG-EVID-0017"],"translation_status":"ANALYST_TRANSLATION","update_type":"HISTORICAL_BACKFILL_AND_OBSERVED_MINIMUM_UPDATE","observed_minimum":31,"last_publicly_confirmed_value":31,"value_as_of":"2022-05-05","current_value_status":"CURRENT_UNKNOWN","current_quantity":"UNKNOWN","current_serviceability":"UNKNOWN","temporal_observations":[{"ev
