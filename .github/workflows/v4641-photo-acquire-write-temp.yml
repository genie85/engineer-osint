name: ENGINEER OSINT temporary v4.6.41 exact wave-2 photo acquisition

on:
  push:
    branches:
      - chatgpt/engineer-osint-v4641-wave2-photo-acquisition-execution
    paths:
      - .github/workflows/v4641-photo-acquire-write-temp.yml

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated authorized acquisition branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install deterministic image encoder
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Materialize exact authorized photos and provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.parse
          from PIL import Image, ImageOps

          root = pathlib.Path('docs/engineer-osint')
          auth_path = root / 'V4640_WAVE2_PHOTO_ACQUISITION_WORKFLOW_AUTHORIZATION.json'
          auth = json.loads(auth_path.read_text(encoding='utf-8'))
          expected_branch = 'chatgpt/engineer-osint-v4641-wave2-photo-acquisition-execution'
          workflow_path = '.github/workflows/v4641-photo-acquire-write-temp.yml'
          if os.environ.get('GITHUB_REF_NAME') != expected_branch:
            raise SystemExit(f'unexpected branch: {os.environ.get("GITHUB_REF_NAME")}')
          if auth.get('status') != 'READY_FOR_IMPLEMENTATION':
            raise SystemExit('authorization is not READY_FOR_IMPLEMENTATION')
          ac = auth['authorized_change']
          if ac.get('temporary_workflow_path') != workflow_path:
            raise SystemExit('workflow path is not exactly authorized')
          if ac.get('temporary_workflow_permissions') != {'contents': 'write'}:
            raise SystemExit('workflow permissions are not exactly authorized')
          if ac.get('allow_canonical_change') or ac.get('allow_run_store_change') or ac.get('allow_historical_run_change'):
            raise SystemExit('authorization unexpectedly allows protected data mutation')

          allowed = set(ac['allowed_persistent_paths'])
          expected_allowed = {
            'docs/engineer-osint/assets/photos/eng-tech-0045-m1074-jab.webp',
            'docs/engineer-osint/assets/photos/eng-tech-0048-m1150-abv.webp',
            'docs/engineer-osint/assets/photos/eng-tech-0049-leguan.webp',
            'docs/engineer-osint/photo-local-acquisitions/v4641-wave2-ready-for-import.json',
            'docs/engineer-osint/photo-review-batches/v4641.json',
            'docs/engineer-osint/photo-research/v4635-wave2-fast-candidates.json',
          }
          if allowed != expected_allowed:
            raise SystemExit(f'authorization allowlist mismatch: {sorted(allowed)}')

          metadata = {
            'ENG-TECH-0045': {
              'system_name': 'M1074 Joint Assault Bridge',
              'origin_url': 'https://commons.wikimedia.org/wiki/File:Joint_Assault_Bridge_Vehicle_during_Winter_Shield_2021_(2).jpg',
              'source_title': 'Joint Assault Bridge Vehicle during Winter Shield 2021 (2).jpg',
              'source_type': 'WIKIMEDIA_COMMONS_FILE_PAGE',
              'author_rightsholder': 'Spc. Michael Baumberger / U.S. Army',
              'license': 'Public domain — U.S. Army work',
              'license_url': 'https://commons.wikimedia.org/wiki/Template:PD-USGov-Military-Army',
              'attribution_requirement': 'No copyright attribution is legally required for this U.S. Army public-domain work; retain Spc. Michael Baumberger / U.S. Army and Commons source provenance in ENGINEER OSINT metadata for auditability.',
              'identity_evidence': 'The Commons file description explicitly states that Pfc. Mikylo Parker uses an M1074 Joint Assault Bridge Vehicle to lay a Heavy Assault Scissor Bridge during Winter Shield 2021, establishing exact platform identity.',
              'license_evidence': 'The Commons file-page licensing section states that the image is a work of a U.S. Army soldier or employee made as part of official duties and is public domain in the United States.',
            },
            'ENG-TECH-0048': {
              'system_name': 'M1150 Assault Breacher Vehicle',
              'origin_url': 'https://commons.wikimedia.org/wiki/File:M1150_Assault_Breacher_Vehicle_at_the_Drawsko_Pomorskie_Training_Area.jpg',
              'source_title': 'M1150 Assault Breacher Vehicle at the Drawsko Pomorskie Training Area.jpg',
              'source_type': 'WIKIMEDIA_COMMONS_FILE_PAGE',
              'author_rightsholder': 'Spc. Javan Johnson / U.S. Army',
              'license': 'Public domain — U.S. Army work',
              'license_url': 'https://commons.wikimedia.org/wiki/Template:PD-USGov-Military-Army',
              'attribution_requirement': 'No copyright attribution is legally required for this U.S. Army public-domain work; retain Spc. Javan Johnson / U.S. Army and Commons source provenance in ENGINEER OSINT metadata for auditability.',
              'identity_evidence': 'The Commons file is explicitly titled as an M1150 Assault Breacher Vehicle image, is categorized as Assault Breacher Vehicle, and is attributed to a U.S. Army photographer during Defender Europe 2020 at Drawsko Pomorskie Training Area, establishing exact platform identity.',
              'license_evidence': 'The Commons file-page licensing section states that the file is a work of a U.S. Army soldier or employee made as part of official duties and is public domain in the United States.',
            },
            'ENG-TECH-0049': {
              'system_name': 'LEGUAN',
              'origin_url': 'https://commons.wikimedia.org/wiki/File:Leguan_bridge_layer.jpg',
              'source_title': 'Leguan bridge layer.jpg',
              'source_type': 'WIKIMEDIA_COMMONS_FILE_PAGE',
              'author_rightsholder': 'Dutch Ministry of Defence',
              'license': 'CC BY-SA 4.0',
              'license_url': 'https://creativecommons.org/licenses/by-sa/4.0/',
              'attribution_requirement': 'Credit Dutch Ministry of Defence, identify the Wikimedia Commons source and VRT ticket 2010120610018876, link the CC BY-SA 4.0 licence, indicate modifications, and distribute adaptations under the same or a compatible licence.',
              'identity_evidence': 'The Commons file description explicitly identifies the image as a side view of a LEGUAN bridge layer, establishing exact system identity.',
              'license_evidence': 'The Commons file-page Licensing section states that this media file is licensed under Creative Commons Attribution-ShareAlike 4.0 International and records Dutch Ministry of Defence VRT permission under ticket 2010120610018876. The separate structured-data CC0 statement applies to file-namespace structured metadata, not the media-file licence.',
            },
          }

          local_names = {
            'ENG-TECH-0045': 'eng-tech-0045-m1074-jab.webp',
            'ENG-TECH-0048': 'eng-tech-0048-m1150-abv.webp',
            'ENG-TECH-0049': 'eng-tech-0049-leguan.webp',
          }
          auth_media = {entry['card_id']: entry for entry in auth['exact_media']}
          if set(auth_media) != set(metadata):
            raise SystemExit('authorized media set mismatch')

          temp = pathlib.Path('/tmp/engineer-osint-v4641')
          temp.mkdir(parents=True, exist_ok=True)
          out_dir = root / 'assets' / 'photos'
          out_dir.mkdir(parents=True, exist_ok=True)
          acquisitions_dir = root / 'photo-local-acquisitions'
          acquisitions_dir.mkdir(parents=True, exist_ok=True)

          manifest = {
            'schema_version': 1,
            'batch': 'v4.6.41',
            'acquired_at': '2026-09-03',
            'policy': 'Archive exact reviewed reusable media locally before any separate canonical LOCAL_IMAGE linkage.',
            'scope': 'Exact authorized wave-2 acquisition for ENG-TECH-0045, ENG-TECH-0048 and ENG-TECH-0049.',
            'source_main_sha': '190ce732b1e940d3ce7db9caf15db80ac9f98368',
            'authorization_path': 'docs/engineer-osint/V4640_WAVE2_PHOTO_ACQUISITION_WORKFLOW_AUTHORIZATION.json',
            'read_only_discovery_run_id': 33804703981,
            'read_only_discovery_artifact_id': 9912435829,
            'read_only_discovery_artifact_digest': 'sha256:904c2c4ed2dbc138ddb853ef6d40b14a4ccafb721dfa8ed7ece55c3c1bbb1a4d',
            'execution_run_id': int(os.environ['GITHUB_RUN_ID']),
            'transformation': 'Exact Commons source binary verified first, then EXIF orientation normalized, resized only when the long edge exceeded 1600 px, and encoded as WebP quality 82 with Pillow 11.3.0, method 6, exact=True; no crop or editorial alteration.',
            'entries': [],
          }

          for card_id in sorted(metadata):
            authorized = auth_media[card_id]
            source_name = authorized['source_file_name']
            encoded = urllib.parse.quote(source_name, safe='')
            acquisition_url = f'https://commons.wikimedia.org/wiki/Special:Redirect/file/{encoded}'
            source_path = temp / source_name.replace('/', '_')
            subprocess.run([
              'curl', '-L', '--fail', '--retry', '4', '--retry-all-errors',
              '--connect-timeout', '20', '--max-time', '180',
              '-A', 'ENGINEER-OSINT/1.0 (GitHub Actions authorized reviewed-media acquisition)',
              '-o', str(source_path), acquisition_url,
            ], check=True)
            source_bytes = source_path.read_bytes()
            source_sha = hashlib.sha256(source_bytes).hexdigest()
            if source_sha != authorized['source_sha256']:
              raise SystemExit(f'{card_id} source SHA drift: expected {authorized["source_sha256"]}, got {source_sha}')
            if len(source_bytes) != authorized['source_bytes']:
              raise SystemExit(f'{card_id} source byte count drift')

            with Image.open(source_path) as raw:
              image = ImageOps.exif_transpose(raw)
              source_dimensions = list(image.size)
              if source_dimensions != authorized['source_dimensions']:
                raise SystemExit(f'{card_id} source dimensions drift: {source_dimensions}')
              if max(image.size) > 1600:
                image.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
              if image.mode not in ('RGB', 'RGBA'):
                image = image.convert('RGBA' if 'A' in image.getbands() else 'RGB')
              local_path = out_dir / local_names[card_id]
              image.save(local_path, 'WEBP', quality=82, method=6, exact=True)
              local_dimensions = list(image.size)

            local_bytes = local_path.read_bytes()
            local_sha = hashlib.sha256(local_bytes).hexdigest()
            if local_sha != authorized['expected_local_sha256']:
              raise SystemExit(f'{card_id} local SHA drift: expected {authorized["expected_local_sha256"]}, got {local_sha}')
            if len(local_bytes) != authorized['expected_local_bytes']:
              raise SystemExit(f'{card_id} local byte count drift')
            if local_dimensions != authorized['expected_local_dimensions']:
              raise SystemExit(f'{card_id} local dimensions drift: {local_dimensions}')

            item = {'card_id': card_id, **metadata[card_id]}
            item.update({
              'reviewed_at': '2026-09-03',
              'review_batch': 'v4.6.41' if card_id == 'ENG-TECH-0049' else 'v4.6.39',
              'source_file_name': source_name,
              'source_acquisition_url': acquisition_url,
              'source_sha256': source_sha,
              'source_bytes': len(source_bytes),
              'source_dimensions': source_dimensions,
              'local_image_path': f'assets/photos/{local_names[card_id]}',
              'local_sha256': local_sha,
              'local_bytes': len(local_bytes),
              'local_dimensions': local_dimensions,
              'modifications': 'EXIF orientation normalized; resized only if long edge >1600 px; WebP quality 82 with Pillow 11.3.0, method 6, exact=True; no crop or editorial alteration.',
            })
            manifest['entries'].append(item)

          manifest_path = acquisitions_dir / 'v4641-wave2-ready-for-import.json'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          correction = {
            'schema_version': 2,
            'entries': [{
              'card_id': 'ENG-TECH-0049',
              'system_name': 'LEGUAN',
              'status': 'READY_FOR_IMPORT',
              'review_batch': 'v4.6.41',
              **metadata['ENG-TECH-0049'],
              'reviewed_at': '2026-09-03',
              'supersedes_review_batch': 'v4.6.39',
              'correction_reason': 'The v4.6.39 entry incorrectly treated the Commons structured-data CC0 statement as the media-file licence. The file-page Licensing section explicitly licenses the image under CC BY-SA 4.0.',
              'import_blocker': 'Reusable exact-identity CC BY-SA 4.0 source is verified and the repository-local binary is archived by v4.6.41; canonical LOCAL_IMAGE linkage remains a separate protected step.'
            }]
          }
          (root / 'photo-review-batches' / 'v4641.json').write_text(
            json.dumps(correction, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          research_path = root / 'photo-research' / 'v4635-wave2-fast-candidates.json'
          research = json.loads(research_path.read_text(encoding='utf-8'))
          candidate = next((x for x in research['candidates'] if x.get('card_id') == 'ENG-TECH-0049'), None)
          if not candidate:
            raise SystemExit('LEGUAN research candidate missing')
          if candidate.get('license') != 'CC0 1.0 Universal Public Domain Dedication':
            raise SystemExit(f'LEGUAN research baseline changed unexpectedly: {candidate.get("license")}')
          candidate.update({
            'license': 'CC BY-SA 4.0',
            'license_url': 'https://creativecommons.org/licenses/by-sa/4.0/',
            'license_evidence': metadata['ENG-TECH-0049']['license_evidence'],
            'license_verification_note': 'v4.6.41 correction: the prior CC0 assertion conflated Commons structured-data licensing with the image licence. The file-page Licensing section is CC BY-SA 4.0.',
            'next_action': 'Exact file archived locally with SHA-256 and attribution/share-alike provenance; canonical LOCAL_IMAGE linkage remains a separate protected step.'
          })
          research_path.write_text(json.dumps(research, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate archived media contract
        shell: bash
        run: |
          set -euo pipefail
          node --test docs/engineer-osint/tests/v4601-ready-photo-acquisition.test.mjs
          python3 - <<'PY'
          import json, pathlib
          for path in [
            'docs/engineer-osint/photo-local-acquisitions/v4641-wave2-ready-for-import.json',
            'docs/engineer-osint/photo-review-batches/v4641.json',
            'docs/engineer-osint/photo-research/v4635-wave2-fast-candidates.json',
          ]:
            json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
          PY

      - name: Commit only exact authorized persistent paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
            'docs/engineer-osint/assets/photos/eng-tech-0045-m1074-jab.webp',
            'docs/engineer-osint/assets/photos/eng-tech-0048-m1150-abv.webp',
            'docs/engineer-osint/assets/photos/eng-tech-0049-leguan.webp',
            'docs/engineer-osint/photo-local-acquisitions/v4641-wave2-ready-for-import.json',
            'docs/engineer-osint/photo-review-batches/v4641.json',
            'docs/engineer-osint/photo-research/v4635-wave2-fast-candidates.json',
          }
          raw = subprocess.check_output(['git', 'status', '--porcelain=v1', '-z'])
          records = [r for r in raw.decode('utf-8').split('\0') if r]
          paths = {r[3:] for r in records}
          if paths != allowed:
            raise SystemExit(f'dirty-path allowlist mismatch: {sorted(paths)}')
          PY
          git config user.name 'ENGINEER OSINT acquisition bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            docs/engineer-osint/assets/photos/eng-tech-0045-m1074-jab.webp \
            docs/engineer-osint/assets/photos/eng-tech-0048-m1150-abv.webp \
            docs/engineer-osint/assets/photos/eng-tech-0049-leguan.webp \
            docs/engineer-osint/photo-local-acquisitions/v4641-wave2-ready-for-import.json \
            docs/engineer-osint/photo-review-batches/v4641.json \
            docs/engineer-osint/photo-research/v4635-wave2-fast-candidates.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -eq 6
          git commit -m 'v4.6.41: archive exact wave-2 reviewed photos'
          git push origin "HEAD:${GITHUB_REF_NAME}"
