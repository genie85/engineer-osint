name: Trusted base advisory merge classification

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: engineer-safe-automerge-dry-run
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Classify passive objects using only the checked-out base helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/safe_automerge.py --repo "$GITHUB_WORKSPACE"
          --policy tools/safe-automerge-policy.json
          --output "$RUNNER_TEMP/dry-run-receipt.json"
      - name: Preserve base-issued advisory receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dry-run-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dry-run-receipt.json
          if-no-files-found: error
          retention-days: 7
