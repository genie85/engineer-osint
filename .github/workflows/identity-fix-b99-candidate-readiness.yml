name: ENGINEER OSINT identity-fix B99 candidate readiness

on:
  push:
    branches:
      - chatgpt/engineer-osint-v4533-identity-fix-candidate
  pull_request:
    branches: [main]
    paths:
      - 'docs/engineer-osint/**'
      - '.github/workflows/identity-fix-b99-candidate-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical lifecycle state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test complete P0/P1 contract
        run: node --test docs/engineer-osint/tests/*.test.mjs
      - name: Validate persistent canonical chain
        run: node docs/engineer-osint/validate-patch.mjs
      - name: Build current canonical dashboard
        run: node docs/engineer-osint/build-pages.mjs
      - name: Materialize canonical media
        run: node docs/engineer-osint/materialize-canonical-media-history.mjs
      - name: Detect B99 lifecycle phase
        id: lifecycle
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('docs/engineer-osint/data/run-store-manifest.json','utf8'));
          const runs=m.runs||[],b98='engineer-osint-20260830-B98',b99='engineer-osint-20260830-B99';
          const current=runs.at(-1)?.run_id||m.snapshot?.run_id,i=runs.findIndex(x=>x.run_id===b99);
          if(current===b98&&i<0)console.log('phase=PRE_B99');
          else if(current===b99&&i===runs.length-1)console.log('phase=POST_B99');
          else if(i>=0&&runs.length-1>i)console.log('phase=POST_B99_STEADY');
          else throw new Error(`unexpected B99 lifecycle tip ${current}`);
          NODE
      - name: Build exact read-only identity-fix B99 candidate
        if: steps.lifecycle.outputs.phase == 'PRE_B99'
        run: node docs/engineer-osint/build-identity-fix-b99-candidate.mjs
      - name: Validate historical candidate through standard append helper dry-run
        if: steps.lifecycle.outputs.phase == 'PRE_B99'
        run: |
          set -euo pipefail
          candidate='docs/engineer-osint-dist/identity-fix-b99-candidate.json'
          plan='docs/engineer-osint-dist/identity-fix-b99-append-plan.json'
          manifest='docs/engineer-osint/data/run-store-manifest.json'
          runs_dir='docs/engineer-osint/data/runs'
          manifest_before=$(sha256sum "$manifest" | awk '{print $1}')
          runs_before=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          node docs/engineer-osint/append-run.mjs "$candidate" > "$plan"
          manifest_after=$(sha256sum "$manifest" | awk '{print $1}')
          runs_after=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          test "$manifest_before" = "$manifest_after"
          test "$runs_before" = "$runs_after"
          git diff --exit-code -- docs/engineer-osint/data
          node - <<'NODE'
          const fs=require('fs');
          const policy=JSON.parse(fs.readFileSync('docs/engineer-osint/V4533_IDENTITY_FIX_CANDIDATE_READINESS.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/identity-fix-b99-candidate-audit.json','utf8'));
          const plan=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/identity-fix-b99-append-plan.json','utf8'));
          if(audit.status!=='PASS'||audit.operation_count!==36||audit.replace_field_count!==27||audit.remove_field_count!==9)throw new Error('identity B99 candidate scope mismatch');
          if(audit.overlay_mutations_before!==70||audit.overlay_mutations_after!==18||audit.canonical_overlay_mutations_after!==0||audit.legacy_mirror_mutations_after!==18)throw new Error('identity B99 canonical/mirror residual classification failed');
          if(audit.legacy_mirror_cleanup_required!==true||audit.legacy_mirror_residual_paths?.some(path=>!path.startsWith(policy.allowed_legacy_mirror_prefix)))throw new Error('identity B99 legacy mirror residual escaped pinned scope');
          if(plan.status!=='VALIDATED_DRY_RUN')throw new Error(`append helper escaped dry-run: ${plan.status}`);
          if(plan.entry?.file_sha256!==audit.candidate_file_sha256||plan.entry?.canonical_sha256!==audit.resulting_canonical_sha256)throw new Error('identity B99 dry-run hash mismatch');
          if(audit.canonical_write_performed!==false||audit.append_run_write_invoked!==false||audit.safe_to_append!==false||audit.safe_to_retire_identity_fix_overlay!==false)throw new Error('identity B99 safety boundary broadened');
          NODE
      - name: Audit persistent B99 instead of regenerating historical candidate
        if: steps.lifecycle.outputs.phase == 'POST_B99' || steps.lifecycle.outputs.phase == 'POST_B99_STEADY'
        run: node docs/engineer-osint/audit-persistent-b99-identity.mjs
      - name: Verify persistent B99 historical-candidate lifecycle
        if: steps.lifecycle.outputs.phase == 'POST_B99' || steps.lifecycle.outputs.phase == 'POST_B99_STEADY'
        run: |
          git diff --exit-code -- docs/engineer-osint/data
          node - <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/persistent-b99-identity-audit.json','utf8'));
          if(a.status!=='PASS'||a.identity_overlay_residual_mutations!==0||a.b99_append_authorized!==false||a.canonical_write_performed!==false)throw new Error('persistent B99 audit mismatch');
          const active=a.identity_fix_runtime_active===true&&a.identity_fix_runtime_retired===false;
          const retired=a.identity_fix_runtime_active===false&&a.identity_fix_runtime_retired===true;
          if(!active&&!retired)throw new Error('persistent B99 identity lifecycle mismatch');
          if(active&&(a.identity_fix_runtime_removal_authorized!==false||a.identity_overlay_retirement_authorized!==false||a.identity_retirement_validated!==false))throw new Error('active persistent B99 safety boundary broadened');
          if(retired&&(a.identity_fix_runtime_removal_authorized!==true||a.identity_overlay_retirement_authorized!==true||a.identity_retirement_validated!==true||a.identity_fix_source_retained!==true||a.transition_guard_runtime_active!==true))throw new Error('retired persistent B99 lifecycle not authorized/validated');
          NODE
      - name: Upload identity candidate review evidence
        uses: actions/upload-artifact@v4
        with:
          name: identity-fix-b99-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            docs/engineer-osint-dist/identity-fix-b99-candidate.json
            docs/engineer-osint-dist/identity-fix-b99-candidate-audit.json
            docs/engineer-osint-dist/identity-fix-b99-append-plan.json
            docs/engineer-osint-dist/persistent-b99-identity-audit.json
            docs/engineer-osint-dist/persistent-b99-identity-audit.md
