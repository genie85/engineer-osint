name: v4.5.35 explicit legacy mirror sync patch

on:
  push:
    branches:
      - chatgpt/engineer-osint-v4535-explicit-legacy-mirror-sync
    paths:
      - '.github/workflows/v4535-explicit-legacy-mirror-sync-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/engineer-osint-v4535-explicit-legacy-mirror-sync
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact v4.5.35 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          run=Path('docs/engineer-osint/lib/run-store.mjs')
          s=run.read_text()
          old="export const INTELLIGENCE_EXTENSION_VERSION='engineer-osint-intelligence-v1';\n"
          new=old+"export const LEGACY_MIRROR_SYNC_VERSION='engineer-osint-legacy-mirror-sync-v1';\n"
          assert s.count(old)==1
          s=s.replace(old,new)

          anchor="export function validatePatchOperations(patch){\n"
          assert s.count(anchor)==1
          validator=r'''export function validateLegacyMirrorSyncV1(patch){
  const ext=patch?.extensions?.legacy_mirror_sync_v1;
  if(ext===undefined)return {updated_records:[]};
  ensure(isObject(ext),'extensions.legacy_mirror_sync_v1 must be an object');
  assertKeys(ext,['updated_records'],'extensions.legacy_mirror_sync_v1');
  ensure(Array.isArray(ext.updated_records),'extensions.legacy_mirror_sync_v1.updated_records must be an array');
  const protectedFields=new Set(['id','first_seen_run','run_id','last_update_run']);
  const seenTargets=new Set();
  for(const [index,request] of ext.updated_records.entries()){
    const at=`extensions.legacy_mirror_sync_v1.updated_records[${index}]`;
    ensure(isObject(request),`${at} must be an object`);
    assertKeys(request,['target_id','fields'],at);
    ensure(typeof request.target_id==='string'&&request.target_id,`${at}.target_id is required`);
    ensure(!seenTargets.has(request.target_id),`${at}.target_id duplicates ${request.target_id}`);seenTargets.add(request.target_id);
    ensure(Array.isArray(request.fields)&&request.fields.length>0,`${at}.fields must be a non-empty array`);
    ensure(new Set(request.fields).size===request.fields.length,`${at}.fields contains duplicates`);
    for(const field of request.fields){
      ensure(typeof field==='string'&&/^[A-Za-z][A-Za-z0-9_]*$/.test(field),`${at}.fields contains an invalid top-level field`);
      ensure(!protectedFields.has(field),`${at}.fields cannot synchronize protected field ${field}`);
    }
  }
  return ext;
}

function syncExplicitLegacyMirrors(data,ext){
  for(const request of ext.updated_records){
    const canonicalMatches=collection(data,'records').filter(item=>itemKey(item,idRules.records)===request.target_id);
    ensure(canonicalMatches.length===1,`Legacy mirror sync target ${request.target_id} must resolve to exactly one canonical record`);
    const mirrorItems=asArray(data.dashboard_patch_extras?.updated_records);
    const mirrorMatches=mirrorItems.filter(item=>itemKey(item,idRules.records)===request.target_id);
    ensure(mirrorMatches.length===1,`Legacy mirror sync target ${request.target_id} must resolve to exactly one existing updated_records mirror`);
    const source=canonicalMatches[0],mirror=mirrorMatches[0];
    for(const field of request.fields){
      const canonicalOwn=Object.hasOwn(source,field),mirrorOwn=Object.hasOwn(mirror,field);
      ensure(canonicalOwn||mirrorOwn,`Legacy mirror sync field ${request.target_id}.${field} exists in neither canonical nor mirror state`);
      if(canonicalOwn)mirror[field]=structuredClone(source[field]);
      else delete mirror[field];
    }
  }
}

'''
          s=s.replace(anchor,validator+anchor)

          old_apply="  const intelligence=validateIntelligenceExtensionV1(patch);\n  const data=structuredClone(input),runId=patch.state.run_id;\n"
          new_apply="  const intelligence=validateIntelligenceExtensionV1(patch);\n  const legacyMirrorSync=validateLegacyMirrorSyncV1(patch);\n  const data=structuredClone(input),runId=patch.state.run_id;\n"
          assert s.count(old_apply)==1
          s=s.replace(old_apply,new_apply)
          old_sync="  applyOperations(data,patch);\n  syncMirrors(data);\n"
          new_sync="  applyOperations(data,patch);\n  syncMirrors(data);\n  syncExplicitLegacyMirrors(data,legacyMirrorSync);\n"
          assert s.count(old_sync)==1
          s=s.replace(old_sync,new_sync)
          run.write_text(s)

          schema=Path('docs/engineer-osint/schemas/patch-v1.schema.json')
          obj=json.loads(schema.read_text())
          props=obj['properties']['extensions']['properties']
          assert 'legacy_mirror_sync_v1' not in props
          props['legacy_mirror_sync_v1']={'$ref':'#/$defs/legacyMirrorSyncV1'}
          defs=obj['$defs']
          defs['legacyMirrorSyncV1']={
            'type':'object','required':['updated_records'],
            'properties':{'updated_records':{'type':'array','items':{'$ref':'#/$defs/legacyUpdatedRecordMirrorSyncRequest'}}},
            'additionalProperties':False
          }
          defs['legacyUpdatedRecordMirrorSyncRequest']={
            'type':'object','required':['target_id','fields'],
            'properties':{
              'target_id':{'type':'string','minLength':1},
              'fields':{'type':'array','minItems':1,'uniqueItems':True,'items':{'type':'string','pattern':'^[A-Za-z][A-Za-z0-9_]*$'}}
            },'additionalProperties':False
          }
          schema.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')

          tests=Path('docs/engineer-osint/tests/p1-run-store.test.mjs')
          t=tests.read_text()
          import_old="  applyStrictPatchToCanonicalData,loadCanonicalRunStore,RUN_STORE_SCHEMA_VERSION,validatePatchOperations\n"
          import_new="  applyStrictPatchToCanonicalData,loadCanonicalRunStore,RUN_STORE_SCHEMA_VERSION,validateLegacyMirrorSyncV1,validatePatchOperations\n"
          assert t.count(import_old)==1
          t=t.replace(import_old,import_new)
          insert_before="test('strict append materializes a new source and record with provenance',()=>{\n"
          assert t.count(insert_before)==1
          block=r'''test('explicit legacy updated_records mirror sync is field-scoped and canonical-derived',()=>{
  const base=canonical();
  base.dashboard_patch_extras.updated_records=[{id:'ENG-EVT-TEST1',title:'stale',summary:'legacy-only',source_ids:['ENG-SRC-TEST1']}];
  const next=patch();next.extensions.legacy_mirror_sync_v1={updated_records:[{target_id:'ENG-EVT-TEST1',fields:['title','summary']}]};
  const result=applyStrictPatchToCanonicalData(base,next),mirror=result.dashboard_patch_extras.updated_records[0];
  assert.equal(result.records.records[0].title,'old');
  assert.equal(mirror.title,'old');
  assert.equal(Object.hasOwn(mirror,'summary'),false);
  assert.deepEqual(mirror.source_ids,['ENG-SRC-TEST1']);
});

test('legacy mirror sync fails closed on missing, duplicate, protected and stale requests',()=>{
  const base=canonical();base.dashboard_patch_extras.updated_records=[{id:'ENG-EVT-TEST1',title:'stale'}];
  const missing=patch();missing.extensions.legacy_mirror_sync_v1={updated_records:[{target_id:'ENG-EVT-MISSING',fields:['title']}]};
  assert.throws(()=>applyStrictPatchToCanonicalData(base,missing),IntegrityError);
  const protectedField=patch();protectedField.extensions.legacy_mirror_sync_v1={updated_records:[{target_id:'ENG-EVT-TEST1',fields:['id']}]};
  assert.throws(()=>validateLegacyMirrorSyncV1(protectedField),IntegrityError);
  const duplicateField=patch();duplicateField.extensions.legacy_mirror_sync_v1={updated_records:[{target_id:'ENG-EVT-TEST1',fields:['title','title']}]};
  assert.throws(()=>validateLegacyMirrorSyncV1(duplicateField),IntegrityError);
  const duplicateTarget=patch();duplicateTarget.extensions.legacy_mirror_sync_v1={updated_records:[{target_id:'ENG-EVT-TEST1',fields:['title']},{target_id:'ENG-EVT-TEST1',fields:['tags']}]};
  assert.throws(()=>validateLegacyMirrorSyncV1(duplicateTarget),IntegrityError);
  const stale=patch();stale.extensions.legacy_mirror_sync_v1={updated_records:[{target_id:'ENG-EVT-TEST1',fields:['summary']}]};
  const noSummary=canonical();noSummary.dashboard_patch_extras.updated_records=[{id:'ENG-EVT-TEST1'}];
  assert.throws(()=>applyStrictPatchToCanonicalData(noSummary,stale),IntegrityError);
  const noMirror=patch();noMirror.extensions.legacy_mirror_sync_v1={updated_records:[{target_id:'ENG-EVT-TEST1',fields:['title']}]};
  assert.throws(()=>applyStrictPatchToCanonicalData(canonical(),noMirror),IntegrityError);
});

'''
          t=t.replace(insert_before,block+insert_before)
          schema_test="test('patch schema publishes the versioned correction operation contract',()=>{\n"
          assert t.count(schema_test)==1
          # Add separate schema-specific test immediately before existing schema test.
          schema_block=r'''test('patch schema publishes explicit legacy updated_records mirror sync contract',()=>{
  const schema=JSON.parse(readFileSync(`${root}/schemas/patch-v1.schema.json`,'utf8'));
  assert.equal(schema.properties.extensions.properties.legacy_mirror_sync_v1.$ref,'#/$defs/legacyMirrorSyncV1');
  assert.deepEqual(schema.$defs.legacyMirrorSyncV1.required,['updated_records']);
  assert.deepEqual(schema.$defs.legacyUpdatedRecordMirrorSyncRequest.required,['target_id','fields']);
  assert.equal(schema.$defs.legacyUpdatedRecordMirrorSyncRequest.properties.fields.uniqueItems,true);
});

'''
          t=t.replace(schema_test,schema_block+schema_test)
          tests.write_text(t)
          PY

      - name: Syntax, tests and chain validation
        run: |
          set -euo pipefail
          node --check docs/engineer-osint/lib/run-store.mjs
          node --test docs/engineer-osint/tests/*.test.mjs
          node docs/engineer-osint/validate-patch.mjs
          git diff --check

      - name: Enforce exact non-canonical diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -qx 'docs/engineer-osint/lib/run-store.mjs'
          printf '%s\n' "${changed[@]}" | grep -qx 'docs/engineer-osint/schemas/patch-v1.schema.json'
          printf '%s\n' "${changed[@]}" | grep -qx 'docs/engineer-osint/tests/p1-run-store.test.mjs'
          ! git diff --name-only | grep -E '^docs/engineer-osint/data/(run-store-manifest\.json|runs/)'

      - name: Commit only reviewed mechanism and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/engineer-osint/lib/run-store.mjs docs/engineer-osint/schemas/patch-v1.schema.json docs/engineer-osint/tests/p1-run-store.test.mjs
          git commit -m 'v4.5.35 add explicit fail-closed legacy updated_records mirror sync'
          git rm .github/workflows/v4535-explicit-legacy-mirror-sync-patch.yml
          git commit -m 'v4.5.35 remove temporary patch bootstrap workflow'
          git push origin HEAD:chatgpt/engineer-osint-v4535-explicit-legacy-mirror-sync
