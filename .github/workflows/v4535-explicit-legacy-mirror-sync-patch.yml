name: v4.5.35 explicit legacy mirror sync patch

on:
  push:
    branches:
      - chatgpt/engineer-osint-v4535-explicit-legacy-mirror-sync
    paths:
      - '.github/workflows/v4535-explicit-legacy-mirror-sync-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/engineer-osint-v4535-explicit-legacy-mirror-sync
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact v4.5.35 patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/v4535-patch.py
          python /tmp/v4535-patch.py
      - name: Syntax, tests and chain validation
        run: |
          set -euo pipefail
          node --check docs/engineer-osint/lib/run-store.mjs
          node --test docs/engineer-osint/tests/*.test.mjs
          node docs/engineer-osint/validate-patch.mjs
          git diff --check
      - name: Enforce exact non-canonical diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -qx 'docs/engineer-osint/lib/run-store.mjs'
          printf '%s\n' "${changed[@]}" | grep -qx 'docs/engineer-osint/schemas/patch-v1.schema.json'
          printf '%s\n' "${changed[@]}" | grep -qx 'docs/engineer-osint/tests/p1-run-store.test.mjs'
          ! git diff --name-only | grep -E '^docs/engineer-osint/data/(run-store-manifest\.json|runs/)'
      - name: Commit only reviewed mechanism and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/engineer-osint/lib/run-store.mjs docs/engineer-osint/schemas/patch-v1.schema.json docs/engineer-osint/tests/p1-run-store.test.mjs
          git commit -m 'v4.5.35 add explicit fail-closed legacy updated_records mirror sync'
          git rm .github/workflows/v4535-explicit-legacy-mirror-sync-patch.yml
          git commit -m 'v4.5.35 remove temporary patch bootstrap workflow'
          git push origin HEAD:chatgpt/engineer-osint-v4535-explicit-legacy-mirror-sync
