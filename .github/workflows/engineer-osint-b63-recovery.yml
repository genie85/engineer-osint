name: ENGINEER OSINT B63 deterministic recovery

on:
  push:
    branches:
      - factual/engineer-osint-20260823-B63-recovery

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preserve parent PUBLIC-CZ baseline
        run: cp docs/engineer-osint/public-cz-backlog-baseline.json /tmp/public-cz-parent-baseline.json
      - name: Deterministically append B63
        run: node docs/engineer-osint/append-run.mjs docs/engineer-osint/.recovery/engineer-osint-20260823-B63.json --write | tee /tmp/b63-append-plan.json
      - name: Syntax checks
        run: |
          set -euo pipefail
          for file in docs/engineer-osint/*.js docs/engineer-osint/*.mjs docs/engineer-osint/lib/*.mjs; do
            node --check "$file"
          done
      - name: Test P0/P1 integrity contract
        run: node --test docs/engineer-osint/tests/*.test.mjs
      - name: Validate canonical snapshot and append-only chain
        run: node docs/engineer-osint/validate-patch.mjs
      - name: Build cumulative dashboard
        run: node docs/engineer-osint/build-pages.mjs
      - name: Run runtime audit
        run: node docs/engineer-osint/validate-runtime.mjs
      - name: Run PUBLIC-CZ-UI audit
        run: node docs/engineer-osint/audit-public-cz-ui-latest.mjs
      - name: Gate PUBLIC-CZ regression ratchet
        env:
          PUBLIC_CZ_PARENT_BASELINE: /tmp/public-cz-parent-baseline.json
        run: node docs/engineer-osint/validate-public-cz-regression.mjs
      - name: Commit canonical recovery and remove staging transport
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/engineer-osint-b63-recovery.yml
          git rm docs/engineer-osint/.recovery/engineer-osint-20260823-B63.json
          git add docs/engineer-osint/data/run-store-manifest.json docs/engineer-osint/data/runs/engineer-osint-20260823-B63.json
          git commit -m "Recover B63 into P1 append-only run store"
          git push origin HEAD:factual/engineer-osint-20260823-B63-recovery
