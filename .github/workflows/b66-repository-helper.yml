name: B66 repository helper

on:
  push:
    branches:
      - factual/engineer-osint-20260824-B66
    paths:
      - '.github/workflows/b66-repository-helper.yml'
      - 'docs/engineer-osint/_staging/engineer-osint-20260824-B66.json'

permissions:
  contents: write

jobs:
  append-validate-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout run branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: factual/engineer-osint-20260824-B66

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify parent and append B66 with repository helper
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          node docs/engineer-osint/append-run.mjs docs/engineer-osint/_staging/engineer-osint-20260824-B66.json --write | tee /tmp/b66-append-plan.json
          grep -q '"run_id": "engineer-osint-20260824-B66"' /tmp/b66-append-plan.json

      - name: Validate syntax
        run: |
          set -euo pipefail
          for file in docs/engineer-osint/*.js docs/engineer-osint/*.mjs docs/engineer-osint/lib/*.mjs; do
            node --check "$file"
          done

      - name: Test P0/P1 integrity contract
        run: node --test docs/engineer-osint/tests/*.test.mjs

      - name: Validate canonical snapshot and append-only chain
        run: node docs/engineer-osint/validate-patch.mjs

      - name: Build canonical snapshot dashboard
        run: node docs/engineer-osint/build-pages.mjs

      - name: Materialize canonical media history
        run: node docs/engineer-osint/materialize-canonical-media-history.mjs

      - name: Audit media history
        run: node docs/engineer-osint/audit-media-history.mjs

      - name: Validate media coverage
        run: node docs/engineer-osint/validate-media-coverage.mjs

      - name: Audit cumulative runtime
        run: node docs/engineer-osint/validate-runtime.mjs

      - name: Audit PUBLIC-CZ runtime
        run: node docs/engineer-osint/audit-public-cz-ui-latest.mjs

      - name: Gate PUBLIC-CZ regression ratchet
        run: node docs/engineer-osint/validate-public-cz-regression.mjs

      - name: Remove staging mechanics and verify final diff
        run: |
          set -euo pipefail
          rm docs/engineer-osint/_staging/engineer-osint-20260824-B66.json
          rm .github/workflows/b66-repository-helper.yml
          git add -A
          git diff --cached --name-only | sort > /tmp/final-files.txt
          printf '%s\n' \
            'docs/engineer-osint/data/run-store-manifest.json' \
            'docs/engineer-osint/data/runs/engineer-osint-20260824-B66.json' | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/final-files.txt

      - name: Commit validated append
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Append ENGINEER OSINT B66 factual run'
          git push origin HEAD:factual/engineer-osint-20260824-B66
