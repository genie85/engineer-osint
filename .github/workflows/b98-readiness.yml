name: ENGINEER OSINT B98 readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/engineer-osint/**'
      - '.github/workflows/b98-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'docs/engineer-osint/**'
      - '.github/workflows/b98-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineer-osint-b98-readiness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical lifecycle state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect B98 lifecycle phase
        id: lifecycle
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('docs/engineer-osint/data/run-store-manifest.json','utf8'));
          const runs=manifest.runs||[];
          const run=runs.at(-1)?.run_id||manifest.snapshot.run_id;
          const b98Index=runs.findIndex(item=>item.run_id==='engineer-osint-20260830-B98');
          if(run==='engineer-osint-20260830-B97')console.log('phase=PRE_B98');
          else if(run==='engineer-osint-20260830-B98')console.log('phase=POST_B98');
          else if(b98Index>=0&&runs.length-1>b98Index)console.log('phase=POST_B98_STEADY');
          else throw new Error(`unsupported B98 lifecycle tip ${run}`);
          NODE

      - name: Test P0/P1 and B98 readiness contracts
        run: node --test docs/engineer-osint/tests/*.test.mjs

      - name: Validate current canonical chain
        run: node docs/engineer-osint/validate-patch.mjs

      - name: Build current canonical dashboard
        run: node docs/engineer-osint/build-pages.mjs

      - name: Re-audit persistent B97 before B98 simulation
        if: steps.lifecycle.outputs.phase == 'PRE_B98'
        run: node docs/engineer-osint/audit-persistent-b97.mjs

      - name: Build read-only B98 candidate and transition proof
        if: steps.lifecycle.outputs.phase == 'PRE_B98'
        run: |
          set -euo pipefail
          manifest='docs/engineer-osint/data/run-store-manifest.json'
          runs_dir='docs/engineer-osint/data/runs'
          manifest_before=$(sha256sum "$manifest" | awk '{print $1}')
          runs_before=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          node docs/engineer-osint/build-b98-readiness.mjs
          manifest_after=$(sha256sum "$manifest" | awk '{print $1}')
          runs_after=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          test "$manifest_before" = "$manifest_after"
          test "$runs_before" = "$runs_after"
          git diff --exit-code -- docs/engineer-osint/data

      - name: Dry-run exact generated B98 through standard append helper
        if: steps.lifecycle.outputs.phase == 'PRE_B98'
        run: |
          set -euo pipefail
          candidate='docs/engineer-osint-dist/b98-patch-candidate.json'
          plan='docs/engineer-osint-dist/b98-append-plan.json'
          manifest='docs/engineer-osint/data/run-store-manifest.json'
          runs_dir='docs/engineer-osint/data/runs'
          manifest_before=$(sha256sum "$manifest" | awk '{print $1}')
          runs_before=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          node docs/engineer-osint/append-run.mjs "$candidate" > "$plan"
          manifest_after=$(sha256sum "$manifest" | awk '{print $1}')
          runs_after=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          test "$manifest_before" = "$manifest_after"
          test "$runs_before" = "$runs_after"
          git diff --exit-code -- docs/engineer-osint/data
          node - <<'NODE'
          const fs=require('fs');
          const policy=JSON.parse(fs.readFileSync('docs/engineer-osint/V4524_B98_READINESS.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/b98-readiness-audit.json','utf8'));
          const plan=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/b98-append-plan.json','utf8'));
          if(audit.status!=='PASS')throw new Error('B98 readiness audit is not PASS');
          if(plan.status!=='VALIDATED_DRY_RUN')throw new Error(`B98 append helper did not remain dry-run: ${plan.status}`);
          if(plan.entry?.run_id!==policy.candidate_run_id||plan.entry?.parent_run_id!==policy.expected_parent_run_id)throw new Error('B98 dry-run identity mismatch');
          if(plan.entry?.file_sha256!==audit.candidate_file_sha256)throw new Error('B98 candidate file SHA mismatch');
          if(plan.entry?.parent_canonical_sha256!==policy.expected_parent_canonical_sha256)throw new Error('B98 parent canonical SHA mismatch');
          if(!/^[a-f0-9]{64}$/.test(plan.entry?.canonical_sha256||''))throw new Error('B98 resulting canonical SHA invalid');
          if(audit.evidence_count!==2||audit.assessment_count!==4)throw new Error('B98 native Intelligence scope mismatch');
          if(audit.runtime_guard_before_short_circuits!==0||audit.runtime_guard_after_short_circuits!==3)throw new Error('B98 runtime transition proof mismatch');
          if(audit.unguarded_residual_signature_count!==61||audit.unguarded_residual_factual_leaf_mutations!==81||audit.guarded_mutation_count!==0)throw new Error('B98 legacy transition residual proof mismatch');
          if(audit.canonical_write_performed!==false||audit.append_run_invoked!==false||audit.safe_to_append!==false||audit.safe_to_retire_overlays!==false)throw new Error('B98 readiness safety state broadened');
          console.log(`B98_DRY_RUN_CANDIDATE_SHA=${plan.entry.file_sha256}`);
          console.log(`B98_DRY_RUN_RESULT_SHA=${plan.entry.canonical_sha256}`);
          NODE

      - name: Audit persistent B98 lifecycle state
        if: steps.lifecycle.outputs.phase == 'POST_B98'
        run: node docs/engineer-osint/audit-persistent-b98.mjs

      - name: Verify persistent B98 readiness state
        if: steps.lifecycle.outputs.phase == 'POST_B98'
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const auth=JSON.parse(fs.readFileSync('docs/engineer-osint/V4526_B98_APPEND_AUTHORIZATION.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/persistent-b98-audit.json','utf8'));
          if(audit.status!=='PASS'||audit.mode!=='PERSISTENT_POST_APPEND')throw new Error('persistent B98 audit did not PASS');
          if(audit.persistent_tip!==auth.candidate_run_id||audit.candidate_file_sha256!==auth.exact_candidate_file_sha256||audit.resulting_canonical_sha256!==auth.expected_resulting_canonical_sha256)throw new Error('persistent B98 exact hash contract mismatch');
          if(audit.persistent_gap_count!==15||audit.native_evidence_count!==2||audit.native_assessment_count!==4)throw new Error('persistent B98 native Intelligence scope mismatch');
          if(audit.residual_signature_count!==61||audit.residual_factual_leaf_mutations!==81||audit.unexpected_residual_modules?.length!==0)throw new Error('persistent B98 residual baseline drift');
          if(audit.guard_short_circuit_count!==3||audit.guarded_factual_mutation_count!==0)throw new Error('persistent B98 runtime guard transition failed');
          if(audit.multimedia_status!=='MISSING_WAIVED_PINNED_INTELLIGENCE_ASSESSMENT_MIGRATION_NO_MEDIA_ADDITION')throw new Error('persistent B98 media gate failed');
          if(audit.overlays_must_remain_active!==true||audit.overlay_retirement_authorized!==false||audit.identity_fix_migration_authorized!==false||audit.post_b98_pages_validation_ready!==true||audit.canonical_write_performed!==false)throw new Error('persistent B98 safety boundary broadened');
          console.log('B98_LIFECYCLE=POST_B98_PERSISTENT_PASS');
          NODE

      - name: Audit post-B98 steady state and first-three semantic parity
        if: steps.lifecycle.outputs.phase == 'POST_B98' || steps.lifecycle.outputs.phase == 'POST_B98_STEADY'
        run: node docs/engineer-osint/audit-post-b98-steady-state.mjs

      - name: Verify post-B98 steady-state review gate
        if: steps.lifecycle.outputs.phase == 'POST_B98' || steps.lifecycle.outputs.phase == 'POST_B98_STEADY'
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('docs/engineer-osint/data/run-store-manifest.json','utf8'));
          const current=manifest.runs.at(-1)?.run_id||manifest.snapshot.run_id;
          const audit=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/post-b98-steady-state-audit.json','utf8'));
          if(audit.status!=='PASS'||audit.schema_version!=='engineer-osint-post-b98-steady-state-v2'||audit.current_run_id!==current)throw new Error('post-B98 steady-state audit identity mismatch');
          if(audit.historical_b98?.status!=='PASS'||audit.historical_b98?.file_sha256!=='ac2ae06bf3e3914b857cd0fddf2aa895aa9dd11f9289c379eba2b6cc9a038a79'||audit.historical_b98?.canonical_sha256!=='4ebc674ce036e3aa8cc77b52ae22f893b38ce345fe37ee0a8700585b34b30201')throw new Error('historical B98 anchor drift');
          if(audit.guard_short_circuit_count!==3||audit.guarded_first_three_factual_mutation_count!==0)throw new Error('post-B98 first-three runtime guard failure');
          if(audit.pre_localization_semantic_diff_count!==0||audit.post_localization_semantic_diff_count!==0||audit.public_data_semantic_parity!==true)throw new Error('post-B98 first-three semantic parity failed');
          if(audit.first_three_ready_for_retirement_review!==true||audit.review_gate_status!=='HISTORICAL_FIRST_THREE_RETIREMENT_VALIDATED'||audit.retirement_current_state_validated!==true)throw new Error('post-B98 historical retirement proof invalid');
          if(audit.retirement_authorized!==false||audit.runtime_module_removal_performed!==false||audit.identity_fix_in_scope!==false||audit.full_browser_retirement_regression_required!==true||audit.canonical_write_performed!==false)throw new Error('post-B98 historical safety boundary broadened');
          const identityActive=audit.identity_fix_runtime_active===true&&audit.identity_fix_runtime_retired===false;
          const identityRetired=audit.identity_fix_runtime_active===false&&audit.identity_fix_runtime_retired===true;
          if(!identityActive&&!identityRetired)throw new Error('post-B98 identity lifecycle is partial or inconsistent');
          if(identityActive){
            if(audit.mode!=='POST_RETIREMENT_COMPATIBILITY_IDENTITY_ACTIVE'||audit.runtime_state!=='RETIRED_FIRST_THREE_IDENTITY_ACTIVE'||audit.identity_fix_migration_authorized!==false)throw new Error('post-B98 active identity lifecycle mismatch');
          }else{
            if(audit.mode!=='POST_RETIREMENT_COMPATIBILITY_IDENTITY_RETIRED_AUTHORIZED'||audit.runtime_state!=='ALL_FACTUAL_LEGACY_OVERLAYS_RETIRED'||audit.identity_fix_migration_authorized!==true)throw new Error('post-B98 retired identity lifecycle mismatch');
            if(audit.b99_pages_gate_applicable!==true||audit.b99_pages_gate_passed!==true||audit.b99_identity_fix_runtime_active!==false||audit.b99_identity_fix_runtime_retired!==true||audit.b99_identity_overlay_retirement_authorized!==true)throw new Error('post-B98 retired B99 identity gate mismatch');
          }
          console.log(`POST_B98_STEADY_STATE=PASS run=${current} identity=${identityActive?'active':'retired-authorized'}`);
          NODE

      - name: Upload pre-B98 readiness evidence
        if: steps.lifecycle.outputs.phase == 'PRE_B98'
        uses: actions/upload-artifact@v4
        with:
          name: b98-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/engineer-osint-dist/b98-patch-candidate.json
            docs/engineer-osint-dist/b98-readiness-audit.json
            docs/engineer-osint-dist/b98-readiness-audit.md
            docs/engineer-osint-dist/b98-append-plan.json
            docs/engineer-osint-dist/health.txt

      - name: Upload persistent B98 readiness evidence
        if: steps.lifecycle.outputs.phase == 'POST_B98'
        uses: actions/upload-artifact@v4
        with:
          name: b98-persistent-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/engineer-osint-dist/persistent-b98-audit.json
            docs/engineer-osint-dist/persistent-b98-audit.md
            docs/engineer-osint-dist/post-b98-steady-state-audit.json
            docs/engineer-osint-dist/post-b98-steady-state-audit.md
            docs/engineer-osint-dist/health.txt

      - name: Upload post-B98 descendant steady-state evidence
        if: steps.lifecycle.outputs.phase == 'POST_B98_STEADY'
        uses: actions/upload-artifact@v4
        with:
          name: post-b98-steady-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/engineer-osint-dist/post-b98-steady-state-audit.json
            docs/engineer-osint-dist/post-b98-steady-state-audit.md
            docs/engineer-osint-dist/health.txt
