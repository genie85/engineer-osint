name: ENGINEER OSINT first-three overlay retirement regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/engineer-osint/**'
      - '.github/workflows/first-three-overlay-retirement-regression.yml'
  push:
    branches: [main]
    paths:
      - 'docs/engineer-osint/**'
      - '.github/workflows/first-three-overlay-retirement-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineer-osint-first-three-retirement-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retirement-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout retirement state
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Test complete P0/P1 contract
        env:
          B106_CI_NOTES_COMMIT: ${{ vars.B106_CI_NOTES_COMMIT }}
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          [[ "$B106_CI_NOTES_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$B106_CI_NOTES_COMMIT" != 0000000000000000000000000000000000000000 ]]
          unset NODE_OPTIONS
          for inherited_git_var in ${!GIT_@}; do unset "$inherited_git_var"; done
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_TERMINAL_PROMPT=0 GIT_NO_REPLACE_OBJECTS=1
          runner_temp="$(realpath -- "$RUNNER_TEMP")"
          checkout_root="$(pwd -P)"
          case "$runner_temp/" in "$checkout_root/"*) exit 1 ;; esac
          case "$checkout_root/" in "$runner_temp/"*) exit 1 ;; esac
          node -e 'const fs=require("node:fs");const s=fs.statfsSync(process.env.RUNNER_TEMP,{bigint:true});if(s.bavail*s.bsize<13000000000n)throw Error("13GB disk gate");'
          timeout 30s git fetch --no-tags --depth=1 origin refs/notes/b106-ci-fixture:refs/notes/b106-ci-fixture
          [[ "$(git rev-parse --verify refs/notes/b106-ci-fixture)" == "$B106_CI_NOTES_COMMIT" ]]
          source_commit=1df9875a50d5ad47188d0ba4a262ea11e3e65693
          timeout 30s git fetch --no-tags --depth=1 origin "$source_commit"
          pr1_commit=58171850e92da3cc61a94a85f615eadbf6d9419c
          pr1_tree=1baffdf744fe0bf07f7db0ac859013c253190ef8
          timeout 30s git fetch --no-tags --depth=1 origin "$pr1_commit"
          [[ "$(git rev-parse "$pr1_commit^{tree}")" == "$pr1_tree" ]] || exit 1
          git ls-tree -rz "$pr1_tree" >/dev/null
          source_dir="$(mktemp -d "$runner_temp/b106-source.XXXXXX")"
          timeout 30s git -c core.hooksPath=/dev/null worktree add --detach "$source_dir" "$source_commit"
          export B106_EXTERNAL_SOURCE_FIXTURE_DIR="$source_dir/"
          fixture_receipt="$(node docs/engineer-osint/ci/prepare-b106-fixture.mjs)"
          fixture_path="$(printf '%s' "$fixture_receipt" | node -e 'let s="";process.stdin.on("data",b=>s+=b);process.stdin.on("end",()=>{const a=JSON.parse(s);if(typeof a.fixturePath!=="string"||/[\r\n]/.test(a.fixturePath)||a.execution_allowed!==false)throw Error("invalid fixture receipt");process.stdout.write(a.fixturePath);});')"
          export B106_EXTERNAL_INVENTORY_FIXTURE="$fixture_path"
          node --import ./docs/engineer-osint/ci/b106-root-preload.mjs --test docs/engineer-osint/tests/*.test.mjs

      - name: Validate append-only canonical chain
        run: node docs/engineer-osint/validate-patch.mjs

      - name: Build retired runtime artifact
        run: node docs/engineer-osint/build-pages.mjs

      - name: Materialize canonical media from snapshot and append-only runs
        run: node docs/engineer-osint/materialize-canonical-media-history.mjs

      - name: Inject source-derived media materialization
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='docs/engineer-osint-dist/index.html';
          const js=fs.readFileSync('docs/engineer-osint/media-source-materialization.js','utf8');
          if(/<\/script/i.test(js)) throw new Error('unsafe literal </script in media source module');
          let h=fs.readFileSync(p,'utf8');
          const anchor='<script id="engineer-ui-phase7-media-module">';
          if(!h.includes('engineer-media-source-materialization')){
            const script=`<script id="engineer-media-source-materialization">${js}</script>`;
            h=h.includes(anchor)?h.replace(anchor,script+anchor):h.replace('</body>',script+'</body>');
          }
          fs.writeFileSync(p,h);
          NODE

      - name: Audit canonical multimedia records
        run: node docs/engineer-osint/audit-media-history.mjs

      - name: Gate current-run media sweep and audit persistence backlog
        run: node docs/engineer-osint/validate-media-coverage.mjs

      - name: Diagnose v4.5.29 versus v4.5.30 digest paths
        run: node docs/engineer-osint/diagnose-v4530-retirement-digest.mjs

      - name: Audit retired runtime and historical semantic parity
        run: node docs/engineer-osint/audit-post-b98-steady-state.mjs

      - name: Audit runtime after all factual overlay retirements
        run: node docs/engineer-osint/validate-runtime.mjs

      - name: Audit PUBLIC-CZ after all factual overlay retirements
        run: node docs/engineer-osint/audit-public-cz-ui-latest.mjs

      - name: Gate PUBLIC-CZ regression ratchet
        run: node docs/engineer-osint/validate-public-cz-regression.mjs

      - name: Headless browser retirement regression
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          echo "Using browser: $browser"
          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --allow-file-access-from-files \
            --virtual-time-budget=4000 \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/docs/engineer-osint-dist/index.html" \
            > /tmp/engineer-osint-retired-dom.html
          test -s /tmp/engineer-osint-retired-dom.html
          grep -qi '<html' /tmp/engineer-osint-retired-dom.html
          grep -q 'ENGINEER OSINT' /tmp/engineer-osint-retired-dom.html
          ! grep -q 'engineer-data-integrity-identity-fixes-module' /tmp/engineer-osint-retired-dom.html
          grep -q 'engineer-overlay-transition-runtime-guard-module' /tmp/engineer-osint-retired-dom.html
          ! grep -q 'engineer-rich-backfill-module' /tmp/engineer-osint-retired-dom.html
          ! grep -q 'engineer-rich-backfill-israel-turkiye-eod-module' /tmp/engineer-osint-retired-dom.html
          ! grep -q 'engineer-rich-backfill-usa-rok-module' /tmp/engineer-osint-retired-dom.html
          echo 'HEADLESS_BROWSER_FIRST_THREE_RETIREMENT=PASS_IDENTITY_ALSO_RETIRED'

      - name: Verify retirement audit evidence
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const audit=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/first-three-overlay-retirement-audit.json','utf8'));
          if(audit.status!=='PASS'||audit.schema_version!=='engineer-osint-first-three-overlay-retirement-audit-v2')throw new Error('retirement audit did not PASS');
          if(audit.retired_runtime_module_count!==3||audit.active_legacy_factual_module_count!==0||audit.identity_fix_active!==false||audit.identity_fix_retired!==true||audit.identity_fix_in_scope!==false)throw new Error('retirement runtime scope mismatch');
          if(audit.transition_guarded_file_count!==0||audit.transition_guard_runtime_retained!==true)throw new Error('transition guard retirement state mismatch');
          if(audit.retired_runtime_scripts_absent!==true||audit.identity_fix_runtime_script_present!==false||audit.identity_fix_runtime_script_absent!==true)throw new Error('built retirement script contract failed');
          if(audit.current_run_id==='engineer-osint-20260830-B98'&&(audit.pre_retirement_digest_applicable!==true||audit.public_data_semantic_parity!==true||audit.retired_public_data_sha256!=='3633ba18cc69e06bdc72ca574157d901da5b43644993b4c8760e6302b728460f'))throw new Error('exact B98 public-data retirement digest mismatch');
          if(audit.canonical_write_performed!==false||audit.run_store_manifest_edit_performed!==false||audit.identity_fix_migration_authorized!==true)throw new Error('later identity retirement authorization was not preserved exactly');
          console.log('FIRST_THREE_RETIREMENT_REGRESSION=PASS_IDENTITY_RETIRED_AUTHORIZED');
          NODE

      - name: Upload retirement regression evidence
        uses: actions/upload-artifact@v7
        with:
          name: first-three-retirement-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/engineer-osint-dist/first-three-overlay-retirement-audit.json
            docs/engineer-osint-dist/first-three-overlay-retirement-audit.md
            docs/engineer-osint-dist/post-b98-steady-state-audit.json
            docs/engineer-osint-dist/public-cz-ui-audit.json
            docs/engineer-osint-dist/runtime-audit.json
            docs/engineer-osint-dist/health.txt
            /tmp/engineer-osint-retired-dom.html
