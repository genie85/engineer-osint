name: ENGINEER OSINT B106 compatibility target materializer

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/engineer-osint/tools/v4694-b106-compat-target-materializer.mjs'
      - '.github/workflows/b106-compat-target-materializer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-targets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact diagnostic state
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Materialize exact unreachable Git blobs and candidate tree
        env:
          V4694_GIT_OBJECT_MATERIALIZE: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node docs/engineer-osint/tools/v4694-b106-compat-target-materializer.mjs
      - name: Upload exact target and read-back evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: v4694-b106-compat-targets-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          path: /tmp/v4694-b106-compat-targets
