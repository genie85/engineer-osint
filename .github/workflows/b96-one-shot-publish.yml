name: ENGINEER OSINT one-shot B96 publication branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b96-one-shot-publish.yml'

permissions:
  contents: write

concurrency:
  group: engineer-osint-b96-one-shot-publication
  cancel-in-progress: false

env:
  B95_RUN: engineer-osint-20260826-B95
  B96_RUN: engineer-osint-20260829-B96
  B96_RESULT_BRANCH: automation/b96-append-result
  B96_CANDIDATE_SHA256: 3d3992f63b84e3b797e91bf4b407e97046f7e0ca2bbb5f1f29f3f5c0426a13f1
  B96_RESULT_SHA256: 4a2dd9dd1756fd15316741ce2488cb69ad17db3986830e7d20eea9b79693dcd5

jobs:
  generate-b96-publication-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout green main readiness state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fail closed unless exact reviewed B95-to-B96 publication is still pending
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('docs/engineer-osint/data/run-store-manifest.json','utf8'));
          const authorization=JSON.parse(fs.readFileSync('docs/engineer-osint/V4511_B96_APPEND_AUTHORIZATION.json','utf8'));
          const current=manifest.runs.at(-1)?.run_id||manifest.snapshot.run_id;
          if(current!==process.env.B95_RUN)throw new Error(`one-shot B96 publication requires ${process.env.B95_RUN}, got ${current}`);
          if(fs.existsSync(`docs/engineer-osint/data/runs/${process.env.B96_RUN}.json`))throw new Error('B96 run file already exists');
          if(authorization.status!=='READY_FOR_APPEND')throw new Error(`B96 authorization is ${authorization.status}`);
          if(authorization.required_preconditions?.post_b96_ci_pipeline_ready!==true)throw new Error('post-B96 CI pipeline is not authorized');
          if(authorization.candidate_run_id!==process.env.B96_RUN||authorization.expected_parent_run_id!==process.env.B95_RUN)throw new Error('B96 authorization identity drift');
          if(authorization.exact_candidate_file_sha256!==process.env.B96_CANDIDATE_SHA256)throw new Error('authorized B96 candidate SHA drift');
          if(authorization.expected_resulting_canonical_sha256!==process.env.B96_RESULT_SHA256)throw new Error('authorized B96 result SHA drift');
          if(authorization.authorization?.append_exact_candidate_only!==true||authorization.authorization?.standard_append_run_write_required!==true||authorization.authorization?.one_run_only!==true)throw new Error('B96 authorization is incomplete');
          if(authorization.authorization?.allow_manual_manifest_or_hash_edit!==false||authorization.authorization?.allow_overlay_retirement!==false||authorization.authorization?.allow_b97_or_b98_same_slice!==false||authorization.authorization?.allow_identity_fix_migration!==false)throw new Error('B96 authorization scope is unsafe');
          NODE
          if git ls-remote --exit-code --heads origin "refs/heads/${B96_RESULT_BRANCH}" >/dev/null 2>&1; then
            echo "::error::Result branch ${B96_RESULT_BRANCH} already exists; refusing a second publication attempt"
            exit 1
          fi

      - name: Re-run P0/P1 and canonical integrity before candidate generation
        run: |
          set -euo pipefail
          for file in docs/engineer-osint/*.js docs/engineer-osint/*.mjs docs/engineer-osint/lib/*.mjs; do
            node --check "$file"
          done
          node --test docs/engineer-osint/tests/*.test.mjs
          node docs/engineer-osint/validate-patch.mjs

      - name: Rebuild exact reviewed B96 candidate from current B95
        run: |
          set -euo pipefail
          node docs/engineer-osint/build-pages.mjs
          node docs/engineer-osint/materialize-canonical-media-history.mjs
          node - <<'NODE'
          const fs=require('fs');
          const p='docs/engineer-osint-dist/index.html';
          const js=fs.readFileSync('docs/engineer-osint/media-source-materialization.js','utf8');
          if(/<\/script/i.test(js))throw new Error('unsafe literal </script in media source module');
          let h=fs.readFileSync(p,'utf8');
          const anchor='<script id="engineer-ui-phase7-media-module">';
          if(!h.includes('engineer-media-source-materialization')){
            const script=`<script id="engineer-media-source-materialization">${js}</script>`;
            h=h.includes(anchor)?h.replace(anchor,script+anchor):h.replace('</body>',script+'</body>');
          }
          fs.writeFileSync(p,h);
          NODE
          node docs/engineer-osint/audit-media-history.mjs
          node docs/engineer-osint/validate-media-coverage.mjs
          node docs/engineer-osint/validate-runtime.mjs
          node docs/engineer-osint/audit-overlay-retirement.mjs
          node docs/engineer-osint/audit-overlay-migration-dry-run.mjs
          node docs/engineer-osint/audit-overlay-provenance.mjs
          node docs/engineer-osint/audit-overlay-production-preview.mjs
          node docs/engineer-osint/build-overlay-stage-a-candidate.mjs

      - name: Dry-run standard append helper and pin exact hashes
        run: |
          set -euo pipefail
          candidate='docs/engineer-osint-dist/overlay-stage-a-patch-candidate.json'
          plan='docs/engineer-osint-dist/overlay-stage-a-append-plan.json'
          manifest='docs/engineer-osint/data/run-store-manifest.json'
          manifest_before=$(sha256sum "$manifest" | awk '{print $1}')
          runs_before=$(find docs/engineer-osint/data/runs -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          node docs/engineer-osint/append-run.mjs "$candidate" > "$plan"
          manifest_after=$(sha256sum "$manifest" | awk '{print $1}')
          runs_after=$(find docs/engineer-osint/data/runs -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          test "$manifest_before" = "$manifest_after"
          test "$runs_before" = "$runs_after"
          git diff --exit-code -- docs/engineer-osint/data
          node - <<'NODE'
          const fs=require('fs');
          const authorization=JSON.parse(fs.readFileSync('docs/engineer-osint/V4511_B96_APPEND_AUTHORIZATION.json','utf8'));
          const meta=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/overlay-stage-a-patch-candidate-meta.json','utf8'));
          const plan=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/overlay-stage-a-append-plan.json','utf8'));
          if(plan.status!=='VALIDATED_DRY_RUN')throw new Error('append helper did not remain dry-run');
          if(plan.entry?.run_id!==process.env.B96_RUN||plan.entry?.parent_run_id!==process.env.B95_RUN)throw new Error('B96 dry-run identity mismatch');
          if(meta.operation_count!==104||meta.source_append_count!==15)throw new Error('B96 candidate count drift');
          if(meta.candidate_file_sha256!==process.env.B96_CANDIDATE_SHA256||plan.entry.file_sha256!==process.env.B96_CANDIDATE_SHA256)throw new Error('B96 candidate file SHA drift');
          if(plan.entry.canonical_sha256!==process.env.B96_RESULT_SHA256)throw new Error('B96 resulting canonical SHA drift');
          if(plan.entry.parent_canonical_sha256!==authorization.expected_parent_canonical_sha256)throw new Error('B96 parent canonical SHA drift');
          NODE

      - name: Re-run reviewed transition debt and simulated post-B96 gates
        run: |
          set -euo pipefail
          node docs/engineer-osint/audit-overlay-stage-a-impact.mjs
          node docs/engineer-osint/verify-stage-bc-pages-gate.mjs
          node docs/engineer-osint/audit-overlay-compat-transition.mjs
          node docs/engineer-osint/audit-persistent-b96.mjs --simulate-from-candidate

      - name: Execute guarded standard B96 append locally
        run: |
          set -euo pipefail
          candidate='docs/engineer-osint-dist/overlay-stage-a-patch-candidate.json'
          node docs/engineer-osint/append-run.mjs "$candidate" --write > /tmp/b96-append-write-plan.json
          node - <<'NODE'
          const fs=require('fs');
          const plan=JSON.parse(fs.readFileSync('/tmp/b96-append-write-plan.json','utf8'));
          if(plan.status!=='APPENDED')throw new Error(`expected APPENDED, got ${plan.status}`);
          if(plan.entry?.run_id!==process.env.B96_RUN||plan.entry?.parent_run_id!==process.env.B95_RUN)throw new Error('written B96 identity mismatch');
          if(plan.entry?.file_sha256!==process.env.B96_CANDIDATE_SHA256)throw new Error('written B96 file SHA drift');
          if(plan.entry?.canonical_sha256!==process.env.B96_RESULT_SHA256)throw new Error('written B96 canonical SHA drift');
          NODE

      - name: Verify persistent B96 locally before any push
        run: |
          set -euo pipefail
          node docs/engineer-osint/validate-patch.mjs
          node docs/engineer-osint/audit-persistent-b96.mjs
          node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('docs/engineer-osint/data/run-store-manifest.json','utf8'));
          const current=manifest.runs.at(-1);
          if(current?.run_id!==process.env.B96_RUN)throw new Error('manifest tip is not B96 after append');
          if(current?.file_sha256!==process.env.B96_CANDIDATE_SHA256||current?.canonical_sha256!==process.env.B96_RESULT_SHA256)throw new Error('persistent B96 manifest hashes drifted');
          if(fs.existsSync('docs/engineer-osint/data/runs/engineer-osint-20260830-B97.json'))throw new Error('B97 leaked into B96 slice');
          if(fs.existsSync('docs/engineer-osint/data/runs/engineer-osint-20260830-B98.json'))throw new Error('B98 leaked into B96 slice');
          NODE

      - name: Enforce exact two-file publication diff
        run: |
          set -euo pipefail
          rm -rf docs/engineer-osint-dist
          git status --porcelain --untracked-files=all
          git status --porcelain --untracked-files=all | cut -c4- | sort > /tmp/b96-actual-paths.txt
          printf '%s\n' \
            'docs/engineer-osint/data/run-store-manifest.json' \
            'docs/engineer-osint/data/runs/engineer-osint-20260829-B96.json' | sort > /tmp/b96-expected-paths.txt
          diff -u /tmp/b96-expected-paths.txt /tmp/b96-actual-paths.txt
          test "$(wc -l < /tmp/b96-actual-paths.txt | tr -d ' ')" = '2'

      - name: Push append-generated result to isolated review branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$B96_RESULT_BRANCH"
          git add \
            docs/engineer-osint/data/run-store-manifest.json \
            docs/engineer-osint/data/runs/engineer-osint-20260829-B96.json
          git diff --cached --name-only | sort > /tmp/b96-staged-paths.txt
          diff -u /tmp/b96-expected-paths.txt /tmp/b96-staged-paths.txt
          git commit -m 'Append reviewed B96 Stage A migration'
          git push --set-upstream origin "$B96_RESULT_BRANCH"
