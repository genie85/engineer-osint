name: ENGINEER OSINT identity-fix B99 mirror-sync candidate readiness

on:
  push:
    branches:
      - chatgpt/engineer-osint-v4536-b99-mirror-sync-candidate
  pull_request:
    branches: [main]
    paths:
      - 'docs/engineer-osint/**'
      - '.github/workflows/identity-fix-b99-mirror-sync-candidate-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical lifecycle state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test complete P0/P1 contract
        run: node --test docs/engineer-osint/tests/*.test.mjs
      - name: Validate persistent canonical chain
        run: node docs/engineer-osint/validate-patch.mjs
      - name: Build current canonical dashboard
        run: node docs/engineer-osint/build-pages.mjs
      - name: Materialize canonical media
        run: node docs/engineer-osint/materialize-canonical-media-history.mjs
      - name: Detect B99 lifecycle phase
        id: lifecycle
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('docs/engineer-osint/data/run-store-manifest.json','utf8'));
          const runs=m.runs||[],b98='engineer-osint-20260830-B98',b99='engineer-osint-20260830-B99';
          const current=runs.at(-1)?.run_id||m.snapshot?.run_id,i=runs.findIndex(x=>x.run_id===b99);
          if(current===b98&&i<0)console.log('phase=PRE_B99');
          else if(current===b99&&i===runs.length-1)console.log('phase=POST_B99');
          else if(i>=0&&runs.length-1>i)console.log('phase=POST_B99_STEADY');
          else throw new Error(`unexpected B99 lifecycle tip ${current}`);
          NODE
      - name: Build exact derived B99 mirror-sync candidate
        if: steps.lifecycle.outputs.phase == 'PRE_B99'
        run: node docs/engineer-osint/build-identity-fix-b99-mirror-sync-candidate.mjs
      - name: Validate synced candidate through standard append helper dry-run
        if: steps.lifecycle.outputs.phase == 'PRE_B99'
        run: |
          set -euo pipefail
          candidate='docs/engineer-osint-dist/identity-fix-b99-mirror-sync-candidate.json'
          plan='docs/engineer-osint-dist/identity-fix-b99-mirror-sync-append-plan.json'
          manifest='docs/engineer-osint/data/run-store-manifest.json'
          runs_dir='docs/engineer-osint/data/runs'
          manifest_before=$(sha256sum "$manifest" | awk '{print $1}')
          runs_before=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          node docs/engineer-osint/append-run.mjs "$candidate" > "$plan"
          manifest_after=$(sha256sum "$manifest" | awk '{print $1}')
          runs_after=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          test "$manifest_before" = "$manifest_after"
          test "$runs_before" = "$runs_after"
          git diff --exit-code -- docs/engineer-osint/data
          node - <<'NODE'
          const fs=require('fs');
          const policy=JSON.parse(fs.readFileSync('docs/engineer-osint/V4536_B99_MIRROR_SYNC_CANDIDATE_READINESS.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/identity-fix-b99-mirror-sync-candidate-audit.json','utf8'));
          const plan=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/identity-fix-b99-mirror-sync-append-plan.json','utf8'));
          if(audit.status!=='PASS'||audit.operation_count!==36||audit.replace_field_count!==27||audit.remove_field_count!==9)throw new Error('B99 mirror-sync operation scope mismatch');
          if(audit.legacy_mirror_sync_request_count!==1||audit.legacy_mirror_sync_target_id!=='ENG-TECH-0036'||audit.legacy_mirror_sync_fields?.length!==18)throw new Error('B99 mirror-sync request scope mismatch');
          if(JSON.stringify(audit.legacy_mirror_sync_fields)!==JSON.stringify(policy.sync_fields))throw new Error('B99 mirror-sync field list drift');
          if(audit.overlay_mutations_before!==70||audit.overlay_mutations_after!==0||audit.canonical_overlay_mutations_after!==0||audit.legacy_mirror_mutations_after!==0)throw new Error('B99 mirror-sync did not eliminate exact identity overlay residual');
          if(plan.status!=='VALIDATED_DRY_RUN')throw new Error(`append helper escaped dry-run: ${plan.status}`);
          if(plan.entry?.run_id!==policy.candidate_run_id||plan.entry?.parent_run_id!==policy.expected_parent_run_id)throw new Error('B99 mirror-sync append identity mismatch');
          if(plan.entry?.file_sha256!==audit.candidate_file_sha256||plan.entry?.canonical_sha256!==audit.resulting_canonical_sha256)throw new Error('B99 mirror-sync append hash mismatch');
          if(policy.exact_candidate_file_sha256!==audit.candidate_file_sha256||policy.expected_resulting_canonical_sha256!==audit.resulting_canonical_sha256)throw new Error('pinned synced B99 hash drift');
          if(audit.canonical_write_performed!==false||audit.append_run_write_invoked!==false||audit.identity_fix_runtime_removal_authorized!==false||audit.safe_to_append!==false||audit.safe_to_retire_identity_fix_overlay!==false)throw new Error('B99 mirror-sync safety boundary broadened');
          NODE
      - name: Audit persistent exact B99 instead of rebuilding candidate
        if: steps.lifecycle.outputs.phase == 'POST_B99' || steps.lifecycle.outputs.phase == 'POST_B99_STEADY'
        run: node docs/engineer-osint/audit-persistent-b99-identity.mjs
      - name: Verify POST_B99 exact synced state
        if: steps.lifecycle.outputs.phase == 'POST_B99' || steps.lifecycle.outputs.phase == 'POST_B99_STEADY'
        run: |
          git diff --exit-code -- docs/engineer-osint/data
          node - <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/persistent-b99-identity-audit.json','utf8'));
          if(a.status!=='PASS'||a.operation_count!==36||a.replace_field_count!==27||a.remove_field_count!==9)throw new Error('persistent B99 operation scope mismatch');
          if(a.mirror_sync_request_count!==1||a.mirror_sync_target_id!=='ENG-TECH-0036'||a.mirror_sync_field_count!==18||a.identity_overlay_residual_mutations!==0)throw new Error('persistent B99 mirror/residual mismatch');
          if(a.b99_append_authorized!==false||a.canonical_write_performed!==false)throw new Error('persistent B99 append/canonical safety boundary broadened');
          const active=a.identity_fix_runtime_active===true&&a.identity_fix_runtime_retired===false;
          const retired=a.identity_fix_runtime_active===false&&a.identity_fix_runtime_retired===true;
          if(!active&&!retired)throw new Error('persistent B99 identity lifecycle mismatch');
          if(active&&(a.identity_fix_runtime_removal_authorized!==false||a.identity_overlay_retirement_authorized!==false||a.identity_retirement_validated!==false))throw new Error('active persistent B99 safety boundary broadened');
          if(retired&&(a.identity_fix_runtime_removal_authorized!==true||a.identity_overlay_retirement_authorized!==true||a.identity_retirement_validated!==true||a.identity_fix_source_retained!==true||a.transition_guard_runtime_active!==true))throw new Error('retired persistent B99 lifecycle not authorized/validated');
          NODE
      - name: Upload synced B99 review evidence
        uses: actions/upload-artifact@v4
        with:
          name: identity-fix-b99-mirror-sync-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            docs/engineer-osint-dist/identity-fix-b99-mirror-sync-candidate.json
            docs/engineer-osint-dist/identity-fix-b99-mirror-sync-candidate-audit.json
            docs/engineer-osint-dist/identity-fix-b99-mirror-sync-append-plan.json
            docs/engineer-osint-dist/persistent-b99-identity-audit.json
            docs/engineer-osint-dist/persistent-b99-identity-audit.md
