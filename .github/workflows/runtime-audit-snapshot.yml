name: ENGINEER OSINT runtime audit snapshot

# One-shot mapping extraction for ENG-UNIT-0011 / ENG-UNIT-0014
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runtime-audit-snapshot.yml'
      - 'docs/engineer-osint/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check docs/engineer-osint/build-pages.mjs
          node --check docs/engineer-osint/postprocess-ui.mjs
          node --check docs/engineer-osint/validate-runtime.mjs
      - name: Build cumulative dashboard
        run: node docs/engineer-osint/build-pages.mjs
      - name: Extract mapping evidence
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('docs/engineer-osint-dist/index.html','utf8');
          const marker='window.__ENGINEER_DATA__=';
          const a=html.indexOf(marker), b=html.indexOf(';</script>',a);
          const d=JSON.parse(html.slice(a+marker.length,b));
          const ids=new Set(['ENG-UNIT-0011','ENG-UNIT-0014']);
          const recs=(d.records?.records||[]).filter(r=>ids.has(r.id));
          const sourceIds=new Set(recs.flatMap(r=>r.source_ids||[]));
          const sources=(d.sources?.sources||[]).filter(s=>sourceIds.has(s.id));
          const relations=(d.relations?.relations||[]).filter(r=>ids.has(r.subject_id)||ids.has(r.object_id));
          const evidence=(d.evidence?.evidence||[]).filter(e=>(e.related_ids||[]).some(id=>ids.has(id)));
          const neighbors=(d.records?.records||[]).filter(r=>['ENG-UNIT-0010','ENG-UNIT-0012','ENG-UNIT-0013','ENG-UNIT-0015'].includes(r.id));
          fs.writeFileSync('docs/engineer-osint-dist/mapping-evidence.json',JSON.stringify({records:recs,sources,relations,evidence,neighbors},null,2));
          NODE
      - name: Run runtime audit
        run: node docs/engineer-osint/validate-runtime.mjs
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineer-osint-mapping-evidence
          if-no-files-found: warn
          path: |
            docs/engineer-osint-dist/mapping-evidence.json
            docs/engineer-osint-dist/runtime-audit.json
            docs/engineer-osint-dist/health.txt
