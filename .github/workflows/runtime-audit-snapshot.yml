name: ENGINEER OSINT runtime audit snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runtime-audit-snapshot.yml'
      - 'docs/engineer-osint/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check docs/engineer-osint/build-pages.mjs
          node --check docs/engineer-osint/postprocess-ui.mjs
          node --check docs/engineer-osint/validate-runtime.mjs
      - name: Build cumulative dashboard
        run: node docs/engineer-osint/build-pages.mjs
      - name: Run runtime audit
        run: node docs/engineer-osint/validate-runtime.mjs
      - name: Extract exact ENG-TECH runtime records
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('docs/engineer-osint-dist/index.html','utf8');
          const marker='window.__ENGINEER_DATA__=';
          const a=html.indexOf(marker), b=html.indexOf(';</script>',a);
          const d=JSON.parse(html.slice(a+marker.length,b));
          const ids=new Set(['ENG-TECH-0002','ENG-TECH-0003','ENG-TECH-0004','ENG-TECH-0007','ENG-TECH-0008','ENG-TECH-0009','ENG-TECH-0010','ENG-TECH-0020','ENG-TECH-0021','ENG-TECH-0022']);
          const recs=(d.records?.records||[]).filter(r=>ids.has(r.id));
          fs.writeFileSync('docs/engineer-osint-dist/tech-title-records.json',JSON.stringify(recs,null,2));
          NODE
      - name: Upload audit and exact source modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineer-osint-tech-title-records
          if-no-files-found: warn
          path: |
            docs/engineer-osint-dist/tech-title-records.json
            docs/engineer-osint-dist/runtime-audit.json
            docs/engineer-osint-dist/translation-backlog.json
            docs/engineer-osint-dist/health.txt
            docs/engineer-osint/i18n-content-cs.js
            docs/engineer-osint/i18n-content-cs-france-germany-poland.js
            docs/engineer-osint/i18n-content-cs-japan-australia.js
            docs/engineer-osint/i18n-content-cs-israel-turkiye-rich.js
