name: ENGINEER OSINT runtime audit snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runtime-audit-snapshot.yml'
      - 'docs/engineer-osint/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check docs/engineer-osint/build-pages.mjs
          node --check docs/engineer-osint/postprocess-ui.mjs
          node --check docs/engineer-osint/validate-runtime.mjs
      - name: Build cumulative dashboard
        run: node docs/engineer-osint/build-pages.mjs
      - name: Run pre-translation runtime audit
        run: node docs/engineer-osint/validate-runtime.mjs
      - name: Apply audited ENG-TECH translations
        run: |
          node <<'NODE'
          const fs=require('fs');
          const batch='2026-08-18-1848-tech-backlog';
          const edit=(file,fn)=>{let s=fs.readFileSync(file,'utf8');const out=fn(s);if(out===s)throw new Error('No change in '+file);fs.writeFileSync(file,out)};
          edit('docs/engineer-osint/i18n-content-cs.js',s=>{
            for(const id of ['ENG-TECH-0002','ENG-TECH-0003','ENG-TECH-0004','ENG-TECH-0007','ENG-TECH-0008','ENG-TECH-0009','ENG-TECH-0010']) if(s.includes(`put('${id}'`)) throw new Error('duplicate '+id);
            const anchor="  put('ENG-EVT-0021'";
            const insert="  put('ENG-TECH-0002',{title_cs:'Indie — nákup sestav TRAWL pro T-72/T-90'});\n  put('ENG-TECH-0003',{title_cs:'Ruský UBIM — přijat do výzbroje ženijních vojsk'});\n  put('ENG-TECH-0004',{title_cs:'IMR-3M — vybaven prostředky elektronického boje a dodatečnou ochranou proti dronům'});\n  put('ENG-TECH-0007',{title_cs:'PLAA 综合扫雷车 / 履带式综合扫雷车 — integrované odminovací vozidlo; formální označení nevyřešeno'});\n  put('ENG-TECH-0008',{title_cs:'PLAA Rapidly Emplaced Bridge System (REBS) — oficiální anglický popis; přesné označení nevyřešeno'});\n  put('ENG-TECH-0009',{title_cs:'PLAA plovoucí pontonový mostní systém — přesné označení nevyřešeno'});\n  put('ENG-TECH-0010',{title_cs:'PLAA vozidlový / raketový systém kladení min (火箭布雷车) — formální označení nevyřešeno'});\n\n";
            if(!s.includes(anchor)) throw new Error('general anchor missing');s=s.replace(anchor,insert+anchor);
            const reg="  window.__ENGINEER_I18N_CONTENT_CS__=";
            const audit=`  D.translation_audit_cs.batches.push({batch:'${batch}',processed_ids:['ENG-TECH-0002','ENG-TECH-0003','ENG-TECH-0004','ENG-TECH-0007','ENG-TECH-0008','ENG-TECH-0009','ENG-TECH-0010'],fully_translated:7,partially_translated:0,review_needed:0,scope:'TECH priority; translate the sole missing public title_cs for audited India, Russia and China runtime records; preserve unresolved-designation caveats, official descriptors, English/base fields and evidentiary classifications',english_preserved:true});\n`;
            if(!s.includes(reg)) throw new Error('general registry missing');s=s.replace(reg,audit+reg).replace("version:'1.7',last_batch:'2026-08-18-1514'","version:'1.8',last_batch:'2026-08-18-1848-tech-backlog'");return s;
          });
          edit('docs/engineer-osint/i18n-content-cs-france-germany-poland.js',s=>{
            if(s.includes("put('ENG-TECH-0021'")) throw new Error('duplicate 0021');
            const anchor="  put('ENG-TECH-0011',";if(!s.includes(anchor)) throw new Error('FGP anchor missing');s=s.replace(anchor,"  put('ENG-TECH-0021',{title_cs:'EvoLogics Sonobot 5 USV — vojenský hydrografický průzkum'});\n\n"+anchor);
            const reg="  window.__ENGINEER_I18N_CONTENT_CS_FGP__=";const audit=`  D.translation_audit_cs.batches.push({batch:'${batch}',processed_ids:['ENG-TECH-0021'],fully_translated:1,partially_translated:0,review_needed:0,scope:'TECH priority; translate the sole missing title_cs for the canonical Sonobot 5 military hydrographic reconnaissance record; English/base fields unchanged.',english_preserved:true});\n`;if(!s.includes(reg)) throw new Error('FGP registry missing');s=s.replace(reg,audit+reg).replace("'ENG-TECH-0012'].filter","'ENG-TECH-0012','ENG-TECH-0021'].filter").replace("version:'1.7',last_batch:'2026-08-18-1802-tech-backlog'","version:'1.8',last_batch:'2026-08-18-1848-tech-backlog'");return s;
          });
          edit('docs/engineer-osint/i18n-content-cs-japan-australia.js',s=>{
            if(s.includes("put('ENG-TECH-0020'")) throw new Error('duplicate 0020');
            const anchor="  put('ENG-TECH-0016',";if(!s.includes(anchor)) throw new Error('Japan anchor missing');s=s.replace(anchor,"  put('ENG-TECH-0020',{title_cs:'83式地雷敷設装置 / Type 83 — systém kladení min'});\n\n"+anchor);
            const reg="  window.__ENGINEER_I18N_CONTENT_CS_JAPAN_AU__={";const audit=`  D.translation_audit_cs.batches.push({batch:'${batch}',processed_ids:['ENG-TECH-0020'],fully_translated:1,partially_translated:0,review_needed:0,scope:'TECH priority; translate the sole missing title_cs for the canonical JGSDF Type 83 mine-laying system while preserving the Japanese designation and countermobility meaning.',english_preserved:true});\n`;if(!s.includes(reg)) throw new Error('Japan registry missing');s=s.replace(reg,audit+reg).replace("translated_entities:['ENG-TECH-0006'","translated_entities:['ENG-TECH-0006','ENG-TECH-0020'").replace("version:'1.3'","version:'1.4'").replace("last_batch:'2026-08-18-1802-tech-backlog'","last_batch:'2026-08-18-1848-tech-backlog'");return s;
          });
          edit('docs/engineer-osint/i18n-content-cs-israel-turkiye-rich.js',s=>{
            if(s.includes("put('ENG-TECH-0022'")) throw new Error('duplicate 0022');
            const anchor="  put('ENG-TECH-0014',";if(!s.includes(anchor)) throw new Error('IT anchor missing');s=s.replace(anchor,"  put('ENG-TECH-0022',{title_cs:'KUNDUZ / Armoured Amphibious Combat Earthmover (AACE) — obrněný obojživelný ženijní zemní stroj'});\n\n"+anchor);
            const reg="  window.__ENGINEER_I18N_ISRAEL_TURKIYE_RICH_CS__=";const audit=`  D.translation_audit_cs.batches.push({batch:'${batch}',processed_ids:['ENG-TECH-0022'],fully_translated:1,partially_translated:0,review_needed:0,scope:'TECH priority; translate the sole missing title_cs for KUNDUZ/AACE while preserving the manufacturer designation, English/base fields and evidentiary caveats.',english_preserved:true});\n`;if(!s.includes(reg)) throw new Error('IT registry missing');s=s.replace(reg,audit+reg).replace("version:'1.1',last_batch:'2026-08-18-1313-india-rich'","version:'1.2',last_batch:'2026-08-18-1848-tech-backlog'");return s;
          });
          NODE
          node --check docs/engineer-osint/i18n-content-cs.js
          node --check docs/engineer-osint/i18n-content-cs-france-germany-poland.js
          node --check docs/engineer-osint/i18n-content-cs-japan-australia.js
          node --check docs/engineer-osint/i18n-content-cs-israel-turkiye-rich.js
      - name: Commit translation source changes to PR branch
        run: |
          git config user.name genie85
          git config user.email tom.repak@gmail.com
          git add docs/engineer-osint/i18n-content-cs.js docs/engineer-osint/i18n-content-cs-france-germany-poland.js docs/engineer-osint/i18n-content-cs-japan-australia.js docs/engineer-osint/i18n-content-cs-israel-turkiye-rich.js
          git commit -m 'Translate ENGINEER OSINT batch 2026-08-18-1848'
          git push origin HEAD:$GITHUB_HEAD_REF
