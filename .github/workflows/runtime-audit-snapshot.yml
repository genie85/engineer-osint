name: ENGINEER OSINT runtime audit snapshot

# PR audit trigger 2026-08-18T15:00+02:00
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runtime-audit-snapshot.yml'
      - 'docs/engineer-osint/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical snapshot and append-only runs
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          set -euo pipefail
          for file in docs/engineer-osint/*.js docs/engineer-osint/*.mjs docs/engineer-osint/lib/*.mjs; do
            node --check "$file"
          done
      - name: Test P0/P1 integrity contract
        env:
          B106_CI_NOTES_COMMIT: ${{ vars.B106_CI_NOTES_COMMIT }}
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          [[ "$B106_CI_NOTES_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$B106_CI_NOTES_COMMIT" != 0000000000000000000000000000000000000000 ]]
          unset NODE_OPTIONS
          for inherited_git_var in ${!GIT_@}; do unset "$inherited_git_var"; done
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_TERMINAL_PROMPT=0 GIT_NO_REPLACE_OBJECTS=1
          runner_temp="$(realpath -- "$RUNNER_TEMP")"
          checkout_root="$(pwd -P)"
          case "$runner_temp/" in "$checkout_root/"*) exit 1 ;; esac
          case "$checkout_root/" in "$runner_temp/"*) exit 1 ;; esac
          node -e 'const fs=require("node:fs");const s=fs.statfsSync(process.env.RUNNER_TEMP,{bigint:true});if(s.bavail*s.bsize<13000000000n)throw Error("13GB disk gate");'
          timeout 30s git fetch --no-tags --depth=1 origin refs/notes/b106-ci-fixture:refs/notes/b106-ci-fixture
          [[ "$(git rev-parse --verify refs/notes/b106-ci-fixture)" == "$B106_CI_NOTES_COMMIT" ]]
          source_commit=1df9875a50d5ad47188d0ba4a262ea11e3e65693
          timeout 30s git fetch --no-tags --depth=1 origin "$source_commit"
          source_dir="$(mktemp -d "$runner_temp/b106-source.XXXXXX")"
          timeout 30s git -c core.hooksPath=/dev/null worktree add --detach "$source_dir" "$source_commit"
          export B106_EXTERNAL_SOURCE_FIXTURE_DIR="$source_dir/"
          fixture_receipt="$(node docs/engineer-osint/ci/prepare-b106-fixture.mjs)"
          fixture_path="$(printf '%s' "$fixture_receipt" | node -e 'let s="";process.stdin.on("data",b=>s+=b);process.stdin.on("end",()=>{const a=JSON.parse(s);if(typeof a.fixturePath!=="string"||/[\r\n]/.test(a.fixturePath)||a.execution_allowed!==false)throw Error("invalid fixture receipt");process.stdout.write(a.fixturePath);});')"
          export B106_EXTERNAL_INVENTORY_FIXTURE="$fixture_path"
          node --import ./docs/engineer-osint/ci/b106-root-preload.mjs --test docs/engineer-osint/tests/*.test.mjs
      - name: Validate canonical snapshot and append-only chain
        run: node docs/engineer-osint/validate-patch.mjs
      - name: Build cumulative dashboard
        run: node docs/engineer-osint/build-pages.mjs
      - name: Verify active PUBLIC-CZ runtime modules
        run: |
          set -euo pipefail
          grep -q 'engineer-i18n-content-cs-public-cz-0633-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-content-cs-public-cz-2110-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-content-cs-public-cz-1746-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-content-cs-public-cz-1817-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-content-cs-public-cz-1834-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-content-cs-public-cz-backlog-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-runtime-switch-fix-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-public-cz-ui-canary-module' docs/engineer-osint-dist/index.html
      - name: Run runtime audit
        run: node docs/engineer-osint/validate-runtime.mjs
      - name: Run PUBLIC-CZ-UI audit
        run: node docs/engineer-osint/audit-public-cz-ui-latest.mjs
      - name: Prepare parent PUBLIC-CZ ratchet baseline
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          rm -f /tmp/public-cz-parent-baseline.json
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
          git show FETCH_HEAD:docs/engineer-osint/public-cz-backlog-baseline.json > /tmp/public-cz-parent-baseline.json 2>/dev/null || true
      - name: Gate PUBLIC-CZ regression ratchet
        env:
          PUBLIC_CZ_PARENT_BASELINE: /tmp/public-cz-parent-baseline.json
        run: node docs/engineer-osint/validate-public-cz-regression.mjs
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engineer-osint-runtime-audit
          if-no-files-found: warn
          path: |
            docs/engineer-osint-dist/index.html
            docs/engineer-osint-dist/runtime-audit.json
            docs/engineer-osint-dist/translation-backlog.json
            docs/engineer-osint-dist/public-cz-ui-audit.json
            docs/engineer-osint-dist/public-cz-ui-audit.md
            docs/engineer-osint-dist/health.txt
