name: ENGINEER OSINT runtime audit snapshot

# PR audit trigger 2026-08-18T16:12+02:00
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runtime-audit-snapshot.yml'
      - 'docs/engineer-osint/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check docs/engineer-osint/build-pages.mjs
          node --check docs/engineer-osint/postprocess-ui.mjs
          node --check docs/engineer-osint/validate-runtime.mjs
      - name: Build cumulative dashboard
        run: node docs/engineer-osint/build-pages.mjs
      - name: Extract remaining ENG-UNIT backlog records
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('docs/engineer-osint-dist/index.html','utf8');
          const marker='window.__ENGINEER_DATA__=';
          const a=html.indexOf(marker), b=html.indexOf(';</script>',a);
          const d=JSON.parse(html.slice(a+marker.length,b));
          const ids=new Set(['ENG-UNIT-0017','ENG-UNIT-0018','ENG-UNIT-0021','ENG-UNIT-0022','ENG-UNIT-0023','ENG-UNIT-0024','ENG-UNIT-0025','ENG-UNIT-0026','ENG-UNIT-0027','ENG-UNIT-0028','ENG-UNIT-0029','ENG-UNIT-FR-31RG']);
          const recs=(d.records?.records||[]).filter(r=>ids.has(r.id));
          fs.writeFileSync('docs/engineer-osint-dist/unit-title-records.json',JSON.stringify(recs,null,2));
          NODE
      - name: Run runtime audit
        run: node docs/engineer-osint/validate-runtime.mjs
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineer-osint-unit-title-records
          if-no-files-found: warn
          path: |
            docs/engineer-osint-dist/unit-title-records.json
            docs/engineer-osint-dist/runtime-audit.json
            docs/engineer-osint-dist/translation-backlog.json
            docs/engineer-osint-dist/health.txt
