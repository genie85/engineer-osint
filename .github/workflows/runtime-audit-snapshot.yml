name: ENGINEER OSINT runtime audit snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runtime-audit-snapshot.yml'
      - 'docs/engineer-osint/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply explicit mapping-resolution support and restore workflow
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='docs/engineer-osint/validate-runtime.mjs';
          let s=fs.readFileSync(p,'utf8');
          const old=`const explicitReviewNeeded=new Set();\nfor(const value of Object.values(context.window)){\n  if(!value||typeof value!=='object'||Array.isArray(value))continue;\n  for(const id of value.review_needed_entities||[])if(typeof id==='string'&&id)explicitReviewNeeded.add(id);\n}\nconst translationReviewNeeded=new Set([...unresolved,...explicitReviewNeeded]);`;
          const neu=`const explicitReviewNeeded=new Set();\nconst explicitResolvedMappings=new Set();\nfor(const value of Object.values(context.window)){\n  if(!value||typeof value!=='object'||Array.isArray(value))continue;\n  for(const id of value.review_needed_entities||[])if(typeof id==='string'&&id)explicitReviewNeeded.add(id);\n  for(const id of value.resolved_mapping_entities||[])if(typeof id==='string'&&id)explicitResolvedMappings.add(id);\n}\nfor(const id of explicitResolvedMappings){unresolved.delete(id);explicitReviewNeeded.delete(id);}\nconst translationReviewNeeded=new Set([...unresolved,...explicitReviewNeeded]);`;
          if(!s.includes(old)) throw new Error('validator review block not found');
          s=s.replace(old,neu);
          const oldAudit=`    patch_history:[...unresolved].sort(),\n    explicit_i18n:[...explicitReviewNeeded].sort()`;
          const newAudit=`    patch_history:[...unresolved].sort(),\n    explicit_i18n:[...explicitReviewNeeded].sort(),\n    explicit_resolved_i18n:[...explicitResolvedMappings].sort()`;
          if(!s.includes(oldAudit)) throw new Error('validator audit-source block not found');
          s=s.replace(oldAudit,newAudit);
          fs.writeFileSync(p,s);
          NODE
          git show origin/main:.github/workflows/runtime-audit-snapshot.yml > .github/workflows/runtime-audit-snapshot.yml
      - name: Syntax checks
        run: |
          node --check docs/engineer-osint/build-pages.mjs
          node --check docs/engineer-osint/postprocess-ui.mjs
          node --check docs/engineer-osint/validate-runtime.mjs
          node --check docs/engineer-osint/i18n-content-cs-france-germany-poland.js
          node --check docs/engineer-osint/i18n-content-cs-usa-rok.js
      - name: Build cumulative dashboard
        run: node docs/engineer-osint/build-pages.mjs
      - name: Run runtime audit
        run: node docs/engineer-osint/validate-runtime.mjs
      - name: Verify mapping resolution
        run: |
          grep -q 'translation_canary=pass' docs/engineer-osint-dist/health.txt
          grep -q 'translation_review_needed=ENG-TECH-0019' docs/engineer-osint-dist/health.txt
          node - <<'NODE'
          const a=require('./docs/engineer-osint-dist/runtime-audit.json');
          if(a.translation_review_needed.includes('ENG-UNIT-0011')||a.translation_review_needed.includes('ENG-UNIT-0014')) throw new Error('unit mapping still unresolved');
          const r=a.translation_review_sources?.explicit_resolved_i18n||[];
          for(const id of ['ENG-UNIT-0011','ENG-UNIT-0014']) if(!r.includes(id)) throw new Error('missing explicit resolution '+id);
          NODE
      - name: Commit validated mapping resolution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/engineer-osint/validate-runtime.mjs docs/engineer-osint/i18n-content-cs-france-germany-poland.js docs/engineer-osint/i18n-content-cs-usa-rok.js .github/workflows/runtime-audit-snapshot.yml
          if git diff --cached --quiet; then
            echo 'No mapping resolution changes.'
          else
            git commit -m 'Translate ENGINEER OSINT batch 2026-08-18-1530'
            git push
          fi
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineer-osint-mapping-resolution-audit
          if-no-files-found: warn
          path: |
            docs/engineer-osint-dist/runtime-audit.json
            docs/engineer-osint-dist/translation-backlog.json
            docs/engineer-osint-dist/health.txt
