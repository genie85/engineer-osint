name: ENGINEER OSINT runtime audit snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runtime-audit-snapshot.yml'
      - 'docs/engineer-osint/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check docs/engineer-osint/build-pages.mjs
          node --check docs/engineer-osint/postprocess-ui.mjs
          node --check docs/engineer-osint/validate-runtime.mjs
      - name: Build cumulative dashboard
        run: node docs/engineer-osint/build-pages.mjs
      - name: Extract bounded EVT canonical fields
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('docs/engineer-osint-dist/index.html','utf8');
          const m='window.__ENGINEER_DATA__='; const a=h.indexOf(m), b=h.indexOf(';</script>',a);
          const d=JSON.parse(h.slice(a+m.length,b));
          const ids=new Set(['ENG-EVT-0001','ENG-EVT-0002','ENG-EVT-0003','ENG-EVT-0014','ENG-EVT-0015']);
          for(const r of d.records.records.filter(x=>ids.has(x.id))) console.log('EVT_CANONICAL '+JSON.stringify({id:r.id,title:r.title,title_en:r.title_en,intelligence_gaps:r.intelligence_gaps}));
          NODE
      - name: Run runtime audit
        run: node docs/engineer-osint/validate-runtime.mjs
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineer-osint-runtime-audit
          if-no-files-found: warn
          path: |
            docs/engineer-osint-dist/runtime-audit.json
            docs/engineer-osint-dist/translation-backlog.json
            docs/engineer-osint-dist/health.txt
