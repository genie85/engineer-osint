name: ENGINEER OSINT runtime audit snapshot

# PR audit trigger 2026-08-18T15:00+02:00
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runtime-audit-snapshot.yml'
      - 'docs/engineer-osint/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check docs/engineer-osint/build-pages.mjs
          node --check docs/engineer-osint/postprocess-ui.mjs
          node --check docs/engineer-osint/validate-runtime.mjs
          node --check docs/engineer-osint/audit-public-cz-ui.mjs
      - name: Build cumulative dashboard
        run: node docs/engineer-osint/build-pages.mjs
      - name: Run runtime audit
        continue-on-error: true
        run: node docs/engineer-osint/validate-runtime.mjs
      - name: Run PUBLIC-CZ-UI audit
        run: node docs/engineer-osint/audit-public-cz-ui.mjs
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineer-osint-runtime-audit
          if-no-files-found: warn
          path: |
            docs/engineer-osint-dist/runtime-audit.json
            docs/engineer-osint-dist/translation-backlog.json
            docs/engineer-osint-dist/public-cz-ui-audit.json
            docs/engineer-osint-dist/public-cz-ui-audit.md
            docs/engineer-osint-dist/health.txt
