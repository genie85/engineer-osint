name: ENGINEER OSINT runtime audit snapshot

# PR audit trigger 2026-08-18T15:00+02:00
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runtime-audit-snapshot.yml'
      - 'docs/engineer-osint/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical snapshot and append-only runs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          set -euo pipefail
          for file in docs/engineer-osint/*.js docs/engineer-osint/*.mjs docs/engineer-osint/lib/*.mjs; do
            node --check "$file"
          done
      - name: Test P0/P1 integrity contract
        run: node --test docs/engineer-osint/tests/*.test.mjs
      - name: Validate canonical snapshot and append-only chain
        run: node docs/engineer-osint/validate-patch.mjs
      - name: Build cumulative dashboard
        run: node docs/engineer-osint/build-pages.mjs
      - name: Verify active PUBLIC-CZ runtime modules
        run: |
          set -euo pipefail
          grep -q 'engineer-i18n-content-cs-public-cz-0633-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-content-cs-public-cz-2110-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-content-cs-public-cz-1746-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-content-cs-public-cz-1817-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-content-cs-public-cz-1834-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-content-cs-public-cz-backlog-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-runtime-switch-fix-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-public-cz-ui-canary-module' docs/engineer-osint-dist/index.html
      - name: Run runtime audit
        run: node docs/engineer-osint/validate-runtime.mjs
      - name: Run PUBLIC-CZ-UI audit
        run: node docs/engineer-osint/audit-public-cz-ui-latest.mjs
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineer-osint-runtime-audit
          if-no-files-found: warn
          path: |
            docs/engineer-osint-dist/index.html
            docs/engineer-osint-dist/runtime-audit.json
            docs/engineer-osint-dist/translation-backlog.json
            docs/engineer-osint-dist/public-cz-ui-audit.json
            docs/engineer-osint-dist/public-cz-ui-audit.md
            docs/engineer-osint-dist/health.txt
