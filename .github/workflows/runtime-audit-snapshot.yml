name: ENGINEER OSINT runtime audit snapshot

# PR audit trigger 2026-08-18T17:58+02:00
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runtime-audit-snapshot.yml'
      - 'docs/engineer-osint/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check docs/engineer-osint/build-pages.mjs
          node --check docs/engineer-osint/postprocess-ui.mjs
          node --check docs/engineer-osint/validate-runtime.mjs
      - name: Build cumulative dashboard
        run: node docs/engineer-osint/build-pages.mjs
      - name: Run runtime audit
        run: node docs/engineer-osint/validate-runtime.mjs
      - name: Extract ENG-TECH backlog records
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('docs/engineer-osint-dist/index.html','utf8');
          const marker='window.__ENGINEER_DATA__=';
          const a=html.indexOf(marker), b=html.indexOf(';</script>',a);
          const d=JSON.parse(html.slice(a+marker.length,b));
          const backlog=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/translation-backlog.json','utf8'));
          const items=backlog.items||backlog.entities||backlog.backlog||[];
          const ids=new Set(items.filter(x=>String(x.id||'').startsWith('ENG-TECH-')).map(x=>x.id));
          const recs=(d.records?.records||[]).filter(r=>ids.has(r.id));
          fs.writeFileSync('docs/engineer-osint-dist/tech-backlog-records.json',JSON.stringify(recs,null,2));
          NODE
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineer-osint-tech-backlog
          if-no-files-found: warn
          path: |
            docs/engineer-osint-dist/tech-backlog-records.json
            docs/engineer-osint-dist/runtime-audit.json
            docs/engineer-osint-dist/translation-backlog.json
            docs/engineer-osint-dist/health.txt
