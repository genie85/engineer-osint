name: ENGINEER OSINT runtime audit snapshot

on:
  push:
    branches: [translation-20260818-1934]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runtime-audit-snapshot.yml'
      - 'docs/engineer-osint/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check docs/engineer-osint/build-pages.mjs
          node --check docs/engineer-osint/postprocess-ui.mjs
          node --check docs/engineer-osint/validate-runtime.mjs
      - name: Build cumulative dashboard
        run: node docs/engineer-osint/build-pages.mjs
      - name: Extract TTP candidates
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('docs/engineer-osint-dist/index.html','utf8');
          const m=html.match(/window\.__ENGINEER_DATA__\s*=\s*({[\s\S]*?});\s*<\/script>/);
          if(!m) throw new Error('ENGINEER_DATA not found');
          const D=vm.runInNewContext('('+m[1]+')');
          for(const id of ['ENG-TTP-0004','ENG-TTP-0005']) console.log('TTP_OBJECT '+JSON.stringify((D.records?.records||[]).find(x=>x.id===id)));
          NODE
      - name: Run runtime audit
        run: node docs/engineer-osint/validate-runtime.mjs
