name: ENGINEER OSINT temporary v4.6.40 wave-2 photo acquisition

on:
  push:
    branches:
      - chatgpt/engineer-osint-v4640-wave2-photo-acquisition
    paths:
      - .github/workflows/v4640-photo-acquire-readonly-temp.yml

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install deterministic image encoder
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Acquire exact reviewed wave-2 files and optimize
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/photos
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, urllib.parse
          from PIL import Image, ImageOps

          items = [
            (
              'ENG-TECH-0045',
              'Joint Assault Bridge Vehicle during Winter Shield 2021 (2).jpg',
              'eng-tech-0045-m1074-jab.webp',
            ),
            (
              'ENG-TECH-0048',
              'M1150 Assault Breacher Vehicle at the Drawsko Pomorskie Training Area.jpg',
              'eng-tech-0048-m1150-abv.webp',
            ),
            (
              'ENG-TECH-0049',
              'Leguan bridge layer.jpg',
              'eng-tech-0049-leguan.webp',
            ),
          ]

          temp = pathlib.Path('/tmp/engineer-osint-v4640')
          temp.mkdir(parents=True, exist_ok=True)
          out = pathlib.Path('out/photos')
          manifest = {
            'schema_version': 1,
            'batch': 'v4.6.40',
            'purpose': 'Read-only acquisition of three exact wave-2 Wikimedia Commons source binaries. No repository write, canonical mutation or LOCAL_IMAGE claim is performed by this workflow.',
            'transformation': 'EXIF orientation normalized; resized only if long edge >1600 px; WebP quality 82, method 6, exact=True; no crop or editorial alteration.',
            'entries': [],
          }

          for card_id, source_name, local_name in items:
            encoded = urllib.parse.quote(source_name, safe='')
            acquisition_url = f'https://commons.wikimedia.org/wiki/Special:Redirect/file/{encoded}'
            source_path = temp / source_name.replace('/', '_')
            subprocess.run([
              'curl','-L','--fail','--retry','4','--retry-all-errors',
              '--connect-timeout','20','--max-time','180',
              '-A','ENGINEER-OSINT/1.0 (GitHub Actions reviewed-media acquisition)',
              '-o',str(source_path),acquisition_url,
            ], check=True)

            source_bytes = source_path.read_bytes()
            if not source_bytes:
              raise SystemExit(f'empty source download for {card_id}')

            with Image.open(source_path) as raw:
              image = ImageOps.exif_transpose(raw)
              source_dimensions = list(image.size)
              if max(image.size) > 1600:
                image.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
              if image.mode not in ('RGB', 'RGBA'):
                image = image.convert('RGBA' if 'A' in image.getbands() else 'RGB')
              local_path = out / local_name
              image.save(local_path, 'WEBP', quality=82, method=6, exact=True)
              local_dimensions = list(image.size)

            local_bytes = local_path.read_bytes()
            manifest['entries'].append({
              'card_id': card_id,
              'source_file_name': source_name,
              'source_acquisition_url': acquisition_url,
              'source_sha256': hashlib.sha256(source_bytes).hexdigest(),
              'source_bytes': len(source_bytes),
              'source_dimensions': source_dimensions,
              'artifact_path': f'photos/{local_name}',
              'local_sha256': hashlib.sha256(local_bytes).hexdigest(),
              'local_bytes': len(local_bytes),
              'local_dimensions': local_dimensions,
            })

          pathlib.Path('out/v4640-wave2-acquisition.json').write_text(
            json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
            encoding='utf-8',
          )
          PY

      - name: Upload read-only acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: v4640-wave2-photo-binaries
          path: out
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
