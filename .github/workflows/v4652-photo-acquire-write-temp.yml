name: ENGINEER OSINT temporary v4.6.52 exact wave-3 photo acquisition

on:
  push:
    branches:
      - chatgpt/engineer-osint-v4652-wave3-photo-acquisition-execution
    paths:
      - .github/workflows/v4652-photo-acquire-write-temp.yml

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated authorized acquisition branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install deterministic image encoder
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Materialize exact authorized photos and provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.parse
          from PIL import Image, ImageOps

          root = pathlib.Path('docs/engineer-osint')
          auth_path = root / 'V4651_WAVE3_PHOTO_ACQUISITION_WORKFLOW_AUTHORIZATION.json'
          auth = json.loads(auth_path.read_text(encoding='utf-8'))
          branch = 'chatgpt/engineer-osint-v4652-wave3-photo-acquisition-execution'
          workflow_path = '.github/workflows/v4652-photo-acquire-write-temp.yml'
          source_main = 'd8567ed7d3b2d06818bf320f26e538ee6cc533f7'

          if os.environ.get('GITHUB_REF_NAME') != branch:
            raise SystemExit(f'unexpected branch: {os.environ.get("GITHUB_REF_NAME")}')
          if auth.get('status') != 'READY_FOR_IMPLEMENTATION':
            raise SystemExit('authorization is not READY_FOR_IMPLEMENTATION')
          if auth.get('reviewed_main_sha') != '535c5513da945674b70ce127e0982576b0040825':
            raise SystemExit('authorization reviewed_main_sha drift')

          ac = auth['authorized_change']
          if ac.get('temporary_workflow_path') != workflow_path:
            raise SystemExit('workflow path is not exactly authorized')
          if ac.get('temporary_workflow_permissions') != {'contents': 'write'}:
            raise SystemExit('workflow permissions are not exactly authorized')
          if ac.get('temporary_workflow_must_use_pillow_version') != '11.3.0':
            raise SystemExit('unexpected Pillow authorization')
          for field in [
            'allow_canonical_change','allow_run_store_change','allow_historical_run_change',
            'allow_photo_review_status_change','allow_existing_review_batch_change',
            'allow_executor_change','allow_deployment_workflow_change','allow_other_permissions_change',
            'allow_local_image_canonical_claim','allow_source_or_output_hash_drift'
          ]:
            if ac.get(field) is not False:
              raise SystemExit(f'authorization boundary drift: {field}')

          allowed = {
            'docs/engineer-osint/assets/photos/eng-tech-0014-blt-arjun.webp',
            'docs/engineer-osint/assets/photos/eng-tech-0015-short-span-bridge-10m.webp',
            'docs/engineer-osint/assets/photos/eng-tech-0018-jgsdf-combat-engineer-vehicle.webp',
            'docs/engineer-osint/assets/photos/eng-tech-0019-type-92-floating-bridge.webp',
            'docs/engineer-osint/assets/photos/eng-tech-0020-type-83-mine-laying-system.webp',
            'docs/engineer-osint/assets/photos/eng-tech-0038-mv-10.webp',
            'docs/engineer-osint/assets/photos/eng-tech-0041-uran-6.webp',
            'docs/engineer-osint/photo-local-acquisitions/v4652-wave3-ready-for-import.json',
          }
          if set(ac.get('allowed_persistent_paths', [])) != allowed:
            raise SystemExit('authorization allowlist mismatch')

          cards = {
            'ENG-TECH-0014','ENG-TECH-0015','ENG-TECH-0018','ENG-TECH-0019',
            'ENG-TECH-0020','ENG-TECH-0038','ENG-TECH-0041'
          }
          media = {x['card_id']: x for x in auth.get('exact_media', [])}
          if set(media) != cards:
            raise SystemExit('authorized media set mismatch')

          expected_batches = {
            'docs/engineer-osint/photo-review-batches/v4584.json': '391b4c21493000576f4136f4dd78b8eb80a6265c',
            'docs/engineer-osint/photo-review-batches/v4588.json': '9bc5162a34a4d43292732c3e603669b28fab4338',
          }
          pinned = {x['path']: x['git_blob_sha'] for x in auth['evidence']['source_review_batches']}
          if pinned != expected_batches:
            raise SystemExit('source review batch authorization mismatch')

          def blob_sha(raw):
            return hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()

          reviews = {}
          for repo_path, expected_sha in expected_batches.items():
            raw = pathlib.Path(repo_path).read_bytes()
            if blob_sha(raw) != expected_sha:
              raise SystemExit(f'review batch blob drift: {repo_path}')
            for entry in json.loads(raw.decode('utf-8')).get('entries', []):
              cid = entry.get('card_id')
              if cid in cards:
                if entry.get('status') != 'READY_FOR_IMPORT':
                  raise SystemExit(f'{cid} is no longer READY_FOR_IMPORT')
                if cid in reviews:
                  raise SystemExit(f'duplicate review entry {cid}')
                reviews[cid] = entry
          if set(reviews) != cards:
            raise SystemExit('reviewed card set mismatch')

          attribution_fallback = {
            'ENG-TECH-0038': 'Credit Міністерство економіки України, identify the Wikimedia Commons source, link the CC BY 4.0 licence, and indicate modifications.',
            'ENG-TECH-0041': 'Credit Ministry of Defence of the Russian Federation / Mil.ru, identify the Wikimedia Commons source, link the CC BY 4.0 licence, and indicate modifications.',
          }
          for cid, review in reviews.items():
            if review.get('attribution_requirement'):
              continue
            if cid not in attribution_fallback or review.get('license') != 'CC BY 4.0':
              raise SystemExit(f'{cid} lacks reviewed attribution and has no exact acquisition fallback')

          temp = pathlib.Path('/tmp/engineer-osint-v4652')
          temp.mkdir(parents=True, exist_ok=True)
          (root / 'assets/photos').mkdir(parents=True, exist_ok=True)
          (root / 'photo-local-acquisitions').mkdir(parents=True, exist_ok=True)

          manifest = {
            'schema_version': 1,
            'batch': 'v4.6.52',
            'acquired_at': '2026-09-04',
            'policy': 'Archive exact reviewed reusable media locally before any separate canonical LOCAL_IMAGE linkage.',
            'scope': 'Exact authorized wave-3 acquisition for the seven READY_FOR_IMPORT cards pinned by V4651.',
            'source_main_sha': source_main,
            'authorization_path': 'docs/engineer-osint/V4651_WAVE3_PHOTO_ACQUISITION_WORKFLOW_AUTHORIZATION.json',
            'read_only_discovery_run_id': auth['evidence']['read_only_workflow_run_id'],
            'read_only_discovery_artifact_id': auth['evidence']['read_only_artifact_id'],
            'read_only_discovery_artifact_digest': auth['evidence']['read_only_artifact_digest'],
            'execution_run_id': int(os.environ['GITHUB_RUN_ID']),
            'transformation': 'Exact Commons source binary verified first, then EXIF orientation normalized, resized only when the long edge exceeded 1600 px, and encoded as WebP quality 82 with Pillow 11.3.0, method 6, exact=True; no crop, no upscale and no editorial alteration.',
            'entries': [],
          }

          for cid in sorted(cards):
            authorized = media[cid]
            review = reviews[cid]
            source_name = authorized['source_file_name']
            acquisition_url = 'https://commons.wikimedia.org/wiki/Special:Redirect/file/' + urllib.parse.quote(source_name, safe='')
            source_path = temp / source_name.replace('/', '_')
            subprocess.run([
              'curl','-L','--fail','--retry','4','--retry-all-errors',
              '--connect-timeout','20','--max-time','240',
              '-A','ENGINEER-OSINT/1.0 (GitHub Actions authorized reviewed-media acquisition)',
              '-o',str(source_path),acquisition_url,
            ], check=True)
            source_raw = source_path.read_bytes()
            source_sha = hashlib.sha256(source_raw).hexdigest()
            if source_sha != authorized['source_sha256'] or len(source_raw) != authorized['source_bytes']:
              raise SystemExit(f'{cid} exact source bytes drift')

            with Image.open(source_path) as raw:
              image = ImageOps.exif_transpose(raw)
              source_dimensions = list(image.size)
              if source_dimensions != authorized['source_dimensions']:
                raise SystemExit(f'{cid} source dimensions drift')
              if max(image.size) > 1600:
                image.thumbnail((1600,1600), Image.Resampling.LANCZOS)
              if image.mode not in ('RGB','RGBA'):
                image = image.convert('RGBA' if 'A' in image.getbands() else 'RGB')
              repo_path = authorized['expected_local_path']
              prefix = 'docs/engineer-osint/'
              if not repo_path.startswith(prefix):
                raise SystemExit(f'{cid} local path prefix drift')
              local_rel = repo_path[len(prefix):]
              local_path = root / local_rel
              local_path.parent.mkdir(parents=True, exist_ok=True)
              image.save(local_path,'WEBP',quality=82,method=6,exact=True)
              local_dimensions = list(image.size)

            local_raw = local_path.read_bytes()
            local_sha = hashlib.sha256(local_raw).hexdigest()
            if local_sha != authorized['expected_local_sha256'] or len(local_raw) != authorized['expected_local_bytes']:
              raise SystemExit(f'{cid} exact local bytes drift')
            if local_dimensions != authorized['expected_local_dimensions']:
              raise SystemExit(f'{cid} local dimensions drift')
            if cid == 'ENG-TECH-0019' and local_dimensions != [350,262]:
              raise SystemExit('ENG-TECH-0019 must remain native 350x262 without upscale')

            attribution = review.get('attribution_requirement') or attribution_fallback[cid]
            item = {
              'card_id': cid,
              'system_name': review['system_name'],
              'origin_url': review['origin_url'],
              'source_title': review['source_title'],
              'source_type': review.get('source_type'),
              'author_rightsholder': review['author_rightsholder'],
              'license': review['license'],
              'license_url': review['license_url'],
              'attribution_requirement': attribution,
              'identity_evidence': review['identity_evidence'],
              'license_evidence': review['license_evidence'],
              'reviewed_at': review['reviewed_at'],
              'review_batch': review['review_batch'],
              'source_file_name': source_name,
              'source_acquisition_url': acquisition_url,
              'source_sha256': source_sha,
              'source_bytes': len(source_raw),
              'source_dimensions': source_dimensions,
              'local_image_path': local_rel,
              'local_sha256': local_sha,
              'local_bytes': len(local_raw),
              'local_dimensions': local_dimensions,
              'modifications': 'EXIF orientation normalized; resized only if long edge >1600 px; WebP quality 82 with Pillow 11.3.0, method 6, exact=True; no crop, no upscale and no editorial alteration.',
            }
            if authorized.get('quality_limitation'):
              item['quality_limitation'] = authorized['quality_limitation']
            manifest['entries'].append(item)

          (root/'photo-local-acquisitions/v4652-wave3-ready-for-import.json').write_text(
            json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          PY

      - name: Validate archived media contract
        shell: bash
        run: |
          set -euo pipefail
          node --test docs/engineer-osint/tests/v4601-ready-photo-acquisition.test.mjs
          python3 - <<'PY'
          import json, pathlib
          manifest=json.loads(pathlib.Path('docs/engineer-osint/photo-local-acquisitions/v4652-wave3-ready-for-import.json').read_text(encoding='utf-8'))
          expected={'ENG-TECH-0014','ENG-TECH-0015','ENG-TECH-0018','ENG-TECH-0019','ENG-TECH-0020','ENG-TECH-0038','ENG-TECH-0041'}
          if len(manifest.get('entries',[]))!=7 or {x['card_id'] for x in manifest['entries']}!=expected:
            raise SystemExit('wave-3 acquisition manifest exact card set mismatch')
          PY

      - name: Commit only exact authorized persistent paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed={
            'docs/engineer-osint/assets/photos/eng-tech-0014-blt-arjun.webp',
            'docs/engineer-osint/assets/photos/eng-tech-0015-short-span-bridge-10m.webp',
            'docs/engineer-osint/assets/photos/eng-tech-0018-jgsdf-combat-engineer-vehicle.webp',
            'docs/engineer-osint/assets/photos/eng-tech-0019-type-92-floating-bridge.webp',
            'docs/engineer-osint/assets/photos/eng-tech-0020-type-83-mine-laying-system.webp',
            'docs/engineer-osint/assets/photos/eng-tech-0038-mv-10.webp',
            'docs/engineer-osint/assets/photos/eng-tech-0041-uran-6.webp',
            'docs/engineer-osint/photo-local-acquisitions/v4652-wave3-ready-for-import.json',
          }
          status=subprocess.check_output(['git','status','--porcelain=v1'],text=True)
          changed={line[3:] for line in status.splitlines() if line.strip()}
          if changed!=allowed:
            raise SystemExit(f'dirty path allowlist mismatch: {sorted(changed)}')
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if staged!=allowed:
            raise SystemExit(f'staged path allowlist mismatch: {sorted(staged)}')
          PY
          git config user.name 'ENGINEER OSINT acquisition bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'v4.6.52: archive exact wave-3 reviewed photos'
          git push origin HEAD:chatgpt/engineer-osint-v4652-wave3-photo-acquisition-execution
