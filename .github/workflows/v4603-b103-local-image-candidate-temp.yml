name: ENGINEER OSINT temporary v4.6.03 B103 local-image candidate builder

on:
  push:
    branches: [chatgpt/engineer-osint-v4603-b103-local-image-candidate]
    paths: [.github/workflows/v4603-b103-local-image-candidate-temp.yml]

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build deterministic B103 candidate
        run: node docs/engineer-osint/build-v4603-b103-local-image-candidate.mjs
      - name: Validate standard dry-run and focused regression
        run: |
          node docs/engineer-osint/append-run.mjs docs/engineer-osint/osint-publication-candidates/v4603-b103-local-images.json
          node --test docs/engineer-osint/tests/v4603-b103-local-image-candidate.test.mjs docs/engineer-osint/tests/v4570-local-image-contract.test.mjs
          git diff --check
      - name: Commit generated review artifacts
        run: |
          git config user.name "ENGINEER OSINT candidate bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/engineer-osint/osint-publication-candidates/v4603-b103-local-images.json docs/engineer-osint/photo-review-candidates/v4603-b103-local-image-status.json docs/engineer-osint/V4603_B103_LOCAL_IMAGE_CANDIDATE_READINESS.json
          git diff --cached --check
          git commit -m "v4.6.03: stage exact B103 local-image canonical candidate"
          git push origin HEAD:chatgpt/engineer-osint-v4603-b103-local-image-candidate
# rerun after exact batch acquired_at correction
