name: ENGINEER OSINT identity-fix retirement readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout persistent B99 state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test complete P0/P1 contract
        env:
          B106_CI_NOTES_COMMIT: ${{ vars.B106_CI_NOTES_COMMIT }}
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          [[ "$B106_CI_NOTES_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$B106_CI_NOTES_COMMIT" != 0000000000000000000000000000000000000000 ]]
          unset NODE_OPTIONS
          for inherited_git_var in ${!GIT_@}; do unset "$inherited_git_var"; done
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_TERMINAL_PROMPT=0 GIT_NO_REPLACE_OBJECTS=1
          runner_temp="$(realpath -- "$RUNNER_TEMP")"
          checkout_root="$(pwd -P)"
          case "$runner_temp/" in "$checkout_root/"*) exit 1 ;; esac
          case "$checkout_root/" in "$runner_temp/"*) exit 1 ;; esac
          node -e 'const fs=require("node:fs");const s=fs.statfsSync(process.env.RUNNER_TEMP,{bigint:true});if(s.bavail*s.bsize<13000000000n)throw Error("13GB disk gate");'
          timeout 30s git fetch --no-tags --depth=1 origin refs/notes/b106-ci-fixture:refs/notes/b106-ci-fixture
          [[ "$(git rev-parse --verify refs/notes/b106-ci-fixture)" == "$B106_CI_NOTES_COMMIT" ]]
          source_commit=1df9875a50d5ad47188d0ba4a262ea11e3e65693
          timeout 30s git fetch --no-tags --depth=1 origin "$source_commit"
          pr1_commit=58171850e92da3cc61a94a85f615eadbf6d9419c
          pr1_tree=1baffdf744fe0bf07f7db0ac859013c253190ef8
          timeout 30s git fetch --no-tags --depth=1 origin "$pr1_commit"
          [[ "$(git rev-parse "$pr1_commit^{tree}")" == "$pr1_tree" ]] || exit 1
          git ls-tree -rz "$pr1_tree" >/dev/null
          source_dir="$(mktemp -d "$runner_temp/b106-source.XXXXXX")"
          timeout 30s git -c core.hooksPath=/dev/null worktree add --detach "$source_dir" "$source_commit"
          export B106_EXTERNAL_SOURCE_FIXTURE_DIR="$source_dir/"
          fixture_receipt="$(node docs/engineer-osint/ci/prepare-b106-fixture.mjs)"
          fixture_path="$(printf '%s' "$fixture_receipt" | node -e 'let s="";process.stdin.on("data",b=>s+=b);process.stdin.on("end",()=>{const a=JSON.parse(s);if(typeof a.fixturePath!=="string"||/[\r\n]/.test(a.fixturePath)||a.execution_allowed!==false)throw Error("invalid fixture receipt");process.stdout.write(a.fixturePath);});')"
          export B106_EXTERNAL_INVENTORY_FIXTURE="$fixture_path"
          node --import ./docs/engineer-osint/ci/b106-root-preload.mjs --test docs/engineer-osint/tests/*.test.mjs

      - name: Validate append-only canonical chain
        run: node docs/engineer-osint/validate-patch.mjs

      - name: Build production-style artifact
        run: node docs/engineer-osint/build-pages.mjs

      - name: Materialize canonical media
        run: node docs/engineer-osint/materialize-canonical-media-history.mjs

      - name: Inject source-derived media materialization
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='docs/engineer-osint-dist/index.html';
          const js=fs.readFileSync('docs/engineer-osint/media-source-materialization.js','utf8');
          if(/<\/script/i.test(js)) throw new Error('unsafe literal </script in media source module');
          let h=fs.readFileSync(p,'utf8');
          const anchor='<script id="engineer-ui-phase7-media-module">';
          if(!h.includes('engineer-media-source-materialization')){
            const script=`<script id="engineer-media-source-materialization">${js}</script>`;
            h=h.includes(anchor)?h.replace(anchor,script+anchor):h.replace('</body>',script+'</body>');
          }
          fs.writeFileSync(p,h);
          NODE

      - name: Detect identity retirement phase
        id: retirement
        run: |
          node --input-type=module - <<'NODE' >> "$GITHUB_OUTPUT"
          import {LEGACY_FACTUAL_OVERLAY_MODULES,PUBLIC_RUNTIME_MODULES} from './docs/engineer-osint/runtime-modules.mjs';
          const file='data-integrity-identity-fixes.js',id='engineer-data-integrity-identity-fixes-module';
          const legacy=LEGACY_FACTUAL_OVERLAY_MODULES.map(([,f])=>f);
          const publicActive=PUBLIC_RUNTIME_MODULES.some(([runtimeId,f])=>runtimeId===id&&f===file);
          if(legacy.length===1&&legacy[0]===file&&publicActive)console.log('phase=PRE_RETIREMENT');
          else if(legacy.length===0&&!publicActive)console.log('phase=POST_RETIREMENT');
          else throw new Error(`partial/inconsistent identity retirement state legacy=${legacy.join(',')} public=${publicActive}`);
          NODE

      - name: Audit persistent B99 identity baseline
        run: node docs/engineer-osint/audit-persistent-b99-identity.mjs

      - name: Build fail-closed identity retirement readiness evidence
        if: steps.retirement.outputs.phase == 'PRE_RETIREMENT'
        run: node docs/engineer-osint/audit-identity-fix-retirement-readiness.mjs

      - name: Verify pre-browser readiness safety boundary
        if: steps.retirement.outputs.phase == 'PRE_RETIREMENT'
        run: |
          git diff --exit-code -- docs/engineer-osint/data
          node - <<'NODE'
          const fs=require('fs');
          const p='docs/engineer-osint-dist/identity-fix-retirement-readiness-audit.json';
          const a=JSON.parse(fs.readFileSync(p,'utf8'));
          if(a.status!=='PASS'||a.identity_overlay_residual_mutations!==0||a.other_public_runtime_sentinel_consumer_count!==0)throw new Error('identity retirement pre-browser evidence mismatch');
          if(a.active_legacy_factual_module_count!==1||a.identity_fix_runtime_active!==true||a.built_identity_script_count!==1||a.simulated_no_identity_script_count!==0)throw new Error('identity retirement runtime scope mismatch');
          if(a.browser_normalized_dom_parity!==null||a.browser_parity_evidence_pending!==true||a.ready_for_separate_retirement_authorization_review!==false)throw new Error('browser readiness state broadened before browser proof');
          for(const key of ['canonical_write_performed','run_store_manifest_edit_performed','identity_fix_runtime_removal_authorized','identity_overlay_retirement_authorized','runtime_manifest_edit_authorized','identity_fix_file_deletion_authorized','legacy_baseline_edit_authorized'])if(a[key]!==false)throw new Error(`identity retirement safety boundary broadened: ${key}`);
          NODE

      - name: Headless browser active vs simulated retired parity
        if: steps.retirement.outputs.phase == 'PRE_RETIREMENT'
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          active="${GITHUB_WORKSPACE}/docs/engineer-osint-dist/v4544-identity-active.html"
          retired="${GITHUB_WORKSPACE}/docs/engineer-osint-dist/v4544-identity-retired-simulated.html"
          for pair in "active:$active" "retired:$retired"; do
            key="${pair%%:*}"; path="${pair#*:}"
            "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --allow-file-access-from-files --virtual-time-budget=5000 --dump-dom "file://${path}" > "/tmp/v4544-${key}-dom.html"
            test -s "/tmp/v4544-${key}-dom.html"
            grep -qi '<html' "/tmp/v4544-${key}-dom.html"
            grep -q 'ENGINEER OSINT' "/tmp/v4544-${key}-dom.html"
          done
          grep -q 'engineer-data-integrity-identity-fixes-module' /tmp/v4544-active-dom.html
          ! grep -q 'engineer-data-integrity-identity-fixes-module' /tmp/v4544-retired-dom.html
          python - <<'PY'
          from pathlib import Path
          import re, hashlib, html
          bilingual=re.compile(
              r'(?P<open><(?P<tag>[A-Za-z][A-Za-z0-9:-]*)\b(?=[^>]*\bdata-label-cs="(?P<cs>[^"]*)")(?=[^>]*\bdata-label-en="(?P<en>[^"]*)")[^>]*>)'
              r'(?P<text>[^<>]*)(?P<close></(?P=tag)>)',re.I)
          def canon(m):
              text=html.unescape(m.group('text')).strip(); cs=html.unescape(m.group('cs')).strip(); en=html.unescape(m.group('en')).strip()
              return m.group('open')+m.group('cs')+m.group('close') if text in {cs,en} else m.group(0)
          def norm(path):
              s=Path(path).read_text(errors='replace')
              s=re.sub(r'<script\b[^>]*>[\s\S]*?</script>','',s,flags=re.I)
              s=bilingual.sub(canon,s)
              return re.sub(r'\s+',' ',s).strip()
          a=norm('/tmp/v4544-active-dom.html'); b=norm('/tmp/v4544-retired-dom.html')
          if a!=b: raise SystemExit('HEADLESS_IDENTITY_RETIREMENT_PARITY: normalized DOM differs')
          digest=hashlib.sha256(a.encode()).hexdigest()
          Path('/tmp/v4544-browser-parity.txt').write_text(f'PASS sha256={digest}\n')
          print(f'HEADLESS_IDENTITY_RETIREMENT_PARITY=PASS sha256={digest}')
          PY

      - name: Mark readiness evidence browser-complete without authorizing retirement
        if: steps.retirement.outputs.phase == 'PRE_RETIREMENT'
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='docs/engineer-osint-dist/identity-fix-retirement-readiness-audit.json';
          const a=JSON.parse(fs.readFileSync(p,'utf8'));
          a.browser_normalized_dom_parity=true;
          a.browser_parity_evidence_pending=false;
          a.ready_for_separate_retirement_authorization_review=true;
          if(a.identity_fix_runtime_removal_authorized!==false||a.identity_overlay_retirement_authorized!==false||a.runtime_manifest_edit_authorized!==false||a.identity_fix_file_deletion_authorized!==false||a.legacy_baseline_edit_authorized!==false)throw new Error('browser completion broadened retirement authorization');
          fs.writeFileSync(p,JSON.stringify(a,null,2)+'\n');
          fs.appendFileSync('docs/engineer-osint-dist/health.txt','identity_fix_retirement_browser_parity=pass\nidentity_fix_retirement_ready_for_separate_authorization_review=1\nidentity_fix_retirement_authorized=0\n');
          console.log('IDENTITY_FIX_RETIREMENT_READINESS=PASS_NO_AUTHORIZATION');
          NODE

      - name: Audit authorized post-retirement state
        if: steps.retirement.outputs.phase == 'POST_RETIREMENT'
        run: |
          node docs/engineer-osint/audit-identity-fix-retirement.mjs
          git diff --exit-code -- docs/engineer-osint/data
          node - <<'NODE'
          const fs=require('fs');
          const p='docs/engineer-osint-dist/identity-fix-retirement-audit.json';
          const a=JSON.parse(fs.readFileSync(p,'utf8'));
          if(a.status!=='PASS'||a.identity_fix_runtime_active!==false||a.identity_fix_runtime_retired!==true||a.identity_fix_source_retained!==true)throw new Error('post-retirement identity state mismatch');
          if(a.active_legacy_factual_module_count!==0||a.active_legacy_baseline_module_count!==0||a.historical_identity_source_residual_mutations!==0||a.other_public_runtime_sentinel_consumer_count!==0)throw new Error('post-retirement zero-debt proof failed');
          if(a.built_identity_script_count!==0||a.transition_guard_runtime_active!==true||a.transition_guard_script_count!==1)throw new Error('post-retirement runtime contract failed');
          if(a.canonical_write_performed!==false||a.run_store_manifest_edit_performed!==false||a.run_appended!==false||a.source_file_deleted!==false||a.other_runtime_module_removed!==false)throw new Error('post-retirement safety boundary broadened');
          console.log('IDENTITY_FIX_RETIREMENT_READINESS=HISTORICAL_READY_CURRENT_RETIRED_VALIDATED');
          NODE

      - name: Upload retirement readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-fix-retirement-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            docs/engineer-osint-dist/identity-fix-retirement-readiness-audit.json
            docs/engineer-osint-dist/identity-fix-retirement-readiness-audit.md
            docs/engineer-osint-dist/identity-fix-retirement-audit.json
            docs/engineer-osint-dist/identity-fix-retirement-audit.md
            docs/engineer-osint-dist/persistent-b99-identity-audit.json
            docs/engineer-osint-dist/v4544-identity-active.html
            docs/engineer-osint-dist/v4544-identity-retired-simulated.html
            /tmp/v4544-active-dom.html
            /tmp/v4544-retired-dom.html
            /tmp/v4544-browser-parity.txt
            docs/engineer-osint-dist/health.txt
