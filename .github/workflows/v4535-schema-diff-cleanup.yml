name: v4.5.35 schema diff cleanup

on:
  push:
    branches:
      - chatgpt/engineer-osint-v4535-explicit-legacy-mirror-sync
    paths:
      - '.github/workflows/v4535-schema-diff-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/engineer-osint-v4535-explicit-legacy-mirror-sync
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore main schema formatting and apply minimal contract diff
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/v4535-schema.py
          python /tmp/v4535-schema.py
          node --test docs/engineer-osint/tests/*.test.mjs
          node docs/engineer-osint/validate-patch.mjs
          git diff --check
      - name: Enforce exact result and commit cleanup
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'docs/engineer-osint/schemas/patch-v1.schema.json'
          ! git diff --name-only | grep -E '^docs/engineer-osint/data/(run-store-manifest\.json|runs/)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/engineer-osint/schemas/patch-v1.schema.json
          git commit -m 'v4.5.35 minimize legacy mirror sync schema diff'
          git rm .github/workflows/v4535-schema-diff-cleanup.yml
          git commit -m 'v4.5.35 remove schema cleanup bootstrap'
          git push origin HEAD:chatgpt/engineer-osint-v4535-explicit-legacy-mirror-sync
