name: ENGINEER OSINT temporary v4.6.02 visible-local-photo patcher

on:
  push:
    branches: [chatgpt/engineer-osint-v4602-visible-local-photos]
    paths: [.github/workflows/v4602-visible-local-photos-temp.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply exact patch
        run: python3 docs/engineer-osint/tools/v4602-patch-temp.py
      - name: Verify focused tests
        run: |
          node --check docs/engineer-osint/ui-v43-entity-detail.js
          node --check docs/engineer-osint/build-pages.mjs
          node --test docs/engineer-osint/tests/v4601-ready-photo-acquisition.test.mjs docs/engineer-osint/tests/v4602-local-photo-card-visibility.test.mjs
      - name: Commit patch
        run: |
          git config user.name "ENGINEER OSINT patch bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/engineer-osint/build-pages.mjs docs/engineer-osint/ui-v43-entity-detail.js docs/engineer-osint/MASTER_PROMPT.md docs/engineer-osint/tests/v4602-local-photo-card-visibility.test.mjs
          git diff --cached --check
          git commit -m "v4.6.02: render archived photos on every matching card"
          git push origin HEAD:chatgpt/engineer-osint-v4602-visible-local-photos
