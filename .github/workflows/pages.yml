name: Deploy ENGINEER OSINT to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/engineer-osint/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: engineer-osint-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate UI modules
        run: |
          node --check docs/engineer-osint/ui-phase2.js
          node --check docs/engineer-osint/ui-phase3.js
          node --check docs/engineer-osint/ui-phase4.js
          node --check docs/engineer-osint/ui-phase5.js
          node --check docs/engineer-osint/ui-phase6-i18n.js
          node --check docs/engineer-osint/ui-phase7-media.js
          node --check docs/engineer-osint/ui-phase8-navigation.js
          node --check docs/engineer-osint/postprocess-ui.mjs
      - name: Build dashboard
        run: node docs/engineer-osint/build-pages.mjs
      - name: Verify dashboard
        run: |
          test -s docs/engineer-osint-dist/index.html
          test -s docs/engineer-osint-dist/health.txt
          cat docs/engineer-osint-dist/health.txt
          grep -q 'status=SUCCESS' docs/engineer-osint-dist/health.txt
          grep -q 'entity_navigation=enabled' docs/engineer-osint-dist/health.txt
          grep -q 'grouped_navigation=enabled' docs/engineer-osint-dist/health.txt
          grep -q 'entity_id_search=enabled' docs/engineer-osint-dist/health.txt
          grep -q 'translation_audit_view=enabled' docs/engineer-osint-dist/health.txt
          grep -q 'engineer-ui-phase8-navigation-module' docs/engineer-osint-dist/index.html
          grep -q 'engineerCompactNav' docs/engineer-osint-dist/index.html
          grep -q 'engineerDatabaseGroup' docs/engineer-osint-dist/index.html
          grep -q 'engineerEntityFilter' docs/engineer-osint-dist/index.html
          grep -q 'ENG-UNIT-' docs/engineer-osint-dist/index.html
          grep -q 'ENG-SIG-' docs/engineer-osint-dist/index.html
          grep -q "default_language:'cs'" docs/engineer-osint-dist/index.html
          grep -q 'ENG-SIG-0006' docs/engineer-osint-dist/index.html
          grep -q 'experimentální doprava ženijního prostředku' docs/engineer-osint-dist/index.html
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('docs/engineer-osint/b11-patch.json','utf8')); const h=fs.readFileSync('docs/engineer-osint-dist/health.txt','utf8'); if(!h.includes('run='+p.state.run_id)) throw new Error('health RUN_ID mismatch');"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/engineer-osint-dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

