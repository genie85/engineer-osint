name: Deploy ENGINEER OSINT to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/engineer-osint/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: engineer-osint-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate UI and i18n modules
        run: |
          set -euo pipefail
          node --check docs/engineer-osint/ui-phase2.js
          node --check docs/engineer-osint/ui-phase3.js
          node --check docs/engineer-osint/ui-phase4.js
          node --check docs/engineer-osint/ui-phase5.js
          node --check docs/engineer-osint/ui-phase6-i18n.js
          node --check docs/engineer-osint/ui-phase7-media.js
          node --check docs/engineer-osint/ui-phase8-navigation.js
          node --check docs/engineer-osint/ui-phase9-intelligence.js
          node --check docs/engineer-osint/public-cz-ui-canary.js
          node --check docs/engineer-osint/i18n-content-cs-public-cz-backlog.js
          node --check docs/engineer-osint/audit-public-cz-ui.mjs
          node --check docs/engineer-osint/media-source-materialization.js
          node --check docs/engineer-osint/audit-media-history.mjs
          node --check docs/engineer-osint/rich-backfill.js
          node --check docs/engineer-osint/rich-backfill-israel-turkiye-eod.js
          node --check docs/engineer-osint/rich-backfill-usa-rok.js
          node --check docs/engineer-osint/i18n-content-cs.js
          node --check docs/engineer-osint/i18n-content-cs-usa-rok.js
          node --check docs/engineer-osint/i18n-content-cs-japan-australia.js
          node --check docs/engineer-osint/i18n-content-cs-france-germany-poland.js
          node --check docs/engineer-osint/i18n-content-cs-israel-turkiye-rich.js
          node --check docs/engineer-osint/i18n-content-cs-events-backlog.js
          node --check docs/engineer-osint/build-pages.mjs
          node --check docs/engineer-osint/postprocess-ui.mjs
          node --check docs/engineer-osint/validate-runtime.mjs

      - name: Build full-history dashboard
        run: node docs/engineer-osint/build-pages.mjs

      - name: Inject source-derived media materialization
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='docs/engineer-osint-dist/index.html';
          const js=fs.readFileSync('docs/engineer-osint/media-source-materialization.js','utf8');
          let h=fs.readFileSync(p,'utf8');
          const anchor='<script id="engineer-ui-phase7-media-module">';
          if(!h.includes('engineer-media-source-materialization')){
            const script=`<script id="engineer-media-source-materialization">${js}</script>`;
            h=h.includes(anchor)?h.replace(anchor,script+anchor):h.replace('</body>',script+'</body>');
          }
          fs.writeFileSync(p,h);
          NODE

      - name: Audit full-history multimedia records
        run: node docs/engineer-osint/audit-media-history.mjs

      - name: Inject PUBLIC-CZ-UI backlog translation batch
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='docs/engineer-osint-dist/index.html';
          const js=fs.readFileSync('docs/engineer-osint/i18n-content-cs-public-cz-backlog.js','utf8');
          let h=fs.readFileSync(p,'utf8');
          if(!h.includes('engineer-i18n-content-cs-public-cz-backlog-module')) h=h.replace('</body>',`<script id="engineer-i18n-content-cs-public-cz-backlog-module">${js}</script></body>`);
          fs.writeFileSync(p,h);
          NODE

      - name: Inject public CZ UI canary localization
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='docs/engineer-osint-dist/index.html';
          const js=fs.readFileSync('docs/engineer-osint/public-cz-ui-canary.js','utf8');
          let h=fs.readFileSync(p,'utf8');
          if(!h.includes('engineer-public-cz-ui-canary')) h=h.replace('</body>',`<script id="engineer-public-cz-ui-canary">${js}</script></body>`);
          fs.writeFileSync(p,h);
          NODE

      - name: Audit cumulative runtime
        continue-on-error: true
        run: node docs/engineer-osint/validate-runtime.mjs

      - name: Audit PUBLIC-CZ-UI runtime
        run: node docs/engineer-osint/audit-public-cz-ui.mjs

      - name: Verify deployable artifact and freshness
        run: |
          set -euo pipefail
          test -s docs/engineer-osint-dist/index.html
          test -s docs/engineer-osint-dist/health.txt
          test -s docs/engineer-osint-dist/media-history-audit.json
          test -s docs/engineer-osint-dist/media-history-audit.md
          test -s docs/engineer-osint-dist/public-cz-ui-audit.json
          test -s docs/engineer-osint-dist/public-cz-ui-audit.md
          cat docs/engineer-osint-dist/health.txt
          cat docs/engineer-osint-dist/media-history-audit.md
          cat docs/engineer-osint-dist/public-cz-ui-audit.md
          grep -q 'status=SUCCESS' docs/engineer-osint-dist/health.txt
          grep -q 'patch_history_materialization=enabled' docs/engineer-osint-dist/health.txt
          grep -q 'patch_continuity=complete' docs/engineer-osint-dist/health.txt
          grep -q 'engineer-ui-phase8-navigation-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-ui-phase9-intelligence-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-media-source-materialization' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-content-cs-public-cz-backlog-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-public-cz-ui-canary' docs/engineer-osint-dist/index.html
          grep -q "default_language:'cs'" docs/engineer-osint-dist/index.html
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('docs/engineer-osint/b11-patch.json','utf8')); const h=fs.readFileSync('docs/engineer-osint-dist/health.txt','utf8'); if(!h.includes('run='+p.state.run_id)) throw new Error('health RUN_ID mismatch: artifact is stale'); console.log('Deploying current run',p.state.run_id);"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/engineer-osint-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
