name: Deploy ENGINEER OSINT to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/engineer-osint/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: engineer-osint-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate UI and i18n modules
        run: |
          set -euo pipefail
          for file in docs/engineer-osint/*.js docs/engineer-osint/*.mjs docs/engineer-osint/lib/*.mjs; do
            node --check "$file"
          done

      - name: Test P0 integrity contract
        run: node --test docs/engineer-osint/tests/*.test.mjs

      - name: Validate patch and full history
        run: node docs/engineer-osint/validate-patch.mjs

      - name: Build full-history dashboard
        run: node docs/engineer-osint/build-pages.mjs

      - name: Materialize canonical media from full patch history
        run: node docs/engineer-osint/materialize-canonical-media-history.mjs

      - name: Inject source-derived media materialization
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='docs/engineer-osint-dist/index.html';
          const js=fs.readFileSync('docs/engineer-osint/media-source-materialization.js','utf8');
          if(/<\/script/i.test(js)) throw new Error('unsafe literal </script in media source module');
          let h=fs.readFileSync(p,'utf8');
          const anchor='<script id="engineer-ui-phase7-media-module">';
          if(!h.includes('engineer-media-source-materialization')){
            const script=`<script id="engineer-media-source-materialization">${js}</script>`;
            h=h.includes(anchor)?h.replace(anchor,script+anchor):h.replace('</body>',script+'</body>');
          }
          fs.writeFileSync(p,h);
          NODE

      - name: Audit full-history multimedia records
        run: node docs/engineer-osint/audit-media-history.mjs

      - name: Gate current-run media sweep and audit persistence backlog
        run: node docs/engineer-osint/validate-media-coverage.mjs

      - name: Audit cumulative runtime
        run: node docs/engineer-osint/validate-runtime.mjs

      - name: Audit PUBLIC-CZ-UI runtime
        run: node docs/engineer-osint/audit-public-cz-ui.mjs

      - name: Verify deployable artifact and freshness
        run: |
          set -euo pipefail
          test -s docs/engineer-osint-dist/index.html
          test -s docs/engineer-osint-dist/health.txt
          test -s docs/engineer-osint-dist/media-history-audit.json
          test -s docs/engineer-osint-dist/media-history-audit.md
          test -s docs/engineer-osint-dist/media-coverage-qa.json
          test -s docs/engineer-osint-dist/media-coverage-qa.md
          test -s docs/engineer-osint-dist/public-cz-ui-audit.json
          test -s docs/engineer-osint-dist/public-cz-ui-audit.md
          cat docs/engineer-osint-dist/health.txt
          cat docs/engineer-osint-dist/media-history-audit.md
          cat docs/engineer-osint-dist/media-coverage-qa.md
          cat docs/engineer-osint-dist/public-cz-ui-audit.md
          grep -q 'status=SUCCESS' docs/engineer-osint-dist/health.txt
          grep -q 'patch_history_materialization=enabled' docs/engineer-osint-dist/health.txt
          grep -q 'patch_continuity=DEGRADED_LEGACY_ACKNOWLEDGED' docs/engineer-osint-dist/health.txt
          grep -q 'legacy_malformed_revisions=3' docs/engineer-osint-dist/health.txt
          grep -q 'legacy_duplicate_runs=5' docs/engineer-osint-dist/health.txt
          grep -q 'legacy_parent_gaps=3' docs/engineer-osint-dist/health.txt
          grep -q 'legacy_factual_overlays=pinned-migration-debt' docs/engineer-osint-dist/health.txt
          grep -q 'localization_mutation_violations=0' docs/engineer-osint-dist/health.txt
          grep -q 'canonical_export_snapshot=legacy-overlay-resolved' docs/engineer-osint-dist/health.txt
          grep -q 'runtime_audit=pass' docs/engineer-osint-dist/health.txt
          grep -q 'engineer-ui-phase8-navigation-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-ui-phase9-intelligence-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-media-source-materialization' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-content-cs-public-cz-backlog-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-content-cs-public-cz-2110-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-content-cs-public-cz-0633-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-public-cz-ui-canary' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-runtime-switch-fix' docs/engineer-osint-dist/index.html
          grep -q 'CZ_EN_CZ_DYNAMIC_CONTENT' docs/engineer-osint-dist/index.html
          grep -q 'FULL_GIT_HISTORY_CANONICAL_MEDIA' docs/engineer-osint-dist/index.html
          grep -q "default_language:'cs'" docs/engineer-osint-dist/index.html
          node -e "const fs=require('fs'); const q=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/media-coverage-qa.json','utf8')); if(q.publish_gate?.pass!==true) throw new Error('current-run media publish gate failed'); console.log('Current-run media gate PASS',q.current_run?.run_id);"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('docs/engineer-osint/b11-patch.json','utf8')); const h=fs.readFileSync('docs/engineer-osint-dist/health.txt','utf8'); if(!h.includes('run='+p.state.run_id)) throw new Error('health RUN_ID mismatch: artifact is stale'); console.log('Deploying current run',p.state.run_id);"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/engineer-osint-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
