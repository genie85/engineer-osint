name: Deploy ENGINEER OSINT to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/engineer-osint/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: engineer-osint-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build dashboard
        run: node docs/engineer-osint/build-pages.mjs
      - name: Verify dashboard
        run: |
          test -s docs/engineer-osint-dist/index.html
          test -s docs/engineer-osint-dist/health.txt
          cat docs/engineer-osint-dist/health.txt
          grep -q 'status=SUCCESS' docs/engineer-osint-dist/health.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/engineer-osint-dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

