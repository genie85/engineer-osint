name: Deploy ENGINEER OSINT to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/engineer-osint/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: engineer-osint-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_name: ${{ steps.pages-artifact-name.outputs.name }}
    steps:
      - name: Checkout canonical snapshot and append-only runs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate UI and i18n modules
        run: |
          set -euo pipefail
          for file in docs/engineer-osint/*.js docs/engineer-osint/*.mjs docs/engineer-osint/lib/*.mjs; do
            node --check "$file"
          done

      - name: Test P0/P1 integrity contract
        run: node --test docs/engineer-osint/tests/*.test.mjs

      - name: Validate canonical snapshot and append-only chain
        run: node docs/engineer-osint/validate-patch.mjs

      - name: Build canonical snapshot dashboard
        run: node docs/engineer-osint/build-pages.mjs

      - name: Materialize canonical media from snapshot and append-only runs
        run: node docs/engineer-osint/materialize-canonical-media-history.mjs

      - name: Inject source-derived media materialization
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='docs/engineer-osint-dist/index.html';
          const js=fs.readFileSync('docs/engineer-osint/media-source-materialization.js','utf8');
          if(/<\/script/i.test(js)) throw new Error('unsafe literal </script in media source module');
          let h=fs.readFileSync(p,'utf8');
          const anchor='<script id="engineer-ui-phase7-media-module">';
          if(!h.includes('engineer-media-source-materialization')){
            const script=`<script id="engineer-media-source-materialization">${js}</script>`;
            h=h.includes(anchor)?h.replace(anchor,script+anchor):h.replace('</body>',script+'</body>');
          }
          fs.writeFileSync(p,h);
          NODE

      - name: Audit canonical multimedia records
        run: node docs/engineer-osint/audit-media-history.mjs

      - name: Gate current-run media sweep and audit persistence backlog
        run: node docs/engineer-osint/validate-media-coverage.mjs

      - name: Audit cumulative runtime
        run: node docs/engineer-osint/validate-runtime.mjs

      - name: Audit overlay retirement readiness
        run: node docs/engineer-osint/audit-overlay-retirement.mjs

      - name: Strict dry-run overlay canonical migration
        run: node docs/engineer-osint/audit-overlay-migration-dry-run.mjs

      - name: Audit overlay provenance readiness
        run: node docs/engineer-osint/audit-overlay-provenance.mjs

      - name: Preview resolved overlay production migration
        run: node docs/engineer-osint/audit-overlay-production-preview.mjs

      - name: Build exact Stage A migration candidate
        run: node docs/engineer-osint/build-overlay-stage-a-candidate.mjs

      - name: Validate Stage A candidate through append-run dry-run
        run: |
          set -euo pipefail
          manifest='docs/engineer-osint/data/run-store-manifest.json'
          runs_dir='docs/engineer-osint/data/runs'
          candidate='docs/engineer-osint-dist/overlay-stage-a-patch-candidate.json'
          plan='docs/engineer-osint-dist/overlay-stage-a-append-plan.json'
          manifest_before=$(sha256sum "$manifest" | awk '{print $1}')
          runs_before=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          node docs/engineer-osint/append-run.mjs "$candidate" > "$plan"
          manifest_after=$(sha256sum "$manifest" | awk '{print $1}')
          runs_after=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          test "$manifest_before" = "$manifest_after"
          test "$runs_before" = "$runs_after"
          git diff --exit-code -- docs/engineer-osint/data
          node - <<'NODE'
          const fs=require('fs');
          const meta=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/overlay-stage-a-patch-candidate-meta.json','utf8'));
          const plan=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/overlay-stage-a-append-plan.json','utf8'));
          if(plan.status!=='VALIDATED_DRY_RUN')throw new Error('append-run did not remain a dry-run');
          if(plan.entry?.run_id!=='engineer-osint-20260829-B96'||plan.entry?.parent_run_id!=='engineer-osint-20260826-B95')throw new Error('append-plan identity mismatch');
          if(plan.entry?.path!=='data/runs/engineer-osint-20260829-B96.json')throw new Error('append-plan path mismatch');
          if(plan.entry?.file_sha256!==meta.candidate_file_sha256)throw new Error('append-plan file hash differs from candidate meta');
          if(plan.entry?.parent_canonical_sha256!==meta.parent_canonical_sha256)throw new Error('append-plan parent canonical hash mismatch');
          if(!/^[a-f0-9]{64}$/.test(plan.entry?.canonical_sha256||''))throw new Error('append-plan canonical hash invalid');
          if(plan.entry.canonical_sha256===plan.entry.parent_canonical_sha256)throw new Error('Stage A candidate unexpectedly produces no canonical change');
          fs.appendFileSync('docs/engineer-osint-dist/health.txt',`overlay_stage_a_append_plan=pass\noverlay_stage_a_append_plan_status=validated-dry-run\noverlay_stage_a_append_plan_run=${plan.entry.run_id}\noverlay_stage_a_append_plan_parent_sha=${plan.entry.parent_canonical_sha256}\noverlay_stage_a_append_plan_candidate_file_sha=${plan.entry.file_sha256}\noverlay_stage_a_append_plan_result_sha=${plan.entry.canonical_sha256}\noverlay_stage_a_append_plan_persistent_writes=0\n`);
          console.log('Stage A append-run dry-run PASS',plan.entry);
          NODE

      - name: Audit residual overlay impact after Stage A candidate
        run: node docs/engineer-osint/audit-overlay-stage-a-impact.mjs

      - name: Explicitly gate Stage B/C migration artifacts
        run: node docs/engineer-osint/verify-stage-bc-pages-gate.mjs

      - name: Audit PUBLIC-CZ-UI runtime
        run: node docs/engineer-osint/audit-public-cz-ui-latest.mjs

      - name: Gate PUBLIC-CZ regression ratchet
        run: node docs/engineer-osint/validate-public-cz-regression.mjs

      - name: Verify deployable artifact and freshness
        run: |
          set -euo pipefail
          test -s docs/engineer-osint-dist/index.html
          test -s docs/engineer-osint-dist/health.txt
          test -s docs/engineer-osint-dist/media-history-audit.json
          test -s docs/engineer-osint-dist/media-history-audit.md
          test -s docs/engineer-osint-dist/media-coverage-qa.json
          test -s docs/engineer-osint-dist/media-coverage-qa.md
          test -s docs/engineer-osint-dist/public-cz-ui-audit.json
          test -s docs/engineer-osint-dist/public-cz-ui-audit.md
          test -s docs/engineer-osint-dist/overlay-retirement-audit.json
          test -s docs/engineer-osint-dist/overlay-retirement-audit.md
          test -s docs/engineer-osint-dist/overlay-migration-map.json
          test -s docs/engineer-osint-dist/overlay-migration-map.md
          test -s docs/engineer-osint-dist/overlay-migration-dry-run.json
          test -s docs/engineer-osint-dist/overlay-migration-dry-run.md
          test -s docs/engineer-osint-dist/overlay-provenance-audit.json
          test -s docs/engineer-osint-dist/overlay-provenance-audit.md
          test -s docs/engineer-osint-dist/overlay-production-migration-preview.json
          test -s docs/engineer-osint-dist/overlay-production-migration-preview.md
          test -s docs/engineer-osint-dist/overlay-stage-a-patch-candidate.json
          test -s docs/engineer-osint-dist/overlay-stage-a-patch-candidate-meta.json
          test -s docs/engineer-osint-dist/overlay-stage-a-append-plan.json
          test -s docs/engineer-osint-dist/overlay-stage-a-impact-preview.json
          test -s docs/engineer-osint-dist/overlay-stage-a-impact-preview.md
          test -s docs/engineer-osint-dist/overlay-stage-b-intelligence-audit.json
          test -s docs/engineer-osint-dist/overlay-stage-b-intelligence-audit.md
          test -s docs/engineer-osint-dist/overlay-stage-b-gap-patch-candidate.json
          test -s docs/engineer-osint-dist/overlay-assessment-evidence-audit.json
          test -s docs/engineer-osint-dist/overlay-assessment-evidence-audit.md
          test -s docs/engineer-osint-dist/overlay-stage-c-assessment-evidence-candidate.json
          cat docs/engineer-osint-dist/health.txt
          cat docs/engineer-osint-dist/overlay-retirement-audit.md
          sed -n '1,140p' docs/engineer-osint-dist/overlay-migration-map.md
          cat docs/engineer-osint-dist/overlay-migration-dry-run.md
          cat docs/engineer-osint-dist/overlay-provenance-audit.md
          cat docs/engineer-osint-dist/overlay-production-migration-preview.md
          cat docs/engineer-osint-dist/overlay-stage-a-patch-candidate-meta.json
          cat docs/engineer-osint-dist/overlay-stage-a-append-plan.json
          cat docs/engineer-osint-dist/overlay-stage-a-impact-preview.md
          cat docs/engineer-osint-dist/overlay-stage-b-intelligence-audit.md
          cat docs/engineer-osint-dist/overlay-assessment-evidence-audit.md
          cat docs/engineer-osint-dist/media-history-audit.md
          cat docs/engineer-osint-dist/media-coverage-qa.md
          cat docs/engineer-osint-dist/public-cz-ui-audit.md
          grep -q 'status=SUCCESS' docs/engineer-osint-dist/health.txt
          grep -q 'run_store=append-only-v1' docs/engineer-osint-dist/health.txt
          grep -q 'patch_history_materialization=snapshot-chain' docs/engineer-osint-dist/health.txt
          grep -q 'patch_continuity=SNAPSHOT_CHAIN_COMPLETE' docs/engineer-osint-dist/health.txt
          grep -q 'legacy_history_status=DEGRADED_LEGACY_ACKNOWLEDGED' docs/engineer-osint-dist/health.txt
          grep -q 'legacy_malformed_revisions=3' docs/engineer-osint-dist/health.txt
          grep -q 'legacy_duplicate_runs=5' docs/engineer-osint-dist/health.txt
          grep -q 'legacy_parent_gaps=3' docs/engineer-osint-dist/health.txt
          grep -q 'legacy_factual_overlays=pinned-migration-debt' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_retirement_audit=pass' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_retirement_policy=zero-current-mutations' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_migration_map=pass' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_migration_dry_run=pass' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_migration_dry_run_canonical_writes=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_migration_dry_run_safe_to_retire=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_provenance_audit=pass' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_provenance_unclassified=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_provenance_integrity_errors=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_provenance_safe_to_append=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_provenance_canonical_writes=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_production_preview=pass' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_production_preview_stage_a_strict=pass' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_production_preview_stage_a_ops=104' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_production_preview_stage_a_sources=15' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_production_preview_stage_b_intelligence=19' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_production_preview_no_write=18' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_production_preview_unresolved_errors=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_production_preview_safe_to_append=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_production_preview_safe_to_retire=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_production_preview_canonical_writes=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_a_candidate=pass' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_a_candidate_run=engineer-osint-20260829-B96' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_a_candidate_parent=engineer-osint-20260826-B95' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_a_candidate_ops=104' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_a_candidate_sources=15' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_a_candidate_safe_to_append=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_a_candidate_canonical_writes=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_a_append_plan=pass' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_a_append_plan_status=validated-dry-run' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_a_append_plan_persistent_writes=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_a_impact=pass' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_a_impact_unexpected=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_a_impact_stage_b_pending=19' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_a_impact_retirement_ready=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_a_impact_canonical_writes=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_b_intelligence=pass' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_b_gap_candidates=15' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_b_assessment_candidates=4' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_b_assessments_materialized=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_b_assessment_binding_blockers=4' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_b_explicit_evidence_matches=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_b_unexpected_residuals=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_b_safe_to_append=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_b_safe_to_retire=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_b_canonical_writes=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_assessment_evidence=pass' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_assessment_evidence_candidates=2' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_assessment_native_assessments=4' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_assessment_native_analytical_preserved=19' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_assessment_unsupported_legacy_implications=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_assessment_unexpected_residuals=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_assessment_safe_to_append=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_assessment_safe_to_retire=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_assessment_canonical_writes=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_bc_pages_gate=pass' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_bc_pages_gate_artifacts=6' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_bc_pages_gate_native_analytical=19' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_bc_pages_gate_unexpected_residuals=0' docs/engineer-osint-dist/health.txt
          grep -q 'overlay_stage_bc_pages_gate_canonical_writes=0' docs/engineer-osint-dist/health.txt
          grep -q 'localization_mutation_violations=0' docs/engineer-osint-dist/health.txt
          grep -q 'canonical_export_snapshot=legacy-overlay-resolved' docs/engineer-osint-dist/health.txt
          grep -q 'runtime_audit=pass' docs/engineer-osint-dist/health.txt
          grep -q 'engineer-ui-phase8-navigation-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-ui-phase9-intelligence-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-media-source-materialization' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-content-cs-public-cz-backlog-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-content-cs-public-cz-2110-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-content-cs-public-cz-0633-module' docs/engineer-osint-dist/index.html
          grep -q 'engineer-public-cz-ui-canary' docs/engineer-osint-dist/index.html
          grep -q 'engineer-i18n-runtime-switch-fix' docs/engineer-osint-dist/index.html
          grep -q 'CZ_EN_CZ_DYNAMIC_CONTENT' docs/engineer-osint-dist/index.html
          grep -q 'CANONICAL_SNAPSHOT_PLUS_APPEND_ONLY_RUNS' docs/engineer-osint-dist/index.html
          grep -q "default_language:'cs'" docs/engineer-osint-dist/index.html
          node -e "const fs=require('fs'); const q=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/media-coverage-qa.json','utf8')); if(q.publish_gate?.pass!==true) throw new Error('current-run media publish gate failed'); console.log('Current-run media gate PASS',q.current_run?.run_id);"
          node -e "const fs=require('fs'); const q=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/overlay-retirement-audit.json','utf8')); if(q.status!=='PASS'||q.policy!=='ZERO_CURRENT_MUTATIONS_REQUIRED_BEFORE_RUNTIME_RETIREMENT') throw new Error('overlay retirement audit invalid'); if(q.module_count!==q.ready_count+q.blocked_count) throw new Error('overlay retirement audit count mismatch'); console.log('Overlay retirement gate',q.ready_count,'ready,',q.blocked_count,'blocked');"
          node -e "const fs=require('fs'); const q=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/overlay-migration-map.json','utf8')); const r=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/overlay-retirement-audit.json','utf8')); if(q.status!=='PASS'||q.schema_version!=='engineer-osint-overlay-migration-map-v1') throw new Error('overlay migration map invalid'); if(q.total_overlay_leaf_mutations!==r.total_current_mutations) throw new Error('overlay migration leaf count mismatch'); if(q.canonical_leaf_mutations+q.overlay_meta_mutations!==q.total_overlay_leaf_mutations) throw new Error('overlay migration decomposition mismatch'); console.log('Overlay migration map',q.migration_candidate_count,'candidates,',q.manual_review_candidates,'manual review');"
          node -e "const fs=require('fs'); const q=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/overlay-migration-dry-run.json','utf8')); if(q.status!=='PASS'||q.schema_version!=='engineer-osint-overlay-migration-dry-run-v1') throw new Error('overlay migration dry-run invalid'); if(q.canonical_write_performed!==false||q.append_run_invoked!==false||q.safe_to_append!==false||q.safe_to_retire_overlays!==false) throw new Error('dry-run safety contract violated'); if(q.unexpected_residual_signatures!==0) throw new Error('unexpected canonical dry-run residuals'); console.log('Overlay migration dry-run',q.exact_equivalence_modules,'exact,',q.canonical_equivalent_with_mirror_debt_modules,'canonical+mirror-debt,',q.partial_manual_modules,'partial,',q.legacy_mirror_debt_modules,'mirror-debt modules,',q.manual_candidates,'manual');"
          node -e "const fs=require('fs'); const q=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/overlay-provenance-audit.json','utf8')); if(q.status!=='PASS'||q.schema_version!=='engineer-osint-overlay-provenance-audit-v1') throw new Error('overlay provenance audit invalid'); if(q.canonical_write_performed!==false||q.append_run_invoked!==false||q.safe_to_append!==false||q.safe_to_retire_overlays!==false) throw new Error('provenance safety contract violated'); if(q.unclassified_candidates!==0||q.source_scope_mismatches!==0||q.source_locator_review_required!==0||q.integrity_error_count!==0) throw new Error('provenance review has unresolved classification/integrity errors'); console.log('Overlay provenance gate',q.candidate_count,'classified candidates,',q.reviewed_source_backed_candidates,'source-backed,',q.further_review_candidates,'further-review');"
          node -e "const fs=require('fs'); const q=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/overlay-production-migration-preview.json','utf8')); if(q.status!=='PASS'||q.schema_version!=='engineer-osint-overlay-production-preview-v1') throw new Error('overlay production preview invalid'); if(q.canonical_write_performed!==false||q.append_run_invoked!==false||q.production_operation_ids_generated!==false||q.production_run_id_generated!==false||q.safe_to_append!==false||q.safe_to_retire_overlays!==false) throw new Error('production preview safety contract violated'); if(q.stage_a?.strict_preview_status!=='PASS'||q.unresolved_error_count!==0) throw new Error('production preview has unresolved structural errors'); console.log('Overlay production preview',q.stage_a.operation_templates,'Stage A ops,',q.stage_a.source_appends,'sources,',q.stage_b.candidate_count,'Intelligence v1 candidates,',q.no_write.candidate_count,'no-write');"
          node -e "const fs=require('fs'); const q=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/overlay-stage-a-patch-candidate-meta.json','utf8')); const p=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/overlay-stage-a-append-plan.json','utf8')); if(q.status!=='PASS'||q.schema_version!=='engineer-osint-stage-a-patch-candidate-meta-v1') throw new Error('Stage A candidate meta invalid'); if(p.status!=='VALIDATED_DRY_RUN'||p.entry.file_sha256!==q.candidate_file_sha256||p.entry.parent_canonical_sha256!==q.parent_canonical_sha256) throw new Error('Stage A append plan mismatch'); if(q.safe_to_append!==false||q.safe_to_retire_overlays!==false||q.canonical_write_performed!==false) throw new Error('Stage A candidate safety contract violated'); console.log('Stage A candidate exact append plan',p.entry);"
          node -e "const fs=require('fs'); const q=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/overlay-stage-a-impact-preview.json','utf8')); if(q.status!=='PASS'||q.schema_version!=='engineer-osint-stage-a-impact-audit-v1') throw new Error('Stage A impact invalid'); if(q.unexpected_signature_count!==0||q.retirement_ready_after_stage_a!==false||q.safe_to_append!==false||q.safe_to_retire_overlays!==false) throw new Error('Stage A residual/retirement contract violated'); console.log('Stage A impact',q.residual_signature_count,'residual signatures,',q.residual_factual_leaf_mutations,'factual leafs,',q.stage_b_intelligence_candidates,'Stage B pending');"
          node -e "const fs=require('fs'); const b=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/overlay-stage-b-intelligence-audit.json','utf8')); const c=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/overlay-assessment-evidence-audit.json','utf8')); if(b.status!=='PASS'||b.schema_version!=='engineer-osint-stage-b-intelligence-audit-v1'||b.native_gap_candidate_count!==15||b.assessment_candidate_count!==4||b.unexpected_residual_signatures?.length!==0) throw new Error('Stage B final artifact verification failed'); if(c.status!=='PASS'||c.schema_version!=='engineer-osint-assessment-evidence-audit-v1'||c.evidence_candidate_count!==2||c.assessment_candidate_count!==4||c.native_analytical_candidates_preserved!==19||c.unexpected_residual_signatures?.length!==0) throw new Error('Stage C final artifact verification failed'); console.log('Stage B/C final artifact gate PASS');"
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('docs/engineer-osint/data/run-store-manifest.json','utf8')); const run=m.runs.at(-1)?.run_id||m.snapshot.run_id; const h=fs.readFileSync('docs/engineer-osint-dist/health.txt','utf8'); if(!h.includes('run='+run)) throw new Error('health RUN_ID mismatch: artifact is stale'); console.log('Deploying current run',run);"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Select rerun-safe Pages artifact name
        id: pages-artifact-name
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.pages-artifact-name.outputs.name }}
          path: docs/engineer-osint-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact_name }}
