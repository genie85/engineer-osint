name: Deploy ENGINEER OSINT to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/engineer-osint/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/engineer-osint/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: engineer-osint-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_name: ${{ steps.pages-artifact-name.outputs.name }}
    steps:
      - name: Checkout canonical snapshot and append-only runs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate UI and i18n modules
        run: |
          set -euo pipefail
          for file in docs/engineer-osint/*.js docs/engineer-osint/*.mjs docs/engineer-osint/lib/*.mjs; do
            node --check "$file"
          done

      - name: Test P0/P1 integrity contract
        run: node --test docs/engineer-osint/tests/*.test.mjs

      - name: Validate canonical snapshot and append-only chain
        run: node docs/engineer-osint/validate-patch.mjs

      - name: Build canonical snapshot dashboard
        run: node docs/engineer-osint/build-pages.mjs

      - name: Materialize canonical media from snapshot and append-only runs
        run: node docs/engineer-osint/materialize-canonical-media-history.mjs

      - name: Inject source-derived media materialization
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='docs/engineer-osint-dist/index.html';
          const js=fs.readFileSync('docs/engineer-osint/media-source-materialization.js','utf8');
          if(/<\/script/i.test(js)) throw new Error('unsafe literal </script in media source module');
          let h=fs.readFileSync(p,'utf8');
          const anchor='<script id="engineer-ui-phase7-media-module">';
          if(!h.includes('engineer-media-source-materialization')){
            const script=`<script id="engineer-media-source-materialization">${js}</script>`;
            h=h.includes(anchor)?h.replace(anchor,script+anchor):h.replace('</body>',script+'</body>');
          }
          fs.writeFileSync(p,h);
          NODE

      - name: Audit canonical multimedia records
        run: node docs/engineer-osint/audit-media-history.mjs

      - name: Gate current-run media sweep and audit persistence backlog
        run: node docs/engineer-osint/validate-media-coverage.mjs

      - name: Audit cumulative runtime
        run: node docs/engineer-osint/validate-runtime.mjs

      - name: Audit overlay retirement readiness
        run: node docs/engineer-osint/audit-overlay-retirement.mjs

      - name: Detect canonical migration phase
        id: migration-phase
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('docs/engineer-osint/data/run-store-manifest.json','utf8'));
          const runs=manifest.runs||[];
          const run=runs.at(-1)?.run_id||manifest.snapshot.run_id;
          const b98Index=runs.findIndex(item=>item.run_id==='engineer-osint-20260830-B98');
          let phase;
          if(run==='engineer-osint-20260826-B95')phase='PRE_B96';
          else if(run==='engineer-osint-20260829-B96')phase='POST_B96';
          else if(run==='engineer-osint-20260830-B97')phase='POST_B97';
          else if(run==='engineer-osint-20260830-B98')phase='POST_B98';
          else if(b98Index>=0&&runs.length-1>b98Index)phase='POST_B98_STEADY';
          else throw new Error(`Unsupported canonical migration phase at ${run}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`phase=${phase}\nrun=${run}\n`);
          console.log(`Canonical migration phase ${phase}: ${run}`);
          NODE

      - name: Strict dry-run overlay canonical migration
        if: steps.migration-phase.outputs.phase == 'PRE_B96'
        run: node docs/engineer-osint/audit-overlay-migration-dry-run.mjs

      - name: Audit overlay provenance readiness
        if: steps.migration-phase.outputs.phase == 'PRE_B96'
        run: node docs/engineer-osint/audit-overlay-provenance.mjs

      - name: Preview resolved overlay production migration
        if: steps.migration-phase.outputs.phase == 'PRE_B96'
        run: node docs/engineer-osint/audit-overlay-production-preview.mjs

      - name: Build exact Stage A migration candidate
        if: steps.migration-phase.outputs.phase == 'PRE_B96'
        run: node docs/engineer-osint/build-overlay-stage-a-candidate.mjs

      - name: Validate Stage A candidate through append-run dry-run
        if: steps.migration-phase.outputs.phase == 'PRE_B96'
        run: |
          set -euo pipefail
          manifest='docs/engineer-osint/data/run-store-manifest.json'
          runs_dir='docs/engineer-osint/data/runs'
          candidate='docs/engineer-osint-dist/overlay-stage-a-patch-candidate.json'
          plan='docs/engineer-osint-dist/overlay-stage-a-append-plan.json'
          manifest_before=$(sha256sum "$manifest" | awk '{print $1}')
          runs_before=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          node docs/engineer-osint/append-run.mjs "$candidate" > "$plan"
          manifest_after=$(sha256sum "$manifest" | awk '{print $1}')
          runs_after=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          test "$manifest_before" = "$manifest_after"
          test "$runs_before" = "$runs_after"
          git diff --exit-code -- docs/engineer-osint/data
          node - <<'NODE'
          const fs=require('fs');
          const meta=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/overlay-stage-a-patch-candidate-meta.json','utf8'));
          const plan=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/overlay-stage-a-append-plan.json','utf8'));
          if(plan.status!=='VALIDATED_DRY_RUN')throw new Error('append-run did not remain a dry-run');
          if(plan.entry?.run_id!=='engineer-osint-20260829-B96'||plan.entry?.parent_run_id!=='engineer-osint-20260826-B95')throw new Error('append-plan identity mismatch');
          if(plan.entry?.path!=='data/runs/engineer-osint-20260829-B96.json')throw new Error('append-plan path mismatch');
          if(plan.entry?.file_sha256!==meta.candidate_file_sha256)throw new Error('append-plan file hash differs from candidate meta');
          if(plan.entry?.parent_canonical_sha256!==meta.parent_canonical_sha256)throw new Error('append-plan parent canonical hash mismatch');
          if(!/^[a-f0-9]{64}$/.test(plan.entry?.canonical_sha256||''))throw new Error('append-plan canonical hash invalid');
          if(plan.entry.canonical_sha256===plan.entry.parent_canonical_sha256)throw new Error('Stage A candidate unexpectedly produces no canonical change');
          fs.appendFileSync('docs/engineer-osint-dist/health.txt',`overlay_stage_a_append_plan=pass\noverlay_stage_a_append_plan_status=validated-dry-run\noverlay_stage_a_append_plan_run=${plan.entry.run_id}\noverlay_stage_a_append_plan_parent_sha=${plan.entry.parent_canonical_sha256}\noverlay_stage_a_append_plan_candidate_file_sha=${plan.entry.file_sha256}\noverlay_stage_a_append_plan_result_sha=${plan.entry.canonical_sha256}\noverlay_stage_a_append_plan_persistent_writes=0\n`);
          console.log('Stage A append-run dry-run PASS',plan.entry);
          NODE

      - name: Audit residual overlay impact after Stage A candidate
        if: steps.migration-phase.outputs.phase == 'PRE_B96'
        run: node docs/engineer-osint/audit-overlay-stage-a-impact.mjs

      - name: Explicitly gate Stage B/C migration artifacts
        if: steps.migration-phase.outputs.phase == 'PRE_B96'
        run: node docs/engineer-osint/verify-stage-bc-pages-gate.mjs

      - name: Preview fail-closed legacy overlay compatibility transition
        if: steps.migration-phase.outputs.phase == 'PRE_B96'
        run: node docs/engineer-osint/audit-overlay-compat-transition.mjs

      - name: Simulate post-B96 Pages validation before append
        if: steps.migration-phase.outputs.phase == 'PRE_B96'
        run: node docs/engineer-osint/audit-persistent-b96.mjs --simulate-from-candidate

      - name: Audit persistent B96 post-append state
        if: steps.migration-phase.outputs.phase == 'POST_B96'
        run: node docs/engineer-osint/audit-persistent-b96.mjs

      - name: Simulate post-B97 Pages validation before append
        if: steps.migration-phase.outputs.phase == 'POST_B96'
        run: node docs/engineer-osint/audit-persistent-b97.mjs --simulate-from-candidate

      - name: Audit persistent B97 post-append state
        if: steps.migration-phase.outputs.phase == 'POST_B97'
        run: node docs/engineer-osint/audit-persistent-b97.mjs

      - name: Build exact B98 candidate for post-B98 Pages simulation
        if: steps.migration-phase.outputs.phase == 'POST_B97'
        run: |
          set -euo pipefail
          manifest='docs/engineer-osint/data/run-store-manifest.json'
          runs_dir='docs/engineer-osint/data/runs'
          manifest_before=$(sha256sum "$manifest" | awk '{print $1}')
          runs_before=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          node docs/engineer-osint/build-b98-readiness.mjs
          manifest_after=$(sha256sum "$manifest" | awk '{print $1}')
          runs_after=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          test "$manifest_before" = "$manifest_after"
          test "$runs_before" = "$runs_after"
          git diff --exit-code -- docs/engineer-osint/data

      - name: Dry-run exact B98 for Pages simulation
        if: steps.migration-phase.outputs.phase == 'POST_B97'
        run: |
          set -euo pipefail
          candidate='docs/engineer-osint-dist/b98-patch-candidate.json'
          plan='docs/engineer-osint-dist/b98-pages-append-plan.json'
          manifest='docs/engineer-osint/data/run-store-manifest.json'
          runs_dir='docs/engineer-osint/data/runs'
          manifest_before=$(sha256sum "$manifest" | awk '{print $1}')
          runs_before=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          node docs/engineer-osint/append-run.mjs "$candidate" > "$plan"
          manifest_after=$(sha256sum "$manifest" | awk '{print $1}')
          runs_after=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          test "$manifest_before" = "$manifest_after"
          test "$runs_before" = "$runs_after"
          git diff --exit-code -- docs/engineer-osint/data
          node - <<'NODE'
          const fs=require('fs');
          const policy=JSON.parse(fs.readFileSync('docs/engineer-osint/V4525_B98_POST_CI_READINESS.json','utf8'));
          const plan=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/b98-pages-append-plan.json','utf8'));
          if(plan.status!=='VALIDATED_DRY_RUN')throw new Error('B98 Pages append helper did not remain dry-run');
          if(plan.entry?.run_id!==policy.candidate_run_id||plan.entry?.parent_run_id!==policy.expected_parent_run_id)throw new Error('B98 Pages plan identity mismatch');
          if(plan.entry?.parent_canonical_sha256!==policy.expected_parent_canonical_sha256||plan.entry?.file_sha256!==policy.exact_candidate_file_sha256||plan.entry?.canonical_sha256!==policy.expected_resulting_canonical_sha256)throw new Error('B98 Pages exact hash contract mismatch');
          console.log('B98 Pages dry-run exact hash contract PASS');
          NODE

      - name: Simulate post-B98 Pages validation before append
        if: steps.migration-phase.outputs.phase == 'POST_B97'
        run: node docs/engineer-osint/audit-persistent-b98.mjs --simulate-from-generated

      - name: Audit persistent B98 post-append state
        if: steps.migration-phase.outputs.phase == 'POST_B98'
        run: node docs/engineer-osint/audit-persistent-b98.mjs

      - name: Audit post-B98 steady state and first-three semantic parity
        if: steps.migration-phase.outputs.phase == 'POST_B98' || steps.migration-phase.outputs.phase == 'POST_B98_STEADY'
        run: node docs/engineer-osint/audit-post-b98-steady-state.mjs

      - name: Gate POST_B98 Pages readiness
        run: node docs/engineer-osint/verify-post-b98-pages-readiness.mjs

      - name: Audit PUBLIC-CZ-UI runtime
        run: node docs/engineer-osint/audit-public-cz-ui-latest.mjs

      - name: Gate PUBLIC-CZ regression ratchet
        run: node docs/engineer-osint/validate-public-cz-regression.mjs

      - name: Verify deployable artifact and freshness
        run: node docs/engineer-osint/verify-pages-artifact.mjs

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Select rerun-safe Pages artifact name
        if: github.event_name != 'pull_request'
        id: pages-artifact-name
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.pages-artifact-name.outputs.name }}
          path: docs/engineer-osint-dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact_name }}
