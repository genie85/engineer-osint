name: ENGINEER OSINT B99 guarded one-shot publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b99-one-shot-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  B99_RESULT_BRANCH: automation/b99-append-result-v1

jobs:
  publish-review-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout activation main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fail closed on baseline and pre-existing result branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          test ! -e docs/engineer-osint/data/runs/engineer-osint-20260830-B99.json
          node docs/engineer-osint/validate-patch.mjs
          current=$(node -e "const m=require('./docs/engineer-osint/data/run-store-manifest.json');console.log(m.runs.at(-1).run_id)")
          test "$current" = "engineer-osint-20260830-B98"
          if git ls-remote --exit-code --heads origin "$B99_RESULT_BRANCH" >/dev/null 2>&1; then
            echo "Result branch already exists: $B99_RESULT_BRANCH" >&2
            exit 1
          fi

      - name: Test complete P0/P1 contract
        run: node --test docs/engineer-osint/tests/*.test.mjs

      - name: Build required production-style audit artifact
        run: |
          set -euo pipefail
          node docs/engineer-osint/build-pages.mjs
          test -s docs/engineer-osint-dist/index.html
          node docs/engineer-osint/materialize-canonical-media-history.mjs

      - name: Regenerate exact B99 mirror-synchronized candidate
        run: |
          set -euo pipefail
          node docs/engineer-osint/build-identity-fix-b99-mirror-sync-candidate.mjs
          sha256sum docs/engineer-osint-dist/identity-fix-b99-mirror-sync-candidate.json
          test "$(sha256sum docs/engineer-osint-dist/identity-fix-b99-mirror-sync-candidate.json | awk '{print $1}')" = "ff4aec190cd5db28bca9a70ed7099183770610dff97820aa9d1facd5e384c2ab"

      - name: Standard append helper exact dry-run
        run: |
          set -euo pipefail
          git diff --exit-code -- docs/engineer-osint/data/run-store-manifest.json docs/engineer-osint/data/runs
          node docs/engineer-osint/append-run.mjs docs/engineer-osint-dist/identity-fix-b99-mirror-sync-candidate.json > docs/engineer-osint-dist/b99-one-shot-dry-run.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/b99-one-shot-dry-run.json','utf8'));
          if(p.status!=='VALIDATED_DRY_RUN')throw new Error('B99 one-shot dry-run status mismatch');
          if(p.entry?.run_id!=='engineer-osint-20260830-B99'||p.entry?.parent_run_id!=='engineer-osint-20260830-B98')throw new Error('B99 one-shot dry-run identity mismatch');
          if(p.entry?.file_sha256!=='ff4aec190cd5db28bca9a70ed7099183770610dff97820aa9d1facd5e384c2ab'||p.entry?.canonical_sha256!=='754b42bae6205aff71a8f5fdcaf3217313ccdd9089145219314d8b9497f84a30')throw new Error('B99 one-shot dry-run hash mismatch');
          NODE
          git diff --exit-code -- docs/engineer-osint/data/run-store-manifest.json docs/engineer-osint/data/runs

      - name: Guarded local B99 append
        run: |
          set -euo pipefail
          node docs/engineer-osint/append-run.mjs docs/engineer-osint-dist/identity-fix-b99-mirror-sync-candidate.json --write > docs/engineer-osint-dist/b99-one-shot-write.json
          node docs/engineer-osint/validate-patch.mjs
          node docs/engineer-osint/audit-persistent-b99-identity.mjs
          node docs/engineer-osint/verify-b99-pages-readiness.mjs

      - name: Prove B99 current-run media gate after local append
        run: |
          set -euo pipefail
          node docs/engineer-osint/build-pages.mjs
          node docs/engineer-osint/materialize-canonical-media-history.mjs
          node docs/engineer-osint/audit-media-history.mjs
          node docs/engineer-osint/validate-media-coverage.mjs
          node - <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/media-coverage-qa.json','utf8'));
          if(q.publish_gate?.pass!==true)throw new Error('B99 current-run media gate failed');
          if(q.current_run?.run_id!=='engineer-osint-20260830-B99')throw new Error('B99 media current-run identity mismatch');
          if(q.current_run?.multimedia_status_basis!=='HASH_PINNED_REPORT_ATTESTATION')throw new Error('B99 media attestation basis mismatch');
          if(q.current_run?.multimedia_status_exception_id!=='MEDIA-SWEEP-ATTEST-B99-IDENTITY-FIX-MIGRATION')throw new Error('B99 media exception mismatch');
          NODE

      - name: Require exact two-file append diff
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            {
              git diff --name-only -- docs/engineer-osint/data
              git ls-files --others --exclude-standard -- docs/engineer-osint/data
            } | sort -u
          )
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "docs/engineer-osint/data/run-store-manifest.json"
          test "${changed[1]}" = "docs/engineer-osint/data/runs/engineer-osint-20260830-B99.json"
          test "$(sha256sum docs/engineer-osint/data/runs/engineer-osint-20260830-B99.json | awk '{print $1}')" = "ff4aec190cd5db28bca9a70ed7099183770610dff97820aa9d1facd5e384c2ab"
          git diff --exit-code -- . ':!docs/engineer-osint/data/run-store-manifest.json' ':!docs/engineer-osint/data/runs/engineer-osint-20260830-B99.json'

      - name: Push isolated B99 review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$B99_RESULT_BRANCH"
          git add docs/engineer-osint/data/run-store-manifest.json docs/engineer-osint/data/runs/engineer-osint-20260830-B99.json
          git commit -m "data: append exact reviewed B99 identity migration"
          git push origin "$B99_RESULT_BRANCH"

      - name: Upload one-shot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b99-one-shot-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            docs/engineer-osint-dist/b99-one-shot-dry-run.json
            docs/engineer-osint-dist/b99-one-shot-write.json
            docs/engineer-osint-dist/identity-fix-b99-mirror-sync-candidate-audit.json
            docs/engineer-osint-dist/persistent-b99-identity-audit.json
            docs/engineer-osint-dist/media-coverage-qa.json
