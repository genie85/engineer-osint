name: v4.5.32 apply REMOVE_FIELD contract

on:
  push:
    branches:
      - chatgpt/engineer-osint-v4532-remove-field-operation

permissions:
  contents: write

env:
  TARGET_BRANCH: chatgpt/engineer-osint-v4532-remove-field-operation

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v4532-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact REMOVE_FIELD edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          run_store=Path('docs/engineer-osint/lib/run-store.mjs')
          text=run_store.read_text()
          old="ensure(['REPLACE_FIELD','REMOVE_REFERENCE','RETRACT'].includes(operation.op),`${at}.op is unsupported`);"
          new="ensure(['REPLACE_FIELD','REMOVE_REFERENCE','REMOVE_FIELD','RETRACT'].includes(operation.op),`${at}.op is unsupported`);"
          assert text.count(old)==1, text.count(old)
          text=text.replace(old,new)
          old="""    if(operation.op==='REMOVE_REFERENCE')ensure(typeof operation.value==='string'&&operation.value,`${at}.value must identify the removed reference`);\n    if(operation.op==='REPLACE_FIELD')ensure(Object.hasOwn(operation,'value'),`${at}.value is required`);"""
          new="""    if(operation.op==='REMOVE_REFERENCE')ensure(typeof operation.value==='string'&&operation.value,`${at}.value must identify the removed reference`);\n    if(operation.op==='REPLACE_FIELD')ensure(Object.hasOwn(operation,'value'),`${at}.value is required`);\n    if(operation.op==='REMOVE_FIELD')ensure(!Object.hasOwn(operation,'value'),`${at}.value is forbidden for REMOVE_FIELD`);"""
          assert text.count(old)==1, text.count(old)
          text=text.replace(old,new)
          old="""    }else if(operation.op==='REMOVE_REFERENCE'){\n      ensure(!protectedFields.has(operation.field),`Operation ${operation.operation_id} cannot alter protected field ${operation.field}`);\n      ensure(Array.isArray(target[operation.field]),`Operation ${operation.operation_id} target field is not an array`);\n      ensure(target[operation.field].includes(operation.value),`Operation ${operation.operation_id} reference ${operation.value} is absent`);\n      target[operation.field]=target[operation.field].filter(value=>value!==operation.value);\n    }else if(operation.op==='RETRACT')items.splice(index,1);"""
          new="""    }else if(operation.op==='REMOVE_REFERENCE'){\n      ensure(!protectedFields.has(operation.field),`Operation ${operation.operation_id} cannot alter protected field ${operation.field}`);\n      ensure(Array.isArray(target[operation.field]),`Operation ${operation.operation_id} target field is not an array`);\n      ensure(target[operation.field].includes(operation.value),`Operation ${operation.operation_id} reference ${operation.value} is absent`);\n      target[operation.field]=target[operation.field].filter(value=>value!==operation.value);\n    }else if(operation.op==='REMOVE_FIELD'){\n      ensure(!protectedFields.has(operation.field),`Operation ${operation.operation_id} cannot remove protected field ${operation.field}`);\n      ensure(Object.hasOwn(target,operation.field),`Operation ${operation.operation_id} target field ${operation.field} does not exist`);\n      delete target[operation.field];\n    }else if(operation.op==='RETRACT')items.splice(index,1);"""
          assert text.count(old)==1, text.count(old)
          text=text.replace(old,new)
          run_store.write_text(text)

          schema=Path('docs/engineer-osint/schemas/patch-v1.schema.json')
          text=schema.read_text()
          old='"op": {"enum": ["REPLACE_FIELD", "REMOVE_REFERENCE", "RETRACT"]}'
          new='"op": {"enum": ["REPLACE_FIELD", "REMOVE_REFERENCE", "REMOVE_FIELD", "RETRACT"]}'
          assert text.count(old)==1, text.count(old)
          schema.write_text(text.replace(old,new))

          test=Path('docs/engineer-osint/tests/p1-run-store.test.mjs')
          text=test.read_text()
          marker="""test('strict append materializes a new source and record with provenance',()=>{"""
          assert text.count(marker)==1, text.count(marker)
          block="""test('REMOVE_FIELD deletes an existing top-level field and fails closed on unsafe requests',()=>{\n  const remove=patch();remove.state.counts.CORRECTION=1;remove.extensions.operations_v1=[operation('REMOVE_FIELD',{field:'title'})];\n  const removed=applyStrictPatchToCanonicalData(canonical(),remove);\n  assert.equal(Object.hasOwn(removed.records.records[0],'title'),false);\n\n  const protectedId=patch();protectedId.state.counts.CORRECTION=1;protectedId.extensions.operations_v1=[operation('REMOVE_FIELD',{field:'id'})];\n  assert.throws(()=>applyStrictPatchToCanonicalData(canonical(),protectedId),IntegrityError);\n\n  const missing=patch();missing.state.counts.CORRECTION=1;missing.extensions.operations_v1=[operation('REMOVE_FIELD',{field:'summary'})];\n  assert.throws(()=>applyStrictPatchToCanonicalData(canonical(),missing),IntegrityError);\n\n  const withValue=patch();withValue.state.counts.CORRECTION=1;withValue.extensions.operations_v1=[operation('REMOVE_FIELD',{field:'title',value:null})];\n  assert.throws(()=>validatePatchOperations(withValue),IntegrityError);\n});\n\n"""
          text=text.replace(marker,block+marker)
          old="assert.deepEqual(new Set(schema.$defs.operationV1.properties.op.enum),new Set(['REPLACE_FIELD','REMOVE_REFERENCE','RETRACT']));"
          new="assert.deepEqual(new Set(schema.$defs.operationV1.properties.op.enum),new Set(['REPLACE_FIELD','REMOVE_REFERENCE','REMOVE_FIELD','RETRACT']));"
          assert text.count(old)==1, text.count(old)
          test.write_text(text.replace(old,new))

          Path('.github/workflows/v4532-apply-remove-field.yml').unlink()
          PY
      - name: Validate exact changes
        run: |
          node --check docs/engineer-osint/lib/run-store.mjs
          node --test docs/engineer-osint/tests/p1-run-store.test.mjs
          node --test docs/engineer-osint/tests/*.test.mjs
          git diff --check
          git diff -- docs/engineer-osint/data/run-store-manifest.json docs/engineer-osint/data/runs
      - name: Commit resulting patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v4.5.32 add fail-closed REMOVE_FIELD operation [v4532-applied]'
          git push origin HEAD:${TARGET_BRANCH}
