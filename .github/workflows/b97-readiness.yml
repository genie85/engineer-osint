name: ENGINEER OSINT B97 readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/engineer-osint/**'
      - '.github/workflows/b97-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'docs/engineer-osint/**'
      - '.github/workflows/b97-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineer-osint-b97-readiness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical snapshot and append-only runs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect B97 lifecycle phase
        id: lifecycle
        run: |
          set -euo pipefail
          phase=$(node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('docs/engineer-osint/data/run-store-manifest.json','utf8'));
          const current=manifest.runs.at(-1)?.run_id||manifest.snapshot.run_id;
          if(current==='engineer-osint-20260829-B96')console.log('PRE_B97');
          else if(current==='engineer-osint-20260830-B97')console.log('POST_B97');
          else if(current==='engineer-osint-20260830-B98')console.log('POST_B98');
          else throw new Error(`unsupported B97 readiness lifecycle tip ${current}`);
          NODE
          )
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "B97_LIFECYCLE_PHASE=$phase"

      - name: Test P0/P1 integrity contract
        run: node --test docs/engineer-osint/tests/*.test.mjs

      - name: Validate canonical snapshot and append-only chain
        run: node docs/engineer-osint/validate-patch.mjs

      - name: Build canonical dashboard for current B97 lifecycle phase
        run: node docs/engineer-osint/build-pages.mjs

      - name: Re-audit persistent B96 baseline
        if: steps.lifecycle.outputs.phase == 'PRE_B97'
        run: node docs/engineer-osint/audit-persistent-b96.mjs

      - name: Dry-run exact reviewed B97 through standard append helper
        if: steps.lifecycle.outputs.phase == 'PRE_B97'
        run: |
          set -euo pipefail
          manifest='docs/engineer-osint/data/run-store-manifest.json'
          runs_dir='docs/engineer-osint/data/runs'
          candidate='docs/engineer-osint/V4517_B97_PATCH_CANDIDATE.json'
          plan='docs/engineer-osint-dist/b97-append-plan.json'
          manifest_before=$(sha256sum "$manifest" | awk '{print $1}')
          runs_before=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          node docs/engineer-osint/append-run.mjs "$candidate" > "$plan"
          manifest_after=$(sha256sum "$manifest" | awk '{print $1}')
          runs_after=$(find "$runs_dir" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          test "$manifest_before" = "$manifest_after"
          test "$runs_before" = "$runs_after"
          git diff --exit-code -- docs/engineer-osint/data
          node - <<'NODE'
          const fs=require('fs');
          const policy=JSON.parse(fs.readFileSync('docs/engineer-osint/V4517_B97_READINESS.json','utf8'));
          const plan=JSON.parse(fs.readFileSync('docs/engineer-osint-dist/b97-append-plan.json','utf8'));
          if(plan.status!=='VALIDATED_DRY_RUN')throw new Error('B97 append helper did not remain dry-run');
          if(plan.entry?.run_id!==policy.candidate_run_id||plan.entry?.parent_run_id!==policy.expected_parent_run_id)throw new Error('B97 append plan identity mismatch');
          if(plan.entry?.file_sha256!==policy.exact_candidate_file_sha256||plan.entry?.parent_canonical_sha256!==policy.expected_parent_canonical_sha256)throw new Error('B97 append plan reviewed hash mismatch');
          if(!/^[a-f0-9]{64}$/.test(plan.entry?.canonical_sha256||''))throw new Error('B97 resulting canonical SHA invalid');
          console.log(`B97_DRY_RUN_RESULT_SHA=${plan.entry.canonical_sha256}`);
          NODE

      - name: Audit persistent-B96 to B97 readiness
        if: steps.lifecycle.outputs.phase == 'PRE_B97'
        run: node docs/engineer-osint/audit-b97-readiness.mjs

      - name: Audit persistent B97 post-append state
        if: steps.lifecycle.outputs.phase == 'POST_B97'
        run: node docs/engineer-osint/audit-persistent-b97.mjs

      - name: Verify historical B97 lineage under persistent B98
        if: steps.lifecycle.outputs.phase == 'POST_B98'
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const root='docs/engineer-osint';
          const manifest=JSON.parse(fs.readFileSync(`${root}/data/run-store-manifest.json`,'utf8'));
          const b96='engineer-osint-20260829-B96',b97='engineer-osint-20260830-B97',b98='engineer-osint-20260830-B98';
          const b96Sha='4a2dd9dd1756fd15316741ce2488cb69ad17db3986830e7d20eea9b79693dcd5';
          const b97FileSha='b6a9a123dbeb9e3eab88f4a746198226b741281744305d66141c8ab5e93150ad';
          const b97Sha='9c3e7a53379aa252adfafb0adac98e6a898402daee91663d427fc75331b377d4';
          const b98Sha='4ebc674ce036e3aa8cc77b52ae22f893b38ce345fe37ee0a8700585b34b30201';
          const current=manifest.runs.at(-1);
          if(current?.run_id!==b98||current?.parent_run_id!==b97||current?.parent_canonical_sha256!==b97Sha||current?.canonical_sha256!==b98Sha)throw new Error('B97 historical check requires exact persistent B98 tip');
          const entry=manifest.runs.find(item=>item.run_id===b97);
          if(!entry||entry.parent_run_id!==b96||entry.parent_canonical_sha256!==b96Sha||entry.file_sha256!==b97FileSha||entry.canonical_sha256!==b97Sha)throw new Error('historical B97 manifest lineage/hash drift');
          const raw=fs.readFileSync(`${root}/${entry.path}`,'utf8');
          if(crypto.createHash('sha256').update(raw).digest('hex')!==b97FileSha)throw new Error('historical B97 file SHA drift under B98');
          fs.writeFileSync('docs/engineer-osint-dist/b97-historical-lineage-under-b98.json',JSON.stringify({status:'PASS',mode:'HISTORICAL_B97_UNDER_PERSISTENT_B98',b97_run_id:b97,b97_file_sha256:b97FileSha,b97_canonical_sha256:b97Sha,current_run_id:b98,current_canonical_sha256:b98Sha,canonical_write_performed:false},null,2)+'\n');
          console.log('B97_LIFECYCLE=HISTORICAL_B97_UNDER_PERSISTENT_B98_PASS');
          NODE

      - name: Upload pre-B97 readiness evidence
        if: steps.lifecycle.outputs.phase == 'PRE_B97'
        uses: actions/upload-artifact@v4
        with:
          name: b97-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/engineer-osint-dist/b97-append-plan.json
            docs/engineer-osint-dist/b97-readiness-audit.json
            docs/engineer-osint-dist/b97-readiness-audit.md
            docs/engineer-osint-dist/health.txt

      - name: Upload post-B97 persistence evidence
        if: steps.lifecycle.outputs.phase == 'POST_B97'
        uses: actions/upload-artifact@v4
        with:
          name: b97-persistent-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/engineer-osint-dist/persistent-b97-audit.json
            docs/engineer-osint-dist/persistent-b97-audit.md
            docs/engineer-osint-dist/health.txt

      - name: Upload historical B97-under-B98 evidence
        if: steps.lifecycle.outputs.phase == 'POST_B98'
        uses: actions/upload-artifact@v4
        with:
          name: b97-historical-under-b98-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/engineer-osint-dist/b97-historical-lineage-under-b98.json
            docs/engineer-osint-dist/health.txt
