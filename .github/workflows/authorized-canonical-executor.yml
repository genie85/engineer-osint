name: ENGINEER OSINT canonical execution stop gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/engineer-osint/canonical-execution-requests/*.json'

permissions:
  contents: read

concurrency:
  group: engineer-osint-canonical-execution-stop
  cancel-in-progress: false

jobs:
  blocked:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Block automatic canonical execution
        run: |
          echo 'BLOCK: canonical execution requires a separately reviewed trusted executor.'
          echo 'mergeAuthorized=false'
          exit 1
